name: Setup Java And Gradle
description: Configure Temurin Java and Gradle caching for CI jobs.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: '21'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        # Default is read-only off the default branch — that breaks the
        # api-static → openapi-sync / api-tests / system-tests warm-cache
        # handoff because api-static can't write the cache. Force writes
        # so feature branches share build-cache like main does.
        cache-read-only: false
