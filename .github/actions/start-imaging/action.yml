name: Start the imaging service
description: Build the imaging image and run it as the cluster runs it, for a job whose api converts uploads.

# The api converts every upload through the imaging service (architecture ADR-014), so a job that
# boots it and uploads a picture needs one running. Built from the layers main's image build
# caches, which every pull request may read, or the ones this pull request's imaging job wrote,
# so a build whose service has not changed takes seconds. Run read-only, as nobody and with no
# capabilities. The job then points the api, or its tests, at IMAGING_URL.

inputs:
  port:
    description: Host port the service listens on.
    required: false
    default: '8090'

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Build the imaging image
      shell: bash
      working-directory: services/imaging
      run: |
        docker buildx build --progress=plain --load -t blueshell-website/imaging:ci \
          --cache-from type=gha,scope=imaging-amd64 --cache-from type=gha,scope=imaging .

    - name: Start the imaging service
      shell: bash
      run: |
        docker run -d --name imaging --read-only --cap-drop ALL --security-opt no-new-privileges \
          --memory 1g --cpus 1 -p "${{ inputs.port }}:8080" blueshell-website/imaging:ci
        for _ in $(seq 1 30); do curl -fsS "http://localhost:${{ inputs.port }}/healthz" && break; sleep 1; done
        curl -fsS "http://localhost:${{ inputs.port }}/healthz" || { docker logs imaging; exit 1; }
        echo "IMAGING_URL=http://localhost:${{ inputs.port }}" >> "$GITHUB_ENV"
