# Which jobs in Validate a changed path reaches. `Decide what to validate`
# reads this through scripts/check-diff-buckets.py, which is also what the
# self-test exercises, so the rules CI runs are the rules the test proves.
#
# A bucket claims a path when a pattern takes it and no `!` pattern drops it.
# A changed path no bucket claims runs everything. That is how the Gradle build,
# build-logic, the CI actions, this file and validate.yml reach every suite:
# each can change how all of them build or run.
#
# Each bucket skips work the others would run. docs/agents/ci.md has the table
# of which jobs each one runs.

# The NixOS flake check and the Flux manifest check.
platform:
  - 'platform/**'
  - '!platform/docs/**'
  - 'scripts/check-flux-manifests.sh'
  - 'scripts/regenerate-flux-components.sh'
  - 'scripts/seed-vault-from-env.sh'

# The api suites, and the system tests, which drive the api.
api:
  - 'services/api/**'
  - '!services/api/docker-compose.yml'
  - 'config/detekt/**'
  - 'scripts/scrape-public-events.py'
  - 'scripts/check-changeset-compatibility.py'
  - 'scripts/changeset-sql.sh'

# The frontend suites, and the system tests, which drive the pages.
frontend:
  - 'services/frontend/**'
  - '!services/frontend/docker-compose.yml'

# The system tests and acceptance features alone.
system:
  - 'tests/**'

# The pinger's own Go suite and image. It shares nothing with the jar or the bundle.
pinger:
  - 'services/pinger/**'
  - '!services/pinger/docker-compose.yml'

# What no suite reads. `Workflow checks` runs on every pull request, so a
# workflow other than validate.yml needs no bucket of its own.
# renovate.json turns automerge off for the paths here that Renovate updates,
# since green checks say nothing about them. A new one goes there too.
ignore:
  - '.github/**'
  - '!.github/workflows/validate.yml'
  - '!.github/actions/**'
  - '!.github/buckets.yml'
  - 'scripts/check-workflow-permissions.py'
  - 'scripts/write-release-tag.sh'
  - 'docs/**'
  - 'scripts/check-diff-buckets.py'
  - 'scripts/generate-policy-pdfs.sh'
  - 'scripts/pandoc-html-br.lua'
  - 'scripts/__pycache__/**'
  - 'platform/docs/**'
  - 'infra/dns/**'
  - 'gameart/**'
  - '.idea/**'
  - '*.md'
  - '.editorconfig'
  - '.gitattributes'
  - '.gitignore'
  - 'renovate.json'
  - 'release-please-config.json'
  - '.release-please-manifest.json'
  # The dev stack: compose, its mail server, its env and their scripts. CI starts none of
  # them since the system tests run the jar and the bundle natively (#1284).
  - 'docker-compose.yml'
  - 'docker-compose.oidc-e2e.yml'
  - 'services/*/docker-compose.yml'
  - 'services/stalwart/**'
  - '.env'
  - 'dev-setup.sh'
  - 'scripts/seed-stalwart-accounts.sh'
