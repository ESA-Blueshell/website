# CodeQL advanced-setup configuration.
#
# Used by .github/workflows/codeql.yml. Replaces GitHub's managed
# "default setup", which only ever analysed `actions` and
# `javascript-typescript` here — the Kotlin backend (the bulk of the
# code) was never scanned at all. Advanced setup adds `java-kotlin`
# via a traced Gradle build (on main pushes + the weekly schedule; see
# the workflow) so the backend is covered too.
name: blueshell-codeql

# `security-and-quality` is the broadest first-party suite: it layers
# the maintainability / correctness "quality" queries on top of
# `security-extended`. This is the "Code Quality" half of the request —
# dead code, resource leaks, nullness, inconsistent equals/hashCode,
# useless comparisons, etc., on top of the security queries.
queries:
  - uses: security-and-quality

# `paths-ignore` drops matching results at interpretation time, for every
# language in the scan (not just the interpreted ones) — the CodeQL CLI filters
# SARIF result locations against these globs regardless of build mode. It cannot
# limit what a *traced* build extracts, but it does keep matched files out of the
# reported alerts, which is what matters here.
#
# Generated and vendored code is excluded so findings point at code that is
# actually hand-maintained — scanning the generated OpenAPI clients or the Yarn
# PnP runtime only produces noise nobody can act on.
paths-ignore:
  - services/frontend/src/services/api/blueshell
  - services/frontend/src/services/api/discord
  - services/frontend/.pnp.cjs
  - services/frontend/.pnp.loader.mjs
  - services/frontend/.yarn
  - '**/dist'
  - '**/node_modules'
  - '**/*.min.js'
  - '**/*.gen.ts'
  # Generated Java OpenAPI clients (brevo, discord). These live under each
  # client subproject's build/ output (git-ignored, regenerated by the
  # openapi-client-conventions Gradle plugin) and are dragged into the traced
  # java-kotlin build as a transitive `implementation` dependency of :services:api.
  # They surface unactionable notes (e.g. java/unused-parameter in ApiClient.java),
  # so exclude the generated output from reported results.
  - '**/build/generated/**'
