# Dependabot configuration.
#
# Every ecosystem below defines `groups`, and each group is declared twice —
# once for `version-updates` and once for `security-updates`. Grouping is what
# makes Dependabot fold newly discovered updates into the PR that is already
# open instead of leaving a stale per-dependency PR behind: a grouped PR is
# rebuilt on every run, so the next bump joins the existing branch rather than
# being skipped once the open-PR limit is reached.
#
# Labels are left to Dependabot's defaults (`dependencies` plus the language
# label), which already match the repo's existing dependency PRs.
#
# Each ecosystem also sets a 7-day `cooldown`: a freshly published release
# is not proposed until it has been on the registry for a week. This blunts
# supply-chain attacks that rely on a compromised version being pulled in
# immediately, leaving time for a malicious release to be yanked or flagged
# before it reaches a PR here.
#
# The version-update groups carry only `minor` and `patch` updates. Major
# bumps are excluded from the groups so Dependabot raises one PR per major
# instead — a single grouped PR mixing a breaking major (a framework or
# toolchain jump that needs code changes) with routine updates can never go
# green and blocks the safe updates behind it. Security-update groups are
# left unfiltered: a fix matters regardless of how the version moves.
version: 2

updates:
  # ── Frontend (yarn / npm) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      frontend:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── JVM modules (Gradle) ─────────────────────────────────────────────────
  - package-ecosystem: gradle
    # `/` covers the whole multi-project build; `/build-logic` is a separate
    # `includeBuild` composite the root scan does not reach.
    directories:
      - /
      - /build-logic
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      gradle:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Container base images (Dockerfiles) ──────────────────────────────────
  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/frontend
      - /infra/stalwart
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
