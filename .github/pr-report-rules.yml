# Taxonomy for the pull request report's Changes table (.github/scripts/pr_report.py).
# Ordered: first match wins.
# `*` stops at a path separator, `**` spans them, a trailing `/**` also matches the dir.

# --- generated and vendored: must stay first so they win over the src rules ---
- glob: "services/frontend/src/services/api/**"
  bucket: build

- glob: "services/frontend/**/*.gen.ts"
  bucket: build

- glob: "services/frontend/yarn.lock"
  bucket: build

- glob: "services/frontend/.pnp.cjs"
  bucket: build

- glob: "services/frontend/.pnp.loader.mjs"
  bucket: build

- glob: "services/frontend/.yarn/**"
  bucket: build

- glob: "services/api/openapi.yaml"
  bucket: build

- glob: "**/gradle.lockfile"
  bucket: build

- glob: "libs/openapi-specs/**"
  bucket: build

# --- api ---
- glob: "services/api/src/integrationTest/**"
  bucket: tests

- glob: "services/api/src/testFixtures/**"
  bucket: tests

- glob: "services/api/src/test/**"
  bucket: tests

- glob: "services/api/src/main/**"
  bucket: api

- glob: "services/api/**"
  bucket: build

# --- frontend ---
- glob: "services/frontend/tests/**"
  bucket: tests

- glob: "services/frontend/src/**"
  bucket: frontend

- glob: "services/frontend/public/**"
  bucket: frontend

- glob: "services/frontend/**"
  bucket: build

# --- system tests ---
- glob: "tests/**"
  bucket: tests

# --- libs ---
- glob: "libs/**"
  bucket: libs

# --- platform and infrastructure ---
- glob: "platform/**"
  bucket: platform

- glob: "infra/**"
  bucket: platform

- glob: "services/stalwart/**"
  bucket: platform

- glob: "services/vault/**"
  bucket: platform

- glob: "docker-compose*.yml"
  bucket: platform

# --- build and CI ---
- glob: "build-logic/**"
  bucket: build

- glob: ".github/**"
  bucket: build

- glob: "scripts/**"
  bucket: build

- glob: "gradle/**"
  bucket: build

- glob: "gradlew*"
  bucket: build

- glob: "*.gradle.kts"
  bucket: build

# --- repo tooling: below everything path-specific, so a service keeps its own dotfiles ---
- glob: ".idea/**"
  bucket: build

# Only files sitting directly under services/, e.g. the shared .dockerignore.
- glob: "services/*"
  bucket: build

- glob: ".*"
  bucket: build

- glob: "*.json"
  bucket: build

- glob: "*.sh"
  bucket: build

# --- docs ---
- glob: "docs/**"
  bucket: docs

- glob: "specs/**"
  bucket: docs

- glob: "**/*.md"
  bucket: docs
