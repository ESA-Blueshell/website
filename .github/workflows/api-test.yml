name: Test API

on:
  push:
    paths: [ 'api/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: mariadb:10.11.10
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "blueshell-test"
          MYSQL_DATABASE: "blueshell-test"
          MYSQL_PORT: 3306
          MYSQL_USER: "blueshell-test"
          MYSQL_PASSWORD: "blueshell-test"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: "blueshell-test"
      MYSQL_PASSWORD: "blueshell-test"
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Install Dependencies
        run: mvn install -q -DskipTests
        working-directory: api

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "DB is up"; break
            fi
            echo "Waiting for DB ($i/30)..."
            sleep 2
          done

      - name: Run DB init SQL if present
        run: |
          set -e
          if [ -f api/env/init.sql ]; then
            echo "Applying api/env/init.sql..."
            mysql -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}" < api/env/init.sql
          else
            echo "No api/env/init.sql found. Skipping seed."
          fi

      - name: Maven - clean verify
        run: mvn -B -DskipTests=false clean verify
        working-directory: api
