name: Build and Perform Health Check
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-health-check:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out code
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BLUESHELL_REPO_TOKEN }}
          submodules: recursive
          persist-credentials: true

      # 2. Run script
      - name: Deploy services
        run: |
          chmod +x run.sh
          ./run.sh -f

      # 3. Verify containers are healthy
      - name: Verify container health
        run: |
          # Increase TIMEOUT as needed (in seconds)
          TIMEOUT=180
          SLEEP_INTERVAL=10
          
          # Get the IDs of all containers started by this Compose file
          CONTAINERS=$(docker compose -f docker-compose.build.yml ps -q)
          if [ -z "$CONTAINERS" ]; then
            echo "No containers found. Is your compose file up?"
            exit 1
          fi
          
          # For each container, wait until Health.Status is "healthy"
          for container_id in $CONTAINERS; do
            # Grab the (human-readable) container name for logging
            container_name="$(docker inspect --format='{{.Name}}' "$container_id" | sed 's/^\/\(.*\)/\1/')"
            echo "Checking health of container: $container_name"
          
            local_timeout=$TIMEOUT
            # Wait until container is "healthy" or TIMEOUT expires
            while [ "$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo 'unhealthy')" != "healthy" ]; do
              echo "Waiting for $container_name to become healthy..."
              sleep $SLEEP_INTERVAL
              local_timeout=$(( local_timeout - SLEEP_INTERVAL ))
              if [ $local_timeout -le 0 ]; then
                echo "Container $container_name failed to become healthy within $TIMEOUT seconds."
                exit 1
              fi
            done
          
            echo "$container_name is healthy!"
          done
          
          echo "All containers passed individual health checks."
          
          # Optional final check: verifies all are *still* healthy in one go
          if test -z "$(docker compose -f docker-compose.build.yml ps -q | xargs docker inspect -f '{{ .State.Health.Status}}' | grep -v '^healthy$')"; then
            echo "All containers healthy!"
          else
            echo "Some container(s) reported unhealthy status."
            exit 1
          fi
