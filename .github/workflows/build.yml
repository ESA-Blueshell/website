name: Build

# Publishes service images. Validation lives in validate.yml and is gated by
# the PR; main is purely the artefact-publish boundary. Multi-arch images are
# produced by building each platform on a native runner and merging the digests
# into a manifest list, so neither arch waits on QEMU emulation and each gets
# its own GHA cache scope.
#
# main tags :sha-<short> only. A push to the release branch additionally
# publishes :<tag>, the tag Flux pins api and frontend to, so the images exist
# before the release pull request can be merged. release.yml calls this again
# once the release is cut; the tags are the same and the layers are cached.
# It is called rather than triggered by `release: published` because a release
# cut with GITHUB_TOKEN raises no event.
on:
  push:
    branches: [main, release-please--branches--main]
  workflow_call:
    inputs:
      release-tag:
        description: Tag to publish, e.g. v1.2.0. Empty means an ordinary main build.
        type: string
        default: ''
  # Same input as workflow_call, so a release that half-finished can be republished
  # by hand without cutting another one.
  workflow_dispatch:
    inputs:
      release-tag:
        description: >-
          Tag to republish, e.g. v1.2.0, when a release half-finished. Rolling a
          service back is a change to the pinned digest, not a run of this.
        type: string
        default: ''

# Sequential: two consecutive main commits build one after the other.
# cancel-in-progress: false so a fast follow-up doesn't kill an in-flight
# image push that a later run would otherwise race.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Read by the GitHub Packages repository credentials in settings.gradle.kts,
  # which resolve the generated Brevo and Discord clients.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Yarn reads this for the @esa-blueshell scope (see .yarnrc.yml).
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  detect-changes:
    # Compare the merge commit against the previous main commit and only
    # rebuild services whose code (or its shared deps) actually changed.
    # A service that did not change is not rebuilt. The build matrix is expanded to
    # one entry per (service × platform) so each platform can run on its
    # native runner; `services` lists the unique service names the merge
    # job iterates over.
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.compute.outputs.build-matrix }}
      services: ${{ steps.compute.outputs.services }}
      has-matrix: ${{ steps.compute.outputs.has-matrix }}
      release-tag: ${{ steps.tag.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # The one place the tag is resolved, so no later job needs to know which
      # trigger fired. On the release branch it comes from the manifest
      # release-please has already bumped there.
      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF_NAME" == "release-please--branches--main" ]]; then
            tag="v$(jq -er '.["."]' .release-please-manifest.json)"
          else
            tag=""
          fi
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::release tag for this run: ${tag:-none, ordinary main build}"

      # Skipped on a release: the tag needs a complete set of images.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.tag.outputs.release-tag == ''
        with:
          base: ${{ github.event.before }}
          filters: |
            workflow:
              - '.github/workflows/build.yml'
            api:
              - 'services/api/**'
            frontend:
              - 'services/frontend/**'
            stalwart-tools:
              - 'infra/stalwart/**'
            build-logic:
              - 'build-logic/**'
            libs:
              - 'libs/**'
            gradle-config:
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradlew'
              - 'gradlew.bat'

      - name: Compute rebuild matrix
        id: compute
        env:
          FILTER_WORKFLOW: ${{ steps.filter.outputs.workflow }}
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_STALWART_TOOLS: ${{ steps.filter.outputs.stalwart-tools }}
          FILTER_BUILD_LOGIC: ${{ steps.filter.outputs.build-logic }}
          FILTER_LIBS: ${{ steps.filter.outputs.libs }}
          FILTER_GRADLE_CONFIG: ${{ steps.filter.outputs.gradle-config }}
          IS_RELEASE: ${{ steps.tag.outputs.release-tag != '' }}
        run: |
          set -euo pipefail
          any() { for v in "$@"; do [[ "$v" == "true" ]] && echo "true" && return; done; echo "false"; }

          # build-logic / libs / gradle-config affect the JVM build classpath
          # (api). The workflow itself touches both. Frontend changes never
          # invalidate the api and vice versa beyond shared gradle config.
          API_SHARED=$(any "$FILTER_WORKFLOW" "$FILTER_BUILD_LOGIC" "$FILTER_LIBS" "$FILTER_GRADLE_CONFIG")
          FRONTEND_SHARED=$(any "$FILTER_WORKFLOW")

          # A release rebuilds everything, not just what changed in the tag commit.
          if [[ "$IS_RELEASE" == "true" ]]; then
            API_SHARED=true
            FRONTEND_SHARED=true
            FILTER_STALWART_TOOLS=true
          fi

          MATRIX="[]"
          SERVICES="[]"
          add_platform() {
            local name=$1 context=$2 file=$3 platform=$4 arch=$5 runner=$6
            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg n "$name" --arg c "$context" --arg f "$file" \
              --arg p "$platform" --arg a "$arch" --arg r "$runner" \
              '. + [{"name":$n, "context":$c, "file":$f, "platform":$p, "arch":$a, "runner":$r}]')
          }
          add_service() {
            local name=$1
            SERVICES=$(echo "$SERVICES" | jq -c --arg n "$name" '. + [$n] | unique')
          }

          if [[ "$(any "$API_SHARED" "$FILTER_API")" == "true" ]]; then
            add_platform api . services/api/Dockerfile linux/amd64 amd64 ubuntu-latest
            add_service api
          fi
          if [[ "$(any "$FRONTEND_SHARED" "$FILTER_FRONTEND")" == "true" ]]; then
            add_platform frontend services/frontend services/frontend/Dockerfile linux/amd64 amd64 ubuntu-latest
            add_platform frontend services/frontend services/frontend/Dockerfile linux/arm64 arm64 ubuntu-24.04-arm
            add_service frontend
          fi
          # stalwart-tools is the apply-sidecar image for the Stalwart
          # Deployment; the Dockerfile expects the repo root as build
          # context so it can COPY infra/stalwart/*. Workflow changes
          # rebuild it too (FILTER_WORKFLOW).
          if [[ "$(any "$FILTER_WORKFLOW" "$FILTER_STALWART_TOOLS")" == "true" ]]; then
            add_platform stalwart-tools . infra/stalwart/Dockerfile linux/amd64 amd64 ubuntu-latest
            add_service stalwart-tools
          fi

          echo "build-matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [[ "$MATRIX" == "[]" ]]; then
            echo "has-matrix=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No service image needs rebuilding for this push."
          else
            echo "has-matrix=true" >> "$GITHUB_OUTPUT"
            echo "Build matrix: $MATRIX"
            echo "Services to tag: $SERVICES"
          fi

  build:
    # One run per (service, platform). Native runner per arch means
    # neither leg waits on QEMU emulation, and the per-arch cache scope
    # stops amd64 and arm64 from clobbering each other's layer cache.
    name: Build ${{ matrix.target.name }} (${{ matrix.target.arch }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has-matrix == 'true'
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-changes.outputs.build-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          platforms: ${{ matrix.target.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.target.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.target.arch }}
          # What went into the image, recorded beside it. mode=max keeps the
          # build arguments and sources rather than only the final result.
          provenance: mode=max
          sbom: true
          # The frontend image installs @esa-blueshell/discord-client from
          # GitHub Packages, which requires a token. Passed as a BuildKit
          # secret so it is not baked into the image history. Ignored by the
          # api image, whose Dockerfile does not mount it.
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.target.name }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # One run per service. Pulls every digest the build job published for
    # that service and assembles one manifest list under :sha-<short>. The
    # version tag is written at release, by release.yml.
    name: Push manifest for ${{ matrix.service }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has-matrix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this run's OIDC token for a
      # short-lived certificate, so there is no key to hold or rotate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute short SHA
        id: sha
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.sha }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          SHORT: ${{ steps.sha.outputs.short }}
          # Empty unless release-please called this workflow for a release.
          RELEASE_TAG: ${{ needs.detect-changes.outputs.release-tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          # Only the sha tag, derived from the commit and so written once. The
          # version tag is written at release, by release.yml.
          docker buildx imagetools create -t "${IMAGE}:sha-${SHORT}" "${sources[@]}"

          # ghcr is eventually consistent, so let a tag written a moment ago
          # settle rather than failing the publish over it.
          read_back=false
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "${IMAGE}:sha-${SHORT}"; then
              read_back=true
              break
            fi
            sleep "$(( attempt * 2 ))"
          done
          if [[ "$read_back" != true ]]; then
            echo "::error::${IMAGE}:sha-${SHORT} did not read back after 5 attempts"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The manifest list is signed, not the per-platform images beneath it:
      # that index digest is what a tag resolves to and what a cluster pulls.
      - name: Sign the manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # `{{json .Manifest}}`, not `{{.Manifest.Digest}}`: the latter is not a
          # path buildx resolves, and it prints the default output instead of
          # failing, which would sign whatever that string happened to be.
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT}" --format '{{json .Manifest}}' | jq -er .digest)
          echo "::notice::signing ${IMAGE}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"

  pin:
    # Writes the digests onto the release branch, never onto main. Flux then
    # deploys what was built rather than whatever the tag points at later.
    name: Pin the release images by digest
    needs: [detect-changes, merge]
    if: github.ref_name == 'release-please--branches--main' && needs.detect-changes.outputs.release-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the pin check can fail
        run: ./scripts/pin-release-images.sh --self-test

      - name: Write the digests into the stateless overlay
        env:
          RELEASE_TAG: ${{ needs.detect-changes.outputs.release-tag }}
          SHA: ${{ github.sha }}
        run: ./scripts/pin-release-images.sh write "$RELEASE_TAG" "sha-${SHA:0:7}"

      # Nothing to do when the digests already match, which is every rerun.
      - name: Commit the pin
        env:
          RELEASE_TAG: ${{ needs.detect-changes.outputs.release-tag }}
        run: |
          set -euo pipefail
          git config user.name 'blueshell-release[bot]'
          git config user.email '${{ secrets.RELEASE_APP_ID }}+blueshell-release[bot]@users.noreply.github.com'
          overlays=(
            platform/cluster/flux/apps/stateless/kustomization.yaml
            platform/cluster/flux/apps/mail/kustomization.yaml
          )
          if git diff --quiet -- "${overlays[@]}"; then
            echo "::notice::the pin already matches $RELEASE_TAG"
            exit 0
          fi
          git add "${overlays[@]}"
          git commit -m "chore(release): pin the images to the $RELEASE_TAG digests"
          git push origin "HEAD:$GITHUB_REF_NAME"
