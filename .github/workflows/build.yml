name: Build

# Publishes service images. Validation lives in validate.yml and is gated by
# the PR; main is purely the artefact-publish boundary. Each image is built for
# linux/amd64, the one architecture the cluster runs, and published as a
# manifest list under its sha tag.
#
# A push to main tags :sha-<short> and nothing else. The version tag is written
# only when release.yml calls this workflow, by the job that pushed the manifest
# and so holds the digest it must name. It is called rather than triggered by
# `release: published` because a release cut with GITHUB_TOKEN raises no event.
#
# The release branch builds nothing: its pull request changes only the version
# and the changelog. The release commit is built once, by release.yml's call; its
# own push to main is skipped.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release-tag:
        description: Tag to publish, e.g. v1.2.0. Empty means an ordinary main build.
        type: string
        default: ''
  # Same input as workflow_call, so a release that half-finished can be republished
  # by hand without cutting another one.
  workflow_dispatch:
    inputs:
      release-tag:
        description: >-
          Tag to republish, e.g. v1.2.0, when a release half-finished. Rolling a
          service back is a change to the pinned digest, not a run of this.
        type: string
        default: ''

# Per ref: a push to main must not cancel a queued release-branch build, which
# would leave the release with no images and no pin.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Read by the GitHub Packages repository credentials in settings.gradle.kts,
  # which resolve the generated Brevo and Discord clients.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  release-tag:
    # The one place the tag is resolved, so no later job needs to know which
    # trigger fired. Only a release has one: a push, including one to the
    # release branch, publishes sha tags and nothing else.
    name: Resolve the release tag
    # The release commit's push. release.yml calls this workflow for that same commit
    # with the tag, and that run builds it.
    if: >-
      inputs.release-tag != ''
      || !startsWith(github.event.head_commit.message, 'chore(main): release ')
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.release-tag }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          echo "release-tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::release tag for this run: ${INPUT_TAG:-none, ordinary build}"

  build:
    # One run per service, on every push: an image is not skipped because its
    # own paths did not change, so every commit on main has a full set to
    # deploy. Each service keeps its own cache scope.
    name: Build ${{ matrix.target.name }} (${{ matrix.target.arch }})
    needs: release-tag
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - {name: api, context: ., file: services/api/Dockerfile, platform: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {name: frontend, context: services/frontend, file: services/frontend/Dockerfile, platform: linux/amd64, arch: amd64, runner: ubuntu-latest}
          # The apply sidecar for the Stalwart Deployment. Its Dockerfile
          # copies infra/stalwart/*, so the context is the repo root.
          - {name: stalwart-tools, context: ., file: infra/stalwart/Dockerfile, platform: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {name: pinger, context: services/pinger, file: services/pinger/Dockerfile, platform: linux/amd64, arch: amd64, runner: ubuntu-latest}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # The frontend's build context is its own directory, so the manifest the
      # version lives in is read here and passed in.
      - name: Read the release version
        id: version
        run: echo "version=$(jq -er '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          platforms: ${{ matrix.target.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.target.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.target.arch }}
          # What went into the image, recorded beside it. mode=max keeps the
          # build arguments and sources rather than only the final result.
          provenance: mode=max
          sbom: true
          # The api image resolves the generated clients from GitHub Packages,
          # which requires a token. Passed as a BuildKit secret so it is not
          # baked into the image history.
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            APP_VERSION=${{ steps.version.outputs.version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.target.name }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # One run per service. Pulls every digest the build job published for
    # that service and assembles one manifest list under :sha-<short>. The
    # version tag is written at release, by release.yml.
    name: Push manifest for ${{ matrix.service }}
    needs: [release-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this run's OIDC token for a
      # short-lived certificate, so there is no key to hold or rotate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, stalwart-tools, pinger]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute short SHA
        id: sha
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.sha }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create -t "${IMAGE}:sha-${SHORT}" "${sources[@]}"

          # ghcr is eventually consistent, so let a tag written a moment ago
          # settle rather than failing the publish over it.
          #
          # `{{json .Manifest}}`, not `{{.Manifest.Digest}}`: the latter is not a
          # path buildx resolves, and it prints the default output instead of
          # failing, which would hand the later steps whatever that string was.
          index=
          for attempt in 1 2 3 4 5; do
            if index=$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT}" \
                 --format '{{json .Manifest}}' | jq -er .digest); then
              break
            fi
            index=
            sleep "$(( attempt * 2 ))"
          done
          if [[ -z "$index" ]]; then
            echo "::error::${IMAGE}:sha-${SHORT} did not read back after 5 attempts"
            exit 1
          fi
          # The digest every later step uses, so none of them re-resolves a tag
          # a concurrent build of this same commit may have moved underneath it.
          echo "digest=$index" >> "$GITHUB_OUTPUT"
          echo "::notice::${IMAGE}:sha-${SHORT} is $index"

      # The version tag is written here rather than after the release, because
      # this is the only place that holds the digest it must name. Skipped
      # unless release.yml called this workflow for a release.
      - name: Write the version tag
        if: needs.release-tag.outputs.release-tag != ''
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.release-tag }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          ./scripts/write-release-tag.sh --self-test
          ./scripts/write-release-tag.sh "$IMAGE" "$RELEASE_TAG" "$DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The manifest list is signed, not the per-platform images beneath it:
      # that index digest is what a tag resolves to and what a cluster pulls.
      - name: Sign the manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          echo "::notice::signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
