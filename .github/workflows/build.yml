name: Build

# Publishes service images. Validation lives in validate.yml and is gated by
# the PR; main is purely the artefact-publish boundary. Multi-arch images are
# produced by building each platform on a native runner and merging the digests
# into a manifest list, so neither arch waits on QEMU emulation and each gets
# its own GHA cache scope.
#
# main tags :sha-<short> only. release.yml calls this with release-tag set,
# which additionally publishes :<tag> and then, in a single promote job, moves
# :latest — the tag Keel polls — for every service at once, so only releases
# reach production and no service reaches it alone. It is called rather than
# triggered by `release: published` because a release cut with GITHUB_TOKEN
# raises no event.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release-tag:
        description: Tag to publish, e.g. v1.2.0. Empty means an ordinary main build.
        type: string
        default: ''
  # Same input as workflow_call, so a release that half-finished can be promoted again
  # by hand without cutting another one. `inputs.release-tag` reads the same under both
  # triggers, and is empty on a push, so nothing downstream needs to know which fired.
  workflow_dispatch:
    inputs:
      release-tag:
        description: >-
          Tag to publish and point :latest at, e.g. v1.2.0. Empty builds and pushes
          images without moving :latest. Naming an older tag moves :latest backwards and
          Keel will roll it out, so that is a rollback rather than a retry.
        type: string
        default: ''

# Sequential: two consecutive main commits build one after the other.
# cancel-in-progress: false so a fast follow-up doesn't kill an in-flight
# image push that downstream Keel would otherwise have rolled.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Read by the GitHub Packages repository credentials in settings.gradle.kts,
  # which resolve the generated Brevo and Discord clients.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Yarn reads this for the @esa-blueshell scope (see .yarnrc.yml).
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  detect-changes:
    # Compare the merge commit against the previous main commit and only
    # rebuild services whose code (or its shared deps) actually changed.
    # Services that didn't change keep their existing ghcr :latest tag, so
    # Keel doesn't churn pods for nothing. The build matrix is expanded to
    # one entry per (service × platform) so each platform can run on its
    # native runner; `services` lists the unique service names the merge
    # job iterates over.
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.compute.outputs.build-matrix }}
      services: ${{ steps.compute.outputs.services }}
      has-matrix: ${{ steps.compute.outputs.has-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Skipped on a release: the tag needs a complete set of images.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: inputs.release-tag == ''
        with:
          base: ${{ github.event.before }}
          filters: |
            workflow:
              - '.github/workflows/build.yml'
            api:
              - 'services/api/**'
            frontend:
              - 'services/frontend/**'
            stalwart-tools:
              - 'infra/stalwart/**'
            build-logic:
              - 'build-logic/**'
            libs:
              - 'libs/**'
            gradle-config:
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradlew'
              - 'gradlew.bat'

      - name: Compute rebuild matrix
        id: compute
        env:
          FILTER_WORKFLOW: ${{ steps.filter.outputs.workflow }}
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_STALWART_TOOLS: ${{ steps.filter.outputs.stalwart-tools }}
          FILTER_BUILD_LOGIC: ${{ steps.filter.outputs.build-logic }}
          FILTER_LIBS: ${{ steps.filter.outputs.libs }}
          FILTER_GRADLE_CONFIG: ${{ steps.filter.outputs.gradle-config }}
          IS_RELEASE: ${{ inputs.release-tag != '' }}
        run: |
          set -euo pipefail
          any() { for v in "$@"; do [[ "$v" == "true" ]] && echo "true" && return; done; echo "false"; }

          # build-logic / libs / gradle-config affect the JVM build classpath
          # (api). The workflow itself touches both. Frontend changes never
          # invalidate the api and vice versa beyond shared gradle config.
          API_SHARED=$(any "$FILTER_WORKFLOW" "$FILTER_BUILD_LOGIC" "$FILTER_LIBS" "$FILTER_GRADLE_CONFIG")
          FRONTEND_SHARED=$(any "$FILTER_WORKFLOW")

          # A release rebuilds everything, not just what changed in the tag commit.
          if [[ "$IS_RELEASE" == "true" ]]; then
            API_SHARED=true
            FRONTEND_SHARED=true
            FILTER_STALWART_TOOLS=true
          fi

          MATRIX="[]"
          SERVICES="[]"
          add_platform() {
            local name=$1 context=$2 file=$3 platform=$4 arch=$5 runner=$6
            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg n "$name" --arg c "$context" --arg f "$file" \
              --arg p "$platform" --arg a "$arch" --arg r "$runner" \
              '. + [{"name":$n, "context":$c, "file":$f, "platform":$p, "arch":$a, "runner":$r}]')
          }
          add_service() {
            local name=$1
            SERVICES=$(echo "$SERVICES" | jq -c --arg n "$name" '. + [$n] | unique')
          }

          if [[ "$(any "$API_SHARED" "$FILTER_API")" == "true" ]]; then
            add_platform api . services/api/Dockerfile linux/amd64 amd64 ubuntu-latest
            add_service api
          fi
          if [[ "$(any "$FRONTEND_SHARED" "$FILTER_FRONTEND")" == "true" ]]; then
            add_platform frontend services/frontend services/frontend/Dockerfile linux/amd64 amd64 ubuntu-latest
            add_platform frontend services/frontend services/frontend/Dockerfile linux/arm64 arm64 ubuntu-24.04-arm
            add_service frontend
          fi
          # stalwart-tools is the apply-sidecar image for the Stalwart
          # Deployment; the Dockerfile expects the repo root as build
          # context so it can COPY infra/stalwart/*. Workflow changes
          # rebuild it too (FILTER_WORKFLOW).
          if [[ "$(any "$FILTER_WORKFLOW" "$FILTER_STALWART_TOOLS")" == "true" ]]; then
            add_platform stalwart-tools . infra/stalwart/Dockerfile linux/amd64 amd64 ubuntu-latest
            add_service stalwart-tools
          fi

          echo "build-matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [[ "$MATRIX" == "[]" ]]; then
            echo "has-matrix=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No service image needs rebuilding for this push."
          else
            echo "has-matrix=true" >> "$GITHUB_OUTPUT"
            echo "Build matrix: $MATRIX"
            echo "Services to tag: $SERVICES"
          fi

  build:
    # One run per (service, platform). Native runner per arch means
    # neither leg waits on QEMU emulation, and the per-arch cache scope
    # stops amd64 and arm64 from clobbering each other's layer cache.
    name: Build ${{ matrix.target.name }} (${{ matrix.target.arch }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has-matrix == 'true'
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-changes.outputs.build-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          platforms: ${{ matrix.target.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.target.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.target.arch }}
          # The frontend image installs @esa-blueshell/discord-client from
          # GitHub Packages, which requires a token. Passed as a BuildKit
          # secret so it is not baked into the image history. Ignored by the
          # api image, whose Dockerfile does not mount it.
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.target.name }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # One run per service. Pulls every digest the build job published for
    # that service and assembles a single manifest list under immutable tags:
    # :sha-<short> always and :<tag> on a release. Moving :latest is the
    # promote job's business, so that every service flips together.
    name: Push manifest for ${{ matrix.service }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has-matrix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute short SHA
        id: sha
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.sha }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          SHORT: ${{ steps.sha.outputs.short }}
          # Empty unless release-please called this workflow for a release.
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          # Immutable tags only. :latest moves in promote, once every service
          # has one of these to be promoted from.
          tags=(-t "${IMAGE}:sha-${SHORT}")
          if [[ -n "$RELEASE_TAG" ]]; then
            tags+=(-t "${IMAGE}:${RELEASE_TAG}")
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

          # Same read-after-write as the promote job: the manifest list was
          # written a moment ago, so let the registry settle rather than failing
          # the publish over a tag that is about to be there.
          read_back=false
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "${IMAGE}:sha-${SHORT}"; then
              read_back=true
              break
            fi
            sleep "$(( attempt * 2 ))"
          done
          if [[ "$read_back" != true ]]; then
            echo "::error::${IMAGE}:sha-${SHORT} did not read back after 5 attempts"
            exit 1
          fi

  promote:
    # Moves :latest, the tag Keel polls, for every service in this release —
    # in one job, one after the other, and only once every image exists under
    # its release tag.
    #
    # A matrix would publish each service's :latest in its own job, and Keel
    # polling in the gap between two of them would roll one Deployment against
    # the previous version of another. The gap is seconds and the poll is every
    # two minutes, which makes it the kind of race that shows up in production
    # rather than in a pipeline.
    #
    # Skew is narrowed rather than eliminated: Keel still rolls each Deployment
    # separately and they come up at different speeds, so an api and a frontend
    # from adjacent releases can still meet briefly. One release of backward
    # compatibility remains the contract.
    name: Promote release to :latest
    needs: [detect-changes, merge]
    if: needs.detect-changes.outputs.has-matrix == 'true' && inputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at the release tag
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail

          # Belt and braces against the job condition: an ordinary main build
          # has no tag to promote, and promoting an empty one would be worse
          # than doing nothing.
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag — nothing to promote."
            exit 0
          fi

          # Re-tagging from the release tag rather than from the digests keeps
          # this a pointer move: :latest and :<tag> name the same manifest list.
          #
          # No read-back. ghcr is eventually consistent, so a tag written moments
          # earlier can still read as missing; retrying was not enough and the
          # release failed for a tag that had in fact moved. `imagetools create`
          # reports its own failure, which is the signal that means something.
          mapfile -t services < <(jq -r '.[]' <<< "$SERVICES")
          for service in "${services[@]}"; do
            image="${REGISTRY}/${IMAGE_PREFIX}/${service}"
            echo "::group::${service}"
            docker buildx imagetools create -t "${image}:latest" "${image}:${RELEASE_TAG}"
            echo "::endgroup::"
          done
