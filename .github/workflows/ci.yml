  GOOGLE_CALENDAR_PRIVATE_KEY_ID: something

  GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

permissions:
  contents: read

jobs:
  check-changes:
    name: Detect affected layers
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.derive.outputs.api }}
      frontend: ${{ steps.derive.outputs.frontend }}
      openapi: ${{ steps.derive.outputs.openapi }}
      ci: ${{ steps.derive.outputs.ci }}
      run_api_static: ${{ steps.derive.outputs.run_api_static }}
      run_frontend_static: ${{ steps.derive.outputs.run_frontend_static }}
      run_api_tests: ${{ steps.derive.outputs.run_api_tests }}
      run_system_tests: ${{ steps.derive.outputs.run_system_tests }}
      run_frontend_tests: ${{ steps.derive.outputs.run_frontend_tests }}
      run_coverage: ${{ steps.derive.outputs.run_coverage }}
      run_openapi_sync: ${{ steps.derive.outputs.run_openapi_sync }}
      run_api_image: ${{ steps.derive.outputs.run_api_image }}
      run_frontend_image: ${{ steps.derive.outputs.run_frontend_image }}
      api_verification_matrix: ${{ steps.derive.outputs.api_verification_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            api:
              - 'api/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'env/**'
              - 'scripts/**'
              - 'docker-compose.dev.yml'
              - 'api/Dockerfile'
              - 'api/Dockerfile-dev'
            frontend:
              - 'frontend/**'
              - 'frontend/Dockerfile'
              - 'frontend/Dockerfile-dev'
            openapi:
              - 'openapi/**'
              - 'generate_openapi.sh'
              - 'docker-compose.dev.yml'
              - 'env/**'
            ci:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'
              - 'merge-coverage.sh'

      - name: Derive layered execution flags
        id: derive
        shell: bash
        run: |
          set -euo pipefail

          api='${{ steps.filter.outputs.api }}'
          frontend='${{ steps.filter.outputs.frontend }}'
          openapi='${{ steps.filter.outputs.openapi }}'
          ci='${{ steps.filter.outputs.ci }}'

          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            api=true
            frontend=true
            openapi=true
            ci=true
          fi

          bool_or() {
            local result=false
            for value in "$@"; do
              if [[ "$value" == 'true' ]]; then
                result=true
                break
              fi
            done
            printf '%s' "$result"
          }

          run_api_static="$(bool_or "$api" "$ci")"
          run_frontend_static="$(bool_or "$frontend" "$openapi" "$ci")"
          run_api_tests="$(bool_or "$api" "$ci")"
          run_system_tests="$(bool_or "$api" "$frontend" "$ci")"
          run_frontend_tests="$(bool_or "$frontend" "$ci")"
          run_coverage="$(bool_or "$api" "$frontend" "$ci")"
          run_openapi_sync="$(bool_or "$api" "$frontend" "$openapi" "$ci")"
          run_api_image="$(bool_or "$api" "$ci")"
          run_frontend_image="$(bool_or "$frontend" "$ci")"

          matrix_entries=()
          if [[ "$run_api_tests" == 'true' ]]; then
            matrix_entries+=('{"id":"api","name":"Run API tests","timeout_minutes":30}')
          fi
          if [[ "$run_system_tests" == 'true' ]]; then
            matrix_entries+=('{"id":"system","name":"Run system tests","timeout_minutes":45}')
          fi
          if [[ ${#matrix_entries[@]} -eq 0 ]]; then
            api_verification_matrix='{"include":[]}'
          else
            api_verification_matrix="{\"include\":[$(IFS=,; echo "${matrix_entries[*]}")]}"
          fi

          {
            echo "api=$api"
            echo "frontend=$frontend"
            echo "openapi=$openapi"
            echo "ci=$ci"
            echo "run_api_static=$run_api_static"
            echo "run_frontend_static=$run_frontend_static"
            echo "run_api_tests=$run_api_tests"
            echo "run_system_tests=$run_system_tests"
            echo "run_frontend_tests=$run_frontend_tests"
            echo "run_coverage=$run_coverage"
            echo "run_openapi_sync=$run_openapi_sync"
            echo "run_api_image=$run_api_image"
            echo "run_frontend_image=$run_frontend_image"
            echo "api_verification_matrix=$api_verification_matrix"
          } >> "$GITHUB_OUTPUT"

  fe-static:
    name: Frontend typecheck and lint
    needs: check-changes
    if: needs.check-changes.outputs.run_frontend_static == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

  api-static:
    name: API compile checks
    needs: check-changes
    if: needs.check-changes.outputs.run_api_static == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Compile API main and test sources
        run: ./gradlew --no-daemon :api:compileKotlin :api:compileTestKotlin

  api-verification:
    name: ${{ matrix.name }}
    needs: [check-changes, api-static, fe-static]
    if: >-
      ${{
        always()
        && (
          needs.check-changes.outputs.run_api_tests == 'true'
          || needs.check-changes.outputs.run_system_tests == 'true'
        )
        && (needs.check-changes.outputs.run_api_static == 'false' || needs.api-static.result == 'success')
        && (needs.check-changes.outputs.run_frontend_static == 'false' || needs.fe-static.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-changes.outputs.api_verification_matrix) }}

    services:
      db:
        image: mariadb:10.11.10
        ports: ["3306:3306"]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ["5672:5672"]
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USERNAME }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < env/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/$RABBITMQ_HOST/$RABBITMQ_PORT) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js and Yarn
        if: matrix.id == 'system'
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Start instrumented frontend for system tests
        if: matrix.id == 'system'
        run: |
          set -euo pipefail
          VITE_COVERAGE=true VITE_APP_URL="$APP_URL" \
            yarn --cwd frontend dev --host 0.0.0.0 --port 3000 > frontend-dev.log 2>&1 &
          echo $! > frontend-dev.pid

      - name: Wait for frontend readiness
        if: matrix.id == 'system'
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS "$FRONTEND_URL" >/dev/null 2>&1; then
              echo "Frontend is ready."
              exit 0
            fi
            echo "Waiting for frontend... ($i/60)"
            sleep 2
          done
          echo "Frontend failed to start."
          exit 1

      - name: Run API Gradle tests
        if: matrix.id == 'api'
        run: ./gradlew --no-daemon :api:test :api:jacocoTestReport

      - name: Run system tests and JaCoCo system report
        if: matrix.id == 'system'
        run: |
          ./gradlew --no-daemon :api:systemTest :api:jacocoSystemTestReport \
            -Dsystem.frontend.url="$FRONTEND_URL" \
            -Dfrontend.coverage.enabled=true \
            -Dfrontend.coverage.required=true

      - name: Convert frontend raw coverage to LCOV
        if: matrix.id == 'system'
        run: |
          yarn --cwd frontend coverage:system:report \
            --raw-dir ../api/build/coverage/frontend-system/raw \
            --out-dir ../api/build/coverage/frontend-system

      - name: Stop frontend process
        if: always() && matrix.id == 'system'
        run: |
          if [ -f frontend-dev.pid ]; then
            kill "$(cat frontend-dev.pid)" || true
          fi

      - name: Upload API test coverage artifacts
        if: always() && matrix.id == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: api-test-coverage
          path: |
            api/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            api/build/reports/jacoco/jacocoTestReport/html
            api/build/reports/tests/test
          if-no-files-found: warn

      - name: Upload API system coverage artifacts
        if: always() && matrix.id == 'system'
        uses: actions/upload-artifact@v4
        with:
          name: api-system-coverage
          path: |
            api/build/reports/jacoco/jacocoSystemTestReport/jacocoSystemTestReport.xml
            api/build/reports/jacoco/jacocoSystemTestReport/html
            api/build/coverage/frontend-system/coverage-final.json
            api/build/coverage/frontend-system/lcov.info
            api/build/coverage/frontend-system/html
            frontend-dev.log
          if-no-files-found: warn

  fe-unit:
    name: Frontend unit tests with coverage
    needs: [check-changes, fe-static]
    if: >-
      ${{
        always()
        && needs.check-changes.outputs.run_frontend_tests == 'true'
        && (needs.check-changes.outputs.run_frontend_static == 'false' || needs.fe-static.result == 'success')
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run frontend unit tests with coverage
        run: yarn test:unit:coverage

      - name: Upload frontend unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/unit/coverage-final.json
            frontend/coverage/unit/coverage-summary.json
            frontend/coverage/unit/lcov.info
            frontend/coverage/unit/lcov-report
            frontend/coverage/unit/index.html
          if-no-files-found: error

  fe-e2e:
    name: Frontend end-to-end tests
    needs: [check-changes, fe-static]
    if: >-
      ${{
        always()
        && needs.check-changes.outputs.run_frontend_tests == 'true'
        && (needs.check-changes.outputs.run_frontend_static == 'false' || needs.fe-static.result == 'success')
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Install Playwright browser dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: yarn test:e2e

      - name: Upload frontend e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: |
            frontend/coverage/e2e/coverage-final.json
            frontend/coverage/e2e/coverage-summary.json
            frontend/coverage/e2e/lcov.info
            frontend/coverage/e2e/html
          if-no-files-found: error

  coverage:
    name: Merge and enforce code coverage
    needs: [check-changes, api-verification, fe-unit, fe-e2e]
    if: >-
      ${{
        always()
        && needs.check-changes.outputs.run_coverage == 'true'
        && (needs.check-changes.outputs.run_api_tests == 'false' || needs.api-verification.result == 'success')
        && (needs.check-changes.outputs.run_system_tests == 'false' || needs.api-verification.result == 'success')
        && (
          needs.check-changes.outputs.run_frontend_tests == 'false'
          || (needs.fe-unit.result == 'success' && needs.fe-e2e.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download API test coverage artifact
        if: needs.check-changes.outputs.run_api_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: api-test-coverage
          path: coverage-inputs/api-test

      - name: Download API system coverage artifact
        if: needs.check-changes.outputs.run_system_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: api-system-coverage
          path: coverage-inputs/api-system

      - name: Download frontend unit coverage artifact
        if: needs.check-changes.outputs.run_frontend_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-coverage
          path: coverage-inputs/frontend-unit

      - name: Download frontend e2e coverage artifact
        if: needs.check-changes.outputs.run_frontend_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: coverage-inputs/frontend-e2e

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Merge all discovered coverage reports
        run: |
          set -euo pipefail
          chmod +x ./merge-coverage.sh
          ./merge-coverage.sh --out "coverage/merged"

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report
          path: coverage/merged
          if-no-files-found: error

      - name: Enforce merged coverage threshold
        run: |
          chmod +x ./scripts/check-cobertura-threshold.sh
          ./scripts/check-cobertura-threshold.sh \
            --file coverage/merged/Cobertura.xml \
            --min-line-rate "${COVERAGE_MIN_LINE_RATE}"

  openapi-sync:
    name: Validate OpenAPI client generation
    needs: [check-changes, api-static, fe-static]
    if: >-
      ${{
        always()
        && needs.check-changes.outputs.run_openapi_sync == 'true'
        && (needs.check-changes.outputs.run_api_static == 'false' || needs.api-static.result == 'success')
        && (needs.check-changes.outputs.run_frontend_static == 'false' || needs.fe-static.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          cp env/.api.env.example env/.api.env
          cp env/.db.env.example env/.db.env
          cp env/.rabbitmq.env.example env/.rabbitmq.env

      - name: Start development stack via Docker Compose
        run: docker compose -f "$DEV_COMPOSE_FILE" up -d

      - name: Wait for API container health check
        run: |
          set -euo pipefail
          for i in {1..24}; do
            CID="$(docker compose -f "$DEV_COMPOSE_FILE" ps -q api || true)"
            if [ -z "$CID" ]; then
              echo "api container not created yet (attempt $i/24)"
            else
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo 'unknown')"
              echo "api health status: $STATUS (attempt $i/24)"
              if [ "$STATUS" = "healthy" ]; then
                echo "api is healthy"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "api did not become healthy in time"
          docker compose -f "$DEV_COMPOSE_FILE" ps
          exit 1

      - name: Generate OpenAPI client code
        run: |
          chmod +x ./generate_openapi.sh
          ./generate_openapi.sh

      - name: Assert OpenAPI spec and client are in sync
        run: git diff --exit-code -- openapi frontend

      - name: Tear down development stack
        if: always()
        run: docker compose -f "$DEV_COMPOSE_FILE" down -v

  api-build-push:
    name: Build and publish API Docker image
    needs: [check-changes, coverage, openapi-sync]
    if: >-
      ${{
        always()
        && needs.check-changes.outputs.run_api_image == 'true'
        && (needs.coverage.result == 'success' || needs.coverage.result == 'skipped')
        && (needs.openapi-sync.result == 'success' || needs.openapi-sync.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and optionally push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fe-build-push:
    name: Build and publish frontend Docker image
    needs: [check-changes, coverage, openapi-sync]
    if: >-
      ${{
        always()
        && needs.check-changes.outputs.run_frontend_image == 'true'
        && (needs.coverage.result == 'success' || needs.coverage.result == 'skipped')
        && (needs.openapi-sync.result == 'success' || needs.openapi-sync.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and optionally push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [check-changes, api-build-push, fe-build-push, coverage, openapi-sync]
    if: >-
      ${{
        always()
        && github.ref == 'refs/heads/main'
        && (needs.check-changes.outputs.run_api_image == 'false' || needs.api-build-push.result == 'success')
        && (needs.check-changes.outputs.run_frontend_image == 'false' || needs.fe-build-push.result == 'success')
        && (needs.coverage.result == 'success' || needs.coverage.result == 'skipped')
        && (needs.openapi-sync.result == 'success' || needs.openapi-sync.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://esa-blueshell.nl
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add deployment host to known hosts
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote deploy command
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -p "${{ secrets.PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
            "bash -lc 'website pull'"
