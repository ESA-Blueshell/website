        wRRHv41dPOIL
        -----END PRIVATE KEY-----
      GOOGLE_CALENDAR_PRIVATE_KEY_ID: something

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell < env/0_init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "USE blueshell-test; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Run API Gradle tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon :api:test :api:jacocoTestReport
        env:
          GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

      - name: Upload API test coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-coverage
          path: |
            api/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            api/build/reports/jacoco/jacocoTestReport/html
            api/build/reports/tests/test
          if-no-files-found: warn

  system-tests:
    name: Run system tests
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true' || needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: "blueshell"
          MYSQL_DATABASE: "blueshell-test"
          MYSQL_PORT: 3306
          MYSQL_USER: "blueshell"
          MYSQL_PASSWORD: "blueshell"
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: "guest"
          RABBITMQ_DEFAULT_PASS: "guest"
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      MYSQL_ROOT_PASSWORD: blueshell
      MYSQL_DATABASE: blueshell-test
      MYSQL_PORT: '3306'
      MYSQL_USER: blueshell
      MYSQL_PASSWORD: blueshell
      MYSQL_HOST: 127.0.0.1
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: '5672'
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest

      APP_URL: https://localhost/api
      FRONTEND_URL: https://localhost

      JWT_SECRET: YourBase64Encoded64ByteKeyHerejlasjdlfkjasdfjlakw4jpoiasdvpocimu4019mcfawb09hmf8j123890cqwepjc

      SMTP_HOST: mail.blueshell.utwente.nl
      SMTP_PORT: '465'
      SMTP_USERNAME: your_smtp_username
      SMTP_PASSWORD: your_smtp_password

      STORAGE_LOCATION: ./storage

      BREVO_API_KEY: something
      BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

      GOOGLE_CALENDAR_ID: something
      GOOGLE_CALENDAR_CLIENT_ID: something
      GOOGLE_CALENDAR_CLIENT_EMAIL: something
      GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8: |
        -----BEGIN PRIVATE KEY-----
        MIICdQIBADANBgkqhkiG9w0BAQEFAASCAl8wggJbAgEAAoGBAJNOI74ADXzV2H63
        s/wyuR7hW61c0ORfHSBSSIgmdglGqtSb8ERzet79zodXvmeZu2Cl6phtEIsXZ0uF
        dfNBmIFjI2i3LT9+7zb+n5OcwKgwSxyKCeL6sB4aOQ/gljH2mpsTFkk6UdoKZ0NH
        4Kkmbq2qsMr1P0y1j3X0uXg+uGNhAgMBAAECgYAePOMPZJlgL9GSKYmT0qG3mhEk
        pDHpPzEOanWjJSoDu3Lj0+LdWks1rSoRFEzsnV0eeNCQW4sS0koM8aeFuMhiLc8Q
        KP7UecthtjLxzjqQPDwj5z90pkSg9GPKkoKC9h83Ioj6KqhvE3vN2NfGrWX/Gcmr
        BvVnw+btaoFgxzjncQJBAOtwr4+8qTHVxDApKteymCljlli4hS3KQGOrPiQUtszl
        HpckKJfFJeuvB8kLxPEdhKSegu1BCd7WCPbWPfiYL3UCQQCgKy3Dkx29PcP+O36m
        aS9G2rvivUh0ceD3fIqeUuhcCa+Gd4JH4g3/HUpOj8lV8HacI+MM4B/DF46lbLoy
        JrK9AkB3hY86kvX5vKGKKXv8YEfqywmqJJJHeqNRdb9oJbPfNHlhFRQeaBEmIob7
        QyRJm0iZIXcp5piSLWoDlSOErg15AkARLlCMaB2KjTOW897UDvhpS1FYMyGwi/6r
        zYo5DX+rT8aqT+uDtnX15bhw0O+x7kdq3FagrPH7RW2hxRX8BzapAkB8TTIWgCgu
        YOYLy5TUv9YKShgfe50C6j1HyZajzJBV1PdS7298SB2n2dvbUGWvUohXXMCXVRdS
        wRRHv41dPOIL
        -----END PRIVATE KEY-----
      GOOGLE_CALENDAR_PRIVATE_KEY_ID: something

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell < env/0_init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "USE blueshell-test; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'

      - name: Start instrumented frontend for system tests
        run: |
          set -euo pipefail
          VITE_COVERAGE=true VITE_APP_URL=http://127.0.0.1:8080 \
            yarn --cwd frontend dev --host 0.0.0.0 --port 3000 > frontend-dev.log 2>&1 &
          echo $! > frontend-dev.pid

      - name: Wait for frontend readiness
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              echo "Frontend is ready."
              exit 0
            fi
            echo "Waiting for frontend... ($i/60)"
            sleep 2
          done
          echo "Frontend failed to start."
          exit 1

      - name: Run system tests and JaCoCo system report
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon :api:systemTest :api:jacocoSystemTestReport \
            -Dsystem.frontend.url=http://127.0.0.1:3000 \
            -Dfrontend.coverage.enabled=true \
            -Dfrontend.coverage.required=true
        env:
          GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

      - name: Convert frontend raw coverage to LCOV
        run: |
          yarn --cwd frontend coverage:system:report \
            --raw-dir ../api/build/coverage/frontend-system/raw \
            --out-dir ../api/build/coverage/frontend-system

      - name: Stop frontend process
        if: always()
        run: |
          if [ -f frontend-dev.pid ]; then
            kill "$(cat frontend-dev.pid)" || true
          fi

      - name: Upload API system coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-system-coverage
          path: |
            api/build/reports/jacoco/jacocoSystemTestReport/jacocoSystemTestReport.xml
            api/build/reports/jacoco/jacocoSystemTestReport/html
            api/build/coverage/frontend-system/coverage-final.json
            api/build/coverage/frontend-system/lcov.info
            api/build/coverage/frontend-system/html
            frontend-dev.log
          if-no-files-found: warn

  coverage:
    name: Merge and enforce code coverage
    needs: [ check-changes, api-tests, system-tests, fe-unit, fe-e2e ]
    if: >-
      ${{
        always()
        && (needs.check-changes.outputs.api == 'true' || needs.check-changes.outputs.frontend == 'true')
        && needs.api-tests.result == 'success'
        && needs.system-tests.result == 'success'
        && (needs.check-changes.outputs.frontend == 'false' || needs.fe-unit.result == 'success')
        && (needs.check-changes.outputs.frontend == 'false' || needs.fe-e2e.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download API test coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: api-test-coverage
          path: coverage-inputs/api-test

      - name: Download API system coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: api-system-coverage
          path: coverage-inputs/api-system

      - name: Download frontend unit coverage artifact
        if: needs.check-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-coverage
          path: coverage-inputs/frontend-unit

      - name: Download frontend e2e coverage artifact
        if: needs.check-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: coverage-inputs/frontend-e2e

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'

      - name: Merge all discovered coverage reports
        run: |
          set -euo pipefail

          chmod +x ./merge-coverage.sh
          ./merge-coverage.sh --out "coverage/merged"

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report
          path: coverage/merged
          if-no-files-found: error

      - name: Enforce merged coverage threshold
        run: |
          chmod +x ./scripts/check-cobertura-threshold.sh
          ./scripts/check-cobertura-threshold.sh \
            --file coverage/merged/Cobertura.xml \
            --min-line-rate "${COVERAGE_MIN_LINE_RATE}"

  api-build-push:
    name: Build and publish API Docker image
    needs: [ check-changes, coverage ]
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and optionally push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fe-static:
    name: Frontend typecheck and lint
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

  fe-unit:
    name: Frontend unit tests with coverage
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'

      - name: Run frontend unit tests with coverage
        run: yarn test:unit:coverage

      - name: Upload frontend unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/unit/coverage-final.json
            frontend/coverage/unit/coverage-summary.json
            frontend/coverage/unit/lcov.info
            frontend/coverage/unit/lcov-report
            frontend/coverage/unit/index.html
          if-no-files-found: error

  fe-e2e:
    name: Frontend end-to-end tests
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'

      - name: Install Playwright browser dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: yarn test:e2e

      - name: Upload frontend e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: |
            frontend/coverage/e2e/coverage-final.json
            frontend/coverage/e2e/coverage-summary.json
            frontend/coverage/e2e/lcov.info
            frontend/coverage/e2e/html
          if-no-files-found: error

  fe-build-push:
    name: Build and publish frontend Docker image
    needs: [ check-changes, coverage, fe-static, fe-unit, fe-e2e ]
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and optionally push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openapi-sync:
    name: Validate OpenAPI client generation
    needs: check-changes
    if: needs.check-changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          cp env/.api.env.example env/.api.env
          cp env/.db.env.example env/.db.env
          cp env/.rabbitmq.env.example env/.rabbitmq.env

      - name: Start development stack via Docker Compose
        run: |
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for API container health check
        run: |
          set -euo pipefail
          for i in {1..24}; do
            CID="$(docker compose -f docker-compose.dev.yml ps -q api || true)"
            if [ -z "$CID" ]; then
              echo "api container not created yet (attempt $i/24)"
            else
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo 'unknown')"
              echo "api health status: $STATUS (attempt $i/24)"
              if [ "$STATUS" = "healthy" ]; then
                echo "api is healthy"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "api did not become healthy in time"
          docker compose -f docker-compose.dev.yml ps
          exit 1

      - name: Generate OpenAPI client code
        run: |
          chmod +x ./generate_openapi.sh
          ./generate_openapi.sh

      - name: Assert OpenAPI spec and client are in sync
        run: |
          git diff --exit-code -- openapi frontend

      - name: Tear down development stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  deploy:
    name: Deploy to production
    needs: [ check-changes, api-build-push, fe-build-push, openapi-sync, coverage ]
    if: ${{
      always()
      && github.ref == 'refs/heads/main'
      && (needs.check-changes.outputs.api == 'false' || needs.api-build-push.result == 'success')
      && (needs.check-changes.outputs.frontend == 'false' || needs.fe-build-push.result == 'success')
      && (needs.openapi-sync.result == 'success' || needs.openapi-sync.result == 'skipped')
      && (needs.coverage.result == 'success' || needs.coverage.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://esa-blueshell.nl
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add deployment host to known hosts
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote deploy command
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -p "${{ secrets.PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
            "bash -lc 'website pull'"
