    4Kkmbq2qsMr1P0y1j3X0uXg+uGNhAgMBAAECgYAePOMPZJlgL9GSKYmT0qG3mhEk
    pDHpPzEOanWjJSoDu3Lj0+LdWks1rSoRFEzsnV0eeNCQW4sS0koM8aeFuMhiLc8Q
    KP7UecthtjLxzjqQPDwj5z90pkSg9GPKkoKC9h83Ioj6KqhvE3vN2NfGrWX/Gcmr
    BvVnw+btaoFgxzjncQJBAOtwr4+8qTHVxDApKteymCljlli4hS3KQGOrPiQUtszl
    HpckKJfFJeuvB8kLxPEdhKSegu1BCd7WCPbWPfiYL3UCQQCgKy3Dkx29PcP+O36m
    aS9G2rvivUh0ceD3fIqeUuhcCa+Gd4JH4g3/HUpOj8lV8HacI+MM4B/DF46lbLoy
    JrK9AkB3hY86kvX5vKGKKXv8YEfqywmqJJJHeqNRdb9oJbPfNHlhFRQeaBEmIob7
    QyRJm0iZIXcp5piSLWoDlSOErg15AkARLlCMaB2KjTOW897UDvhpS1FYMyGwi/6r
    zYo5DX+rT8aqT+uDtnX15bhw0O+x7kdq3FagrPH7RW2hxRX8BzapAkB8TTIWgCgu
    YOYLy5TUv9YKShgfe50C6j1HyZajzJBV1PdS7298SB2n2dvbUGWvUohXXMCXVRdS
    wRRHv41dPOIL
    -----END PRIVATE KEY-----
  GOOGLE_CALENDAR_PRIVATE_KEY_ID: something

  GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

permissions:
  contents: read

jobs:
  fe-static:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

  api-static:
    name: API compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Compile API main and test sources
        run: ./gradlew --no-daemon :api:compileKotlin :api:compileTestKotlin

  api-verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-changes.outputs.api_verification_matrix) }}

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USERNAME }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < env/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/$RABBITMQ_HOST/$RABBITMQ_PORT) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js and Yarn
        if: matrix.id == 'system'
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Start instrumented frontend for system tests
        if: matrix.id == 'system'
        run: |
          set -euo pipefail
          VITE_COVERAGE=true VITE_APP_URL="$APP_URL" \
            yarn --cwd frontend dev --host 0.0.0.0 --port 3000 > frontend-dev.log 2>&1 &
          echo $! > frontend-dev.pid

      - name: Wait for frontend readiness
        if: matrix.id == 'system'
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS "$FRONTEND_URL" >/dev/null 2>&1; then
              echo "Frontend is ready."
              exit 0
            fi
            echo "Waiting for frontend... ($i/60)"
            sleep 2
          done
          echo "Frontend failed to start."
          exit 1

      - name: Run API Gradle tests
        if: matrix.id == 'api'
        run: ./gradlew --no-daemon :api:test :api:jacocoTestReport

      - name: Run system tests and JaCoCo system report
        if: matrix.id == 'system'
        run: |
          ./gradlew --no-daemon :api:systemTest :api:jacocoSystemTestReport \
            -Dsystem.frontend.url="$FRONTEND_URL" \
            -Dfrontend.coverage.enabled=true \
            -Dfrontend.coverage.required=true

      - name: Convert frontend raw coverage to LCOV
        if: matrix.id == 'system'
        run: |
          yarn --cwd frontend coverage:system:report \
            --raw-dir ../api/build/coverage/frontend-system/raw \
            --out-dir ../api/build/coverage/frontend-system

      - name: Stop frontend process
        if: always() && matrix.id == 'system'
        run: |
          if [ -f frontend-dev.pid ]; then
            kill "$(cat frontend-dev.pid)" || true
          fi

      - name: Upload API test coverage artifacts
        if: always() && matrix.id == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: api-test-coverage
          path: |
            api/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            api/build/reports/jacoco/jacocoTestReport/html
            api/build/reports/tests/test
          if-no-files-found: warn

      - name: Upload API system coverage artifacts
        if: always() && matrix.id == 'system'
        uses: actions/upload-artifact@v4
        with:
          name: api-system-coverage
          path: |
            api/build/reports/jacoco/jacocoSystemTestReport/jacocoSystemTestReport.xml
            api/build/reports/jacoco/jacocoSystemTestReport/html
            api/build/coverage/frontend-system/coverage-final.json
            api/build/coverage/frontend-system/lcov.info
            api/build/coverage/frontend-system/html
            frontend-dev.log
          if-no-files-found: warn

  fe-unit:
    name: Frontend unit tests with coverage
    needs: fe-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run frontend unit tests with coverage
        run: yarn test:unit:coverage

      - name: Upload frontend unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/unit/coverage-final.json
            frontend/coverage/unit/coverage-summary.json
            frontend/coverage/unit/lcov.info
            frontend/coverage/unit/lcov-report
            frontend/coverage/unit/index.html
          if-no-files-found: error

  fe-e2e:
    name: Frontend end-to-end tests
    needs: fe-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Install Playwright browser dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: yarn test:e2e

      - name: Upload frontend e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: |
            frontend/coverage/e2e/coverage-final.json
            frontend/coverage/e2e/coverage-summary.json
            frontend/coverage/e2e/lcov.info
            frontend/coverage/e2e/html
          if-no-files-found: error

  coverage:
    name: Merge and enforce code coverage
    needs: [ api-verification, fe-unit, fe-e2e ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download API test coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: api-test-coverage
          path: coverage-inputs/api-test

      - name: Download API system coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: api-system-coverage
          path: coverage-inputs/api-system

      - name: Download frontend unit coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-coverage
          path: coverage-inputs/frontend-unit

      - name: Download frontend e2e coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: coverage-inputs/frontend-e2e

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Merge all discovered coverage reports
        run: |
          set -euo pipefail
          chmod +x ./merge-coverage.sh
          ./merge-coverage.sh --out "coverage/merged"

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report
          path: coverage/merged
          if-no-files-found: error

      - name: Enforce merged coverage threshold
        run: |
          chmod +x ./scripts/check-cobertura-threshold.sh
          ./scripts/check-cobertura-threshold.sh \
            --file coverage/merged/Cobertura.xml \
            --min-line-rate "${COVERAGE_MIN_LINE_RATE}"

  openapi-sync:
    name: Validate OpenAPI client generation
    needs: [ api-static, fe-static ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USERNAME }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < env/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/$RABBITMQ_HOST/$RABBITMQ_PORT) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Generate OpenAPI spec and frontend clients
        run: |
          chmod +x ./scripts/generate-openapi-local.sh
          ./scripts/generate-openapi-local.sh

      - name: Assert OpenAPI spec and client are in sync
        run: git diff --exit-code -- openapi frontend/src/services/api

      - name: Upload OpenAPI generation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-sync-logs
          path: openapi-api.log
          if-no-files-found: ignore

  api-build:
    name: Build API Docker image
    needs: [ coverage, openapi-sync ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-push:
    name: Push API Docker image
    if: github.ref == 'refs/heads/main'
    needs: [ api-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fe-build:
    name: Build frontend Docker image
    needs: [ coverage, openapi-sync ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fe-push:
    name: Push frontend Docker image
    if: github.ref == 'refs/heads/main'
    needs: [ fe-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    needs: [ api-push, fe-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://esa-blueshell.nl
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add deployment host to known hosts
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote deploy command
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -p "${{ secrets.PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
            "bash -lc 'website pull'"
