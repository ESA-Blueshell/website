name: CI

on:
  push:
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'env/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'openapi/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'scripts/**'
      - 'nginx/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  COVERAGE_MIN_LINE_RATE: "0.80"

permissions:
  contents: read

jobs:
  check-changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'pom.xml'
              - 'env/**'
              - 'scripts/**'
              - 'docker-compose.dev.yml'
            frontend:
              - 'frontend/**'
            openapi:
              - 'api/**'
              - 'frontend/**'
              - 'openapi/**'
              - 'generate_openapi.sh'
              - 'docker-compose.dev.yml'
              - 'env/**'

  api-tests:
    name: Run API tests
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true' || needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: "blueshell"
          MYSQL_DATABASE: "blueshell-test"
          MYSQL_PORT: 3306
          MYSQL_USER: "blueshell"
          MYSQL_PASSWORD: "blueshell"
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: "guest"
          RABBITMQ_DEFAULT_PASS: "guest"
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      MYSQL_ROOT_PASSWORD: blueshell
      MYSQL_DATABASE: blueshell-test
      MYSQL_PORT: '3306'
      MYSQL_USER: blueshell
      MYSQL_PASSWORD: blueshell
      MYSQL_HOST: 127.0.0.1
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: '5672'
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest

      APP_URL: https://localhost/api
      FRONTEND_URL: https://localhost

      JWT_SECRET: YourBase64Encoded64ByteKeyHerejlasjdlfkjasdfjlakw4jpoiasdvpocimu4019mcfawb09hmf8j123890cqwepjc

      SMTP_HOST: mail.blueshell.utwente.nl
      SMTP_PORT: '465'
      SMTP_USERNAME: your_smtp_username
      SMTP_PASSWORD: your_smtp_password

      STORAGE_LOCATION: ./storage

      BREVO_API_KEY: something
      BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

      GOOGLE_CALENDAR_ID: something
      GOOGLE_CALENDAR_CLIENT_ID: something
      GOOGLE_CALENDAR_CLIENT_EMAIL: something
      GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8: |
        -----BEGIN PRIVATE KEY-----
        MIICdQIBADANBgkqhkiG9w0BAQEFAASCAl8wggJbAgEAAoGBAJNOI74ADXzV2H63
