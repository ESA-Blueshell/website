name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'env/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'openapi/**'
      - 'docker-compose.yml'
      - 'nginx/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'env/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  workflow_dispatch:

# one-at-a-time per ref; cancel older runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  # ---------- Change detection ----------
  check-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'pom.xml'
              - 'env/**'
            frontend:
              - 'frontend/**'

  # ---------- API ----------
  api-tests:
    name: API tests
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: "blueshell"
          MYSQL_DATABASE: "blueshell-test"
          MYSQL_PORT: 3306
          MYSQL_USER: "blueshell"
          MYSQL_PASSWORD: "blueshell"
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      # MySQL
      MYSQL_ROOT_PASSWORD: blueshell
      MYSQL_DATABASE: blueshell-test
      MYSQL_PORT: '3306'
      MYSQL_USER: blueshell
      MYSQL_PASSWORD: blueshell
      MYSQL_HOST: 127.0.0.1

      # App URLs
      APP_URL: https://localhost/api
      FRONTEND_URL: https://localhost

      # JWT (test-only placeholder)
      JWT_SECRET: YourBase64Encoded64ByteKeyHerejlasjdlfkjasdfjlakw4jpoiasdvpocimu4019mcfawb09hmf8j123890cqwepjc

      # SMTP (test-only placeholders)
      SMTP_HOST: mail.blueshell.utwente.nl
      SMTP_PORT: '465'
      SMTP_USERNAME: your_smtp_username
      SMTP_PASSWORD: your_smtp_password

      # Storage
      STORAGE_LOCATION: ./storage

      # Brevo (test-only placeholders)
      BREVO_API_KEY: something
      BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

      # Google Calendar (test-only placeholders)
      GOOGLE_CALENDAR_ID: something
      GOOGLE_CALENDAR_CLIENT_ID: something
      GOOGLE_CALENDAR_CLIENT_EMAIL: something
      GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8: |
        -----BEGIN PRIVATE KEY-----
        MIICdQIBADANBgkqhkiG9w0BAQEFAASCAl8wggJbAgEAAoGBAJNOI74ADXzV2H63
        s/wyuR7hW61c0ORfHSBSSIgmdglGqtSb8ERzet79zodXvmeZu2Cl6phtEIsXZ0uF
        dfNBmIFjI2i3LT9+7zb+n5OcwKgwSxyKCeL6sB4aOQ/gljH2mpsTFkk6UdoKZ0NH
        4Kkmbq2qsMr1P0y1j3X0uXg+uGNhAgMBAAECgYAePOMPZJlgL9GSKYmT0qG3mhEk
        pDHpPzEOanWjJSoDu3Lj0+LdWks1rSoRFEzsnV0eeNCQW4sS0koM8aeFuMhiLc8Q
        KP7UecthtjLxzjqQPDwj5z90pkSg9GPKkoKC9h83Ioj6KqhvE3vN2NfGrWX/Gcmr
        BvVnw+btaoFgxzjncQJBAOtwr4+8qTHVxDApKteymCljlli4hS3KQGOrPiQUtszl
        HpckKJfFJeuvB8kLxPEdhKSegu1BCd7WCPbWPfiYL3UCQQCgKy3Dkx29PcP+O36m
        aS9G2rvivUh0ceD3fIqeUuhcCa+Gd4JH4g3/HUpOj8lV8HacI+MM4B/DF46lbLoy
        JrK9AkB3hY86kvX5vKGKKXv8YEfqywmqJJJHeqNRdb9oJbPfNHlhFRQeaBEmIob7
        QyRJm0iZIXcp5piSLWoDlSOErg15AkARLlCMaB2KjTOW897UDvhpS1FYMyGwi/6r
        zYo5DX+rT8aqT+uDtnX15bhw0O+x7kdq3FagrPH7RW2hxRX8BzapAkB8TTIWgCgu
        YOYLy5TUv9YKShgfe50C6j1HyZajzJBV1PdS7298SB2n2dvbUGWvUohXXMCXVRdS
        wRRHv41dPOIL
        -----END PRIVATE KEY-----
      GOOGLE_CALENDAR_PRIVATE_KEY_ID: something

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for database to be ready
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Prepare db
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell < env/0_init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "USE blueshell-test; SHOW TABLES;"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Run tests with Maven
        run: |
          mvn -B \
            -Dsurefire.printSummary=true \
            -Dfailsafe.printSummary=true \
            verify
        working-directory: api
        env:
          MAVEN_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

  api-build-push:
    name: API build
    needs: [ check-changes, api-tests ]
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------- Frontend ----------
  fe-verify:
    name: Frontend verify (typecheck+lint)
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'
      - run: yarn typecheck
      - run: yarn lint

  fe-build-push:
    name: Frontend build
    needs: [ check-changes, fe-verify ]
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    needs: [ check-changes, api-build-push, fe-build-push ]
    if: ${{
      always()
      && github.ref == 'refs/heads/main'
      && (needs.check-changes.outputs.api == 'false' || needs.api-build-push.result == 'success')
      && (needs.check-changes.outputs.frontend == 'false' || needs.fe-build-push.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://esa-blueshell.nl
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Add SSH key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p /home/runner/.ssh
          ssh-keyscan "${{ secrets.IP_ADDRESS }}" >> /home/runner/.ssh/known_hosts
          echo "${{ secrets.SSH_KEY }}" > /home/runner/.ssh/github_actions
          chmod 600 /home/runner/.ssh/github_actions
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /home/runner/.ssh/github_actions

      - name: Run deploy over SSH
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.IP_ADDRESS }}" "website pull"