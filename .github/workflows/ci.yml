name: CI

on:
  push:
    paths:
      - 'services/api/**'
      - 'services/frontend/**'
      - 'services/system-tests/**'
      - 'build-logic/**'
      - 'libs/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.lockfile'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'platform/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'docker-compose.dev.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  JAVA_VERSION: '21'
  # Node 22 (not 24) — yarn 4.10 + playwright hit an EBADF fstat
  # regression in Node 24's ESM loader during install steps. Dev image
  # pinned to node:22-bookworm-slim for the same reason.
  NODE_VERSION: '22'
  YARN_VERSION: '4.10.3'

  MYSQL_ROOT_PASSWORD: blueshell
  MYSQL_DATABASE: blueshell-test
  MYSQL_PORT: '3306'
  MYSQL_USER: blueshell
  MYSQL_PASSWORD: ci-blueshell
  MYSQL_HOST: 127.0.0.1

  RABBITMQ_HOST: 127.0.0.1
  RABBITMQ_PORT: '5672'
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest

  APP_URL: http://127.0.0.1:8080
  FRONTEND_URL: http://127.0.0.1:3000

  JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh

  STORAGE_LOCATION: ./storage

  BREVO_API_KEY: something
  BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

  GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

permissions:
  contents: read

jobs:
  nix-flake-check:
    name: NixOS flake check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix with flake support
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache /nix/store for faster re-runs
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Validate platform flake
        run: |
          nix flake check ./platform --no-build --show-trace

  fe-static:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

  api-static:
    name: API compile checks
    runs-on: ubuntu-latest
    outputs:
      gradle-cache-key: ${{ steps.gradle-cache-key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compute Gradle cache key
        id: gradle-cache-key
        run: echo "key=gradle-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache-key.outputs.key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compile API main, test and integration-test sources
        run: |
          ./gradlew --no-daemon --build-cache \
            :services:api:compileKotlin \
            :services:api:compileTestFixturesKotlin \
            :services:api:compileTestKotlin \
            :services:api:compileIntegrationTestKotlin \
            :services:system-tests:compileTestKotlin

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache-key.outputs.key }}

  api-tests:
    name: API unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ api-static, fe-static ]

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USERNAME }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < services/api/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/$RABBITMQ_HOST/$RABBITMQ_PORT) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle cache from API build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.api-static.outputs.gradle-cache-key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run API unit and integration tests
        run: |
          ./gradlew --no-daemon --build-cache \
            :services:api:test \
            :services:api:integrationTest \
            :services:api:jacocoTestReport \
            :services:api:jacocoIntegrationTestReport

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            services/api/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            services/api/build/reports/jacoco/jacocoTestReport/html
            services/api/build/reports/jacoco/jacocoIntegrationTestReport/jacocoIntegrationTestReport.xml
            services/api/build/reports/jacoco/jacocoIntegrationTestReport/html
            services/api/build/reports/tests/test
            services/api/build/reports/tests/integrationTest
          if-no-files-found: warn

  system-tests:
    name: System tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ api-static, fe-static ]

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USERNAME }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < services/api/0_init.sql

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/$RABBITMQ_HOST/$RABBITMQ_PORT) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Restore Gradle cache from API build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.api-static.outputs.gradle-cache-key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Playwright browser for system tests
        run: ./gradlew --no-daemon :services:system-tests:installChromium

      - name: Start instrumented frontend for system tests
        run: |
          set -euo pipefail
          VITE_COVERAGE=true VITE_APP_URL="$APP_URL" \
            yarn --cwd services/frontend dev --host 0.0.0.0 --port 3000 > frontend-dev.log 2>&1 &
          echo $! > frontend-dev.pid

      - name: Wait for frontend readiness
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS "$FRONTEND_URL" >/dev/null 2>&1; then
              echo "Frontend is ready."
              exit 0
            fi
            echo "Waiting for frontend... ($i/60)"
            sleep 2
          done
          echo "Frontend failed to start."
          exit 1

      - name: Run system tests (no coverage enforcement)
        run: |
          ./gradlew --no-daemon :services:system-tests:test \
            -Dsystem.frontend.url="$FRONTEND_URL"

      - name: Stop frontend process
        if: always()
        run: |
          if [ -f frontend-dev.pid ]; then
            kill "$(cat frontend-dev.pid)" || true
          fi

      - name: Upload system-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: |
            services/system-tests/build/reports/tests/test
            frontend-dev.log
          if-no-files-found: warn

  fe-unit:
    name: Frontend unit tests with coverage
    needs: fe-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run frontend unit tests with coverage
        run: yarn test:unit:coverage

      - name: Upload frontend unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            services/frontend/coverage/unit/coverage-final.json
            services/frontend/coverage/unit/coverage-summary.json
            services/frontend/coverage/unit/lcov.info
            services/frontend/coverage/unit/lcov-report
            services/frontend/coverage/unit/index.html
          if-no-files-found: error

  fe-e2e:
    name: Frontend end-to-end tests
    needs: fe-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Install Playwright browser dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: yarn test:e2e

      - name: Upload frontend e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: |
            services/frontend/coverage/e2e/coverage-final.json
            services/frontend/coverage/e2e/coverage-summary.json
            services/frontend/coverage/e2e/lcov.info
            services/frontend/coverage/e2e/html
          if-no-files-found: error

  openapi-sync:
    name: Validate OpenAPI client generation
    needs: [ api-static, fe-static ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: [ "5672:5672" ]
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USERNAME }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < services/api/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Wait for RabbitMQ service
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/$RABBITMQ_HOST/$RABBITMQ_PORT) >/dev/null 2>&1; then
              echo "RabbitMQ is ready!"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time."
          exit 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle cache from API build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.api-static.outputs.gradle-cache-key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Generate OpenAPI spec and frontend clients
        run: |
          chmod +x ./scripts/generate-openapi-local.sh
          ./scripts/generate-openapi-local.sh

      - name: Assert OpenAPI spec and client are in sync
        run: git diff --exit-code -- services/api/openapi.yaml libs/openapi-specs services/frontend/src/services/api

      - name: Upload OpenAPI generation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-sync-logs
          path: openapi-api.log
          if-no-files-found: ignore
