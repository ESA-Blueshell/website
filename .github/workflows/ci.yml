name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'env/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'openapi/**'
      - 'docker-compose.yml'
      - 'nginx/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'env/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'openapi/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  check-changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'pom.xml'
              - 'env/**'
            frontend:
              - 'frontend/**'

  api-tests:
    name: Run API integration tests
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: "blueshell"
          MYSQL_DATABASE: "blueshell-test"
          MYSQL_PORT: 3306
          MYSQL_USER: "blueshell"
          MYSQL_PASSWORD: "blueshell"
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      MYSQL_ROOT_PASSWORD: blueshell
      MYSQL_DATABASE: blueshell-test
      MYSQL_PORT: '3306'
      MYSQL_USER: blueshell
      MYSQL_PASSWORD: blueshell
      MYSQL_HOST: 127.0.0.1

      APP_URL: https://localhost/api
      FRONTEND_URL: https://localhost

      JWT_SECRET: YourBase64Encoded64ByteKeyHerejlasjdlfkjasdfjlakw4jpoiasdvpocimu4019mcfawb09hmf8j123890cqwepjc

      SMTP_HOST: mail.blueshell.utwente.nl
      SMTP_PORT: '465'
      SMTP_USERNAME: your_smtp_username
      SMTP_PASSWORD: your_smtp_password

      STORAGE_LOCATION: ./storage

      BREVO_API_KEY: something
      BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

      GOOGLE_CALENDAR_ID: something
      GOOGLE_CALENDAR_CLIENT_ID: something
      GOOGLE_CALENDAR_CLIENT_EMAIL: something
      GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8: |
        -----BEGIN PRIVATE KEY-----
        MIICdQIBADANBgkqhkiG9w0BAQEFAASCAl8wggJbAgEAAoGBAJNOI74ADXzV2H63
        s/wyuR7hW61c0ORfHSBSSIgmdglGqtSb8ERzet79zodXvmeZu2Cl6phtEIsXZ0uF
        dfNBmIFjI2i3LT9+7zb+n5OcwKgwSxyKCeL6sB4aOQ/gljH2mpsTFkk6UdoKZ0NH
        4Kkmbq2qsMr1P0y1j3X0uXg+uGNhAgMBAAECgYAePOMPZJlgL9GSKYmT0qG3mhEk
        pDHpPzEOanWjJSoDu3Lj0+LdWks1rSoRFEzsnV0eeNCQW4sS0koM8aeFuMhiLc8Q
        KP7UecthtjLxzjqQPDwj5z90pkSg9GPKkoKC9h83Ioj6KqhvE3vN2NfGrWX/Gcmr
        BvVnw+btaoFgxzjncQJBAOtwr4+8qTHVxDApKteymCljlli4hS3KQGOrPiQUtszl
        HpckKJfFJeuvB8kLxPEdhKSegu1BCd7WCPbWPfiYL3UCQQCgKy3Dkx29PcP+O36m
        aS9G2rvivUh0ceD3fIqeUuhcCa+Gd4JH4g3/HUpOj8lV8HacI+MM4B/DF46lbLoy
        JrK9AkB3hY86kvX5vKGKKXv8YEfqywmqJJJHeqNRdb9oJbPfNHlhFRQeaBEmIob7
        QyRJm0iZIXcp5piSLWoDlSOErg15AkARLlCMaB2KjTOW897UDvhpS1FYMyGwi/6r
        zYo5DX+rT8aqT+uDtnX15bhw0O+x7kdq3FagrPH7RW2hxRX8BzapAkB8TTIWgCgu
        YOYLy5TUv9YKShgfe50C6j1HyZajzJBV1PdS7298SB2n2dvbUGWvUohXXMCXVRdS
        wRRHv41dPOIL
        -----END PRIVATE KEY-----
      GOOGLE_CALENDAR_PRIVATE_KEY_ID: something

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Prepare test database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell < env/0_init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -P 3306 -uroot -pblueshell -e "USE blueshell-test; SHOW TABLES;"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Run API Gradle tests
        shell: bash
        run:
          set -euo pipefail

          ./gradlew --no-daemon :api:test
        env:
          GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api/build/reports
            build/reports
          if-no-files-found: warn

  api-build-push:
    name: Build and publish API Docker image
    needs: [ check-changes, api-tests ]
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and optionally push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fe-verify:
    name: Run frontend static checks
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: '24'
          yarn-version: '4.10.3'

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

  fe-build-push:
    name: Build and publish frontend Docker image
    needs: [ check-changes, fe-verify ]
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and optionally push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openapi-sync:
    name: Validate OpenAPI client generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          cp env/.api.env.example env/.api.env
          cp env/.db.env.example env/.db.env

      - name: Start development stack via Docker Compose
        run: |
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for API container health check
        run: |
          set -euo pipefail
          for i in {1..12}; do
            CID="$(docker compose -f docker-compose.dev.yml ps -q api || true)"
            if [ -z "$CID" ]; then
              echo "api container not created yet (attempt $i/12)"
            else
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo 'unknown')"
              echo "api health status: $STATUS (attempt $i/12)"
              if [ "$STATUS" = "healthy" ]; then
                echo "api is healthy"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "api did not become healthy in time"
          docker compose -f docker-compose.dev.yml ps
          exit 1

      - name: Generate OpenAPI client code
        run: |
          chmod +x ./generate_openapi.sh
          ./generate_openapi.sh

      - name: Assert OpenAPI spec and client are in sync
        run: |
          git diff --exit-code -- openapi frontend

      - name: Tear down development stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  deploy:
    name: Deploy to production
    needs: [ check-changes, api-build-push, fe-build-push, openapi-sync ]
    if: ${{
      always()
      && github.ref == 'refs/heads/main'
      && (needs.check-changes.outputs.api == 'false' || needs.api-build-push.result == 'success')
      && (needs.check-changes.outputs.frontend == 'false' || needs.fe-build-push.result == 'success')
      && needs.openapi-sync.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://esa-blueshell.nl
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add deployment host to known hosts
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote deploy command
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -p "${{ secrets.PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
            "bash -lc 'website pull'"
