name: CodeQL

# Advanced CodeQL setup. To take effect, GitHub's managed "default setup"
# must be turned off first:
#   Settings -> Code security -> CodeQL analysis -> Tool: CodeQL ->
#   switch from "Default" to "Advanced".
# While default setup is enabled, the analyze step below fails with
# "Code Scanning could not process the submitted SARIF: default setup
# is enabled". The two cannot run side by side.
#
# Scans every analysable language in the repo. Unlike the prior default
# setup, the Kotlin backend is built manually here so it is actually
# analysed rather than silently skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published queries flag latent issues even
    # when no code changed. Monday 06:17 UTC — off the top of the hour to
    # avoid the cron stampede.
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # build-mode `none` extracts straight from source for every
        # language here. For java-kotlin this is the key difference from a
        # `manual` Gradle build: the CodeQL Kotlin extractor tracing a
        # cold-cache Gradle + kapt compile on the Java 25 toolchain ran
        # past 30 minutes, whereas source extraction covers the backend in
        # a few. Either way Kotlin is now scanned — default setup never
        # included it at all.
        language: [actions, javascript-typescript, java-kotlin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
