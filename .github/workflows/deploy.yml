# =============================================================================
# deploy.yml — manually deploy any branch to development, staging, or production.
#
# Trigger: Actions → "Manual Deploy" → Run workflow → choose branch + environment.
#
# What it does:
#   1. Resolves the short SHA of the checked-out commit and maps the environment
#      to its image tag (dev / staging / latest).
#   2. Re-tags the pre-built sha-<7char> images (produced by build-push.yml) with
#      the environment tag — no rebuild, same artifact that CI tested.
#   3. SSHes to the target environment's server and runs 'website up <env>'.
#
# GitHub Environments required (Settings → Environments):
#   development  — secrets: SSH_KEY, IP_ADDRESS, PORT, DEPLOY_USER
#   staging      — secrets: SSH_KEY, IP_ADDRESS, PORT, DEPLOY_USER
#   production   — secrets: SSH_KEY, IP_ADDRESS, PORT, DEPLOY_USER
#
# Each environment can point to the same server (different Swarm stacks) or
# separate servers. The stacks run simultaneously on one server:
#   production   → Swarm stack 'website'          (IMAGE_TAG=latest)
#   staging      → Swarm stack 'website-staging'  (IMAGE_TAG=staging)
#   development  → Swarm stack 'website-dev'       (IMAGE_TAG=dev)
# =============================================================================

name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: staging
        options:
          - development
          - staging
          - production

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false  # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  OWNER:    ${{ github.repository_owner }}

jobs:
  # ── Resolve environment → image tag + short SHA ─────────────────────────────
  resolve:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      sha_short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Map environment to image tag
        id: tag
        run: |
          case "${{ inputs.environment }}" in
            production)  echo "tag=latest"  >> "$GITHUB_OUTPUT" ;;
            staging)     echo "tag=staging" >> "$GITHUB_OUTPUT" ;;
            development) echo "tag=dev"     >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Compute short SHA
        id: sha
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.sha }}

  # ── Re-tag pre-built images ─────────────────────────────────────────────────
  retag:
    name: Re-tag ${{ matrix.service }} (${{ needs.resolve.outputs.sha_short }} → ${{ needs.resolve.outputs.image_tag }})
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ api, frontend, rotator ]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Re-tag sha-${{ needs.resolve.outputs.sha_short }} → ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          OWNER_LC="${OWNER,,}"
          SOURCE="${REGISTRY}/${OWNER_LC}/${SERVICE}:sha-${SHA_SHORT}"
          TARGET="${REGISTRY}/${OWNER_LC}/${SERVICE}:${IMAGE_TAG}"
          echo "Re-tagging ${SOURCE} → ${TARGET}"
          docker buildx imagetools create --tag "${TARGET}" "${SOURCE}"
        env:
          SERVICE:   ${{ matrix.service }}
          SHA_SHORT: ${{ needs.resolve.outputs.sha_short }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}

  # ── Deploy to target environment ────────────────────────────────────────────
  deploy:
    name: Deploy → ${{ inputs.environment }}
    needs: [ resolve, retag ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url:  ${{ vars.DEPLOY_URL }}
    permissions:
      contents:     read
      deployments:  write
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add deployment host to known hosts
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" \
            >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy stack on server
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
              -p "${{ secrets.PORT }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
              "bash -lc 'website up ${{ inputs.environment }}'"

      - name: Deployment summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image tag** | \`${{ needs.resolve.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ needs.resolve.outputs.sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Project** | \`website-${{ inputs.environment == 'production' && '' || inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
