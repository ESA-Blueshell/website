name: Deploy

# Builds and pushes the images Keel polls (:latest) on every main commit.
# Validation lives in validate.yml and is gated by the PR; main is purely
# the artefact-publish boundary.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Sequential: two consecutive main commits build one after the other.
# cancel-in-progress: false so a fast follow-up doesn't kill an in-flight
# image push that downstream Keel would otherwise have rolled.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  detect-changes:
    # Compare the merge commit against the previous main commit and only
    # rebuild services whose code (or its shared deps) actually changed.
    # Services that didn't change keep their existing ghcr :latest tag, so
    # Keel doesn't churn pods for nothing.
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has-matrix: ${{ steps.compute.outputs.has-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            workflow:
              - '.github/workflows/deploy.yml'
            api:
              - 'services/api/**'
            frontend:
              - 'services/frontend/**'
            build-logic:
              - 'build-logic/**'
            libs:
              - 'libs/**'
            gradle-config:
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.lockfile'
              - 'gradlew'
              - 'gradlew.bat'

      - name: Compute rebuild matrix
        id: compute
        env:
          FILTER_WORKFLOW: ${{ steps.filter.outputs.workflow }}
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_BUILD_LOGIC: ${{ steps.filter.outputs.build-logic }}
          FILTER_LIBS: ${{ steps.filter.outputs.libs }}
          FILTER_GRADLE_CONFIG: ${{ steps.filter.outputs.gradle-config }}
        run: |
          set -euo pipefail
          any() { for v in "$@"; do [[ "$v" == "true" ]] && echo "true" && return; done; echo "false"; }

          # build-logic / libs / gradle-config affect the JVM build classpath
          # (api). The workflow itself touches both. Frontend changes never
          # invalidate the api and vice versa beyond shared gradle config.
          API_SHARED=$(any "$FILTER_WORKFLOW" "$FILTER_BUILD_LOGIC" "$FILTER_LIBS" "$FILTER_GRADLE_CONFIG")
          FRONTEND_SHARED=$(any "$FILTER_WORKFLOW")

          MATRIX="[]"
          append() {
            local name=$1 context=$2 file=$3 platforms=$4
            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg n "$name" --arg c "$context" --arg f "$file" --arg p "$platforms" \
              '. + [{"name":$n, "context":$c, "file":$f, "platforms":$p}]')
          }

          [[ "$(any "$API_SHARED"      "$FILTER_API")"      == "true" ]] \
            && append api      .                 services/api/Dockerfile      linux/amd64
          [[ "$(any "$FRONTEND_SHARED" "$FILTER_FRONTEND")" == "true" ]] \
            && append frontend services/frontend services/frontend/Dockerfile linux/amd64,linux/arm64

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [[ "$MATRIX" == "[]" ]]; then
            echo "has-matrix=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No service image needs rebuilding for this push."
          else
            echo "has-matrix=true" >> "$GITHUB_OUTPUT"
            echo "Rebuild matrix: $MATRIX"
          fi

  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-matrix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # QEMU is only used when a service builds for a non-runner arch
      # (frontend builds linux/arm64 alongside amd64). No-op for the
      # amd64-only api.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.sha }}

      - name: Build & push ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          platforms: ${{ matrix.service.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
