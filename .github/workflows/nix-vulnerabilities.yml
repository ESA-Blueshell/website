name: NixOS vulnerability scan

# Dependabot does not read Nix, so the host's packages reach the security
# overview only through code scanning. The scan reads the host as main locks it;
# the running host matches only after a rebuild.

on:
  push:
    branches: [main]
    paths:
      - 'platform/flake.lock'
      - 'platform/flake.nix'
      - 'platform/nix/**'
      - '.github/workflows/nix-vulnerabilities.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platform/flake.lock'
      - 'platform/flake.nix'
      - 'platform/nix/**'
      - '.github/workflows/nix-vulnerabilities.yml'
  # A new CVE lands without any change here.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan the NixOS host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      HOST: frankfurt-contabo-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix with flake support
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache /nix/store for faster re-runs
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # Runtime closure only: the build-time one adds every bootstrap compiler
      # and thousands of findings for code the host never runs. nixpkgs' own
      # sbomnix fails to build, so this runs the upstream flake at a tag.
      - name: Build the host and write its SBOM
        run: |
          nix run github:tiiuae/sbomnix/v1.9.0#sbomnix -- \
            --cdx sbom.cdx.json \
            "./platform#nixosConfigurations.${HOST}.config.system.build.toplevel"

      # Grype matches Nix packages by CPE alone. An SBOM without them scans clean.
      - name: Check the SBOM carries CPEs
        run: |
          jq -e '[.components[] | select(.cpe)] | length > 100' sbom.cdx.json > /dev/null ||
            { echo "::error::The SBOM has almost no CPEs, so a scan would find nothing."; exit 1; }
          jq -e '[.components[] | select(.cpe | tostring | startswith("cpe:2.3:o:linux:linux_kernel:"))] | length > 0' sbom.cdx.json > /dev/null ||
            { echo "::error::The SBOM has no kernel CPE."; exit 1; }

      # Only findings with a fixed release, since those are the ones an update
      # can clear. Grype leaves the location empty for an SBOM, which code
      # scanning refuses, so each finding points at the lock file.
      - name: Scan the SBOM
        run: |
          nix shell --inputs-from ./platform nixpkgs#grype -c \
            grype sbom:sbom.cdx.json --only-fixed -o sarif --file grype.sarif
          jq '.runs[].results[].locations[].physicalLocation.artifactLocation.uri = "platform/flake.lock"' \
            grype.sarif > nix-host.sarif
          echo "Findings: $(jq '[.runs[].results[]] | length' nix-host.sarif)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: nix-host.sarif
          category: nixos-host
