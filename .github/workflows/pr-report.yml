name: PR report

# Reports a pull request's shape and its coverage in one comment, found again
# by a marker and updated in place. It gates nothing: the coverage floors in
# the Gradle build and the vitest config are the enforcement, and this only
# says what the numbers are.
#
# `workflow_run` rather than a job inside Validate: a fork's pull request runs
# Validate with a read-only token and cannot comment, and forks plus bots are
# most of this repository's volume. A `workflow_run` job runs in the base
# repository with a write token. That is only safe because nothing here checks
# out or executes head-ref code — it reads the artifacts Validate uploaded and
# the pulls API, both of which are data. Do not add a checkout of the head ref.
#
# The baseline job is on `push` because only the default branch may decide what
# every pull request compares against.
#
# The baseline is an artifact, not a cache. A cache entry is evictable: this
# repository holds more cache than its limit, so the buildkit blobs drop a
# 450-byte baseline by least-recent-use within hours and every pull request
# reported in that gap says there is nothing to compare against. One artifact
# name carries every version of the baseline, and the reader takes the newest
# one the default branch uploaded.

on:
  workflow_run:
    workflows: [ Validate ]
    types: [ completed ]
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  BASELINE_ARTIFACT: coverage-baseline
  # The unit suites only, matching SUITES in .github/scripts/pr_report.py.
  COVERAGE_ARTIFACTS: >-
    api-unit-test-reports frontend-unit-coverage pr-report-meta changeset-sql

jobs:
  report:
    name: Comment the pull request's shape and coverage
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One group per head branch, so a new push supersedes that branch's own
    # report and nothing else. A group shared by every pull request cancelled
    # reports that had no conflict with each other.
    concurrency:
      group: pr-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # No `ref:` — this must stay on the trusted default branch. See above.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every artifact is optional. A shard that failed uploads nothing, and a
      # report that names the gap is worth more than a job that fails next to
      # an already-failing suite.
      - name: Download whatever coverage the run produced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/download_coverage.sh

      - name: Download the newest coverage baseline uploaded from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/fetch_baseline.sh

      - name: Comment on the pull request
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COVERAGE_DIR: coverage-artifacts
          BASELINE_PATH: coverage-baseline/baseline.json
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          number_file=coverage-artifacts/pr-report-meta/pr-number
          if [ ! -f "$number_file" ]; then
            echo "The run carried no pull request number; nothing to comment on."
            exit 0
          fi
          PR_NUMBER=$(tr -dc '0-9' < "$number_file")
          export PR_NUMBER
          [ -n "$PR_NUMBER" ] || { echo "Empty pull request number."; exit 0; }
          python3 .github/scripts/pr_report.py render

      # Its own comment, so a pull request that touches no changeset gets none.
      - name: Comment the SQL a changeset will run
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SQL_PATH: coverage-artifacts/changeset-sql/changeset.sql
        run: |
          set -euo pipefail
          number_file=coverage-artifacts/pr-report-meta/pr-number
          [ -f "$number_file" ] || { echo "no pull request number; nothing to comment on."; exit 0; }
          PR_NUMBER=$(tr -dc '0-9' < "$number_file")
          export PR_NUMBER
          [ -n "$PR_NUMBER" ] || exit 0
          python3 .github/scripts/changeset_sql_comment.py

  baseline:
    name: Promote the merged pull request's coverage to the main baseline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serial, and never cancelled: the reader takes the newest upload, so two
    # promotions in flight can land out of commit order.
    concurrency:
      group: pr-report-baseline
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The squash has no run of its own, so the coverage comes from the run
      # that validated the head of the pull request it squashed.
      - name: Find the Validate run that this commit's pull request passed
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merge_commit_sha == env.SHA) | .head.sha] | first // ""')
          # A merge queue entry and a rebase merge both leave merge_commit_sha
          # pointing elsewhere, so fall back to the number in the subject.
          if [ -z "$head_sha" ]; then
            number=$(git log -1 --format=%s "$SHA" | sed -n 's/.*(#\([0-9]\{1,\}\)).*/\1/p')
            if [ -n "$number" ]; then
              head_sha=$(gh api "repos/$REPO/pulls/$number" --jq '.head.sha // ""')
            fi
          fi
          if [ -z "$head_sha" ]; then
            echo "No merged pull request for $SHA; leaving the baseline alone."
            echo "run-id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Newest first, and read whole rather than piped into `head`: a
          # closed pipe fails `gh` under `pipefail`.
          run_id=$(gh api \
            "repos/$REPO/actions/runs?head_sha=$head_sha&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Validate") | .id] | first // ""')
          if [ -z "$run_id" ]; then
            echo "No successful Validate run for $head_sha; leaving the baseline alone."
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download that run's coverage
        if: steps.validated.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.validated.outputs.run-id }}
        run: .github/scripts/download_coverage.sh

      # A commit whose run produced no coverage writes nothing, and the previous
      # artifact stays the newest one. A gap in the chain never empties it.
      - name: Write the baseline
        if: steps.validated.outputs.run-id != ''
        env:
          COVERAGE_DIR: coverage-artifacts
          BASELINE_PATH: coverage-baseline/baseline.json
          BASELINE_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/pr_report.py summarize \
            || echo "No coverage on that run; the previous baseline stands."

      - name: Upload the baseline
        if: hashFiles('coverage-baseline/baseline.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: coverage-baseline/baseline.json
          retention-days: 90
          if-no-files-found: error
