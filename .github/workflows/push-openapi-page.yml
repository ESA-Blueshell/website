name: Run Services and Deploy Docs
on:
  push:
    branches: [ "main" ]

jobs:
  run-and-deploy-docs:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out code
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BLUESHELL_REPO_TOKEN }}
          submodules: recursive
          persist-credentials: true

      # 2. Run script
      - name: Deploy services
        run: |
          chmod +x run.sh
          ./run.sh -f

      # 3. Verify containers are healthy
      - name: Verify container health
        run: |
          TIMEOUT=600
          SLEEP_INTERVAL=10

          CONTAINERS=$(docker compose -f docker-compose.dev.yml ps -q)
          if [ -z "$CONTAINERS" ]; then
            echo "No containers found. Is your compose file up?"
            exit 1
          fi

          for container_id in $CONTAINERS; do
            container_name="$(docker inspect --format='{{.Name}}' "$container_id" | sed 's/^\/\(.*\)/\1/')"
            echo "Checking health of container: $container_name"

            local_timeout=$TIMEOUT
            while [ "$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo 'unhealthy')" != "healthy" ]; do
              echo "Waiting for $container_name to become healthy..."
              sleep $SLEEP_INTERVAL
              local_timeout=$(( local_timeout - SLEEP_INTERVAL ))
              if [ $local_timeout -le 0 ]; then
                echo "Container $container_name failed to become healthy within $TIMEOUT seconds."
                exit 1
              fi
            done
            echo "$container_name is healthy!"
          done

          if test -z "$(docker compose -f docker-compose.dev.yml ps -q | xargs docker inspect -f '{{ .State.Health.Status}}' | grep -v '^healthy$')"; then
            echo "All containers healthy!"
            echo "Waiting 30s for Service Discovery........."
            sleep 30
          else
            echo "Some container(s) reported unhealthy status."
            exit 1
          fi

      # 4. Build the OpenAPI YAML ---------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Generate OpenAPI specs
        run: |
          python3 .github/scripts/fetch_openapi.py
          ls -l openapi/

      # 5. Validate & render the docs via npx ---------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          corepack enable                          # turns on Yarn that ships with Node 20
          yarn set version stable                  # pins a deterministic Yarn release
          yarn add -D swagger-cli @redocly/cli   # writes package.json + yarn.lock
          

      - name: Validate OpenAPI document
        run: |
          # Fails the build if the spec is not valid
          npx --yes swagger-cli validate openapi/combined.yaml

      - name: Build static HTML with Redocly
        run: |
          npx --yes @redocly/cli@latest build-docs openapi/combined.yaml \
            --output openapi/index.html \
            --title "Blueshell API Reference"

      - name: Disable Jekyll processing
        run: echo "" > openapi/.nojekyll

      # 6. Publish to GitHub Pages --------------------------------------------
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.BLUESHELL_PAGES_TOKEN }}
          publish_dir: ./openapi
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          enable_jekyll: false