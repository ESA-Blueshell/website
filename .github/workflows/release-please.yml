name: Release Please

# Maintains a release pull request and computes the next version from the
# Conventional Commits merged since the last release. Merging it tags the
# release, which is what promotes images to :latest in build.yml.

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Anything GITHUB_TOKEN does raises no events, so with it the published
          # release never reaches build.yml and :latest never moves. Falls back
          # only so the workflow still runs if the secret is absent.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
