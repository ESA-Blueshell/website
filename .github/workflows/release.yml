name: Release

# Owns the release path: computes the next version from the Conventional
# Commits merged since the last release, and once that release is cut,
# publishes the release images and announces it on Discord.
#
# The announcement needs a `DISCORD_RELEASE_WEBHOOK` secret holding a channel
# webhook URL. Without it the release still completes and the announcement step
# warns and exits, so a fork or an unconfigured repo is not broken by its absence.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      notes: ${{ steps.release.outputs.body }}
      url: ${{ steps.release.outputs.html_url }}
    steps:
      # An App token, not GITHUB_TOKEN: only the app may write the release
      # branch, and a pull request it opens raises the events that GITHUB_TOKEN
      # cannot, so `validate.yml` runs on the release branch by itself.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    # Called rather than triggered by `release: published`, so version, publish
    # and announce stay one ordered run and the announcement can never name a
    # release whose images are missing.
    name: Publish release images
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
      # build.yml signs the manifest keylessly. A called workflow cannot hold
      # more than its caller grants, and the whole run fails to start if it
      # asks for more, so this has to match what that job declares.
      id-token: write

  tag:
    # The one place a version tag is written, from the digest the overlay
    # pinned, and refused if it already exists.
    name: Write the release tag
    needs: [version, publish]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the version tag at the pinned digests
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: ./scripts/pin-release-images.sh publish "$RELEASE_TAG"

  announce:
    # After `publish`, so the announcement never points at a release whose images
    # are missing. Skipped along with it if publishing fails.
    name: Announce the release on Discord
    needs: [version, publish, tag]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post the release notes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
          RELEASE_URL: ${{ needs.version.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK is unset; skipping the announcement."
            exit 0
          fi
          python3 .github/scripts/discord_release_announce.py
