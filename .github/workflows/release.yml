name: Release

# Owns the release path: computes the next version from the Conventional
# Commits merged since the last release, and once that release is cut,
# publishes the release images and announces it on Discord.
#
# The announcement needs a `DISCORD_RELEASE_WEBHOOK` secret holding a channel
# webhook URL. Without it the release still completes and the announcement step
# warns and exits, so a fork or an unconfigured repo is not broken by its absence.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      notes: ${{ steps.release.outputs.body }}
      url: ${{ steps.release.outputs.html_url }}
    steps:
      # An App token, not GITHUB_TOKEN: only the app may write the release
      # branch, and a pull request it opens raises the events that GITHUB_TOKEN
      # cannot, so `validate.yml` runs on the release branch by itself.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    # Called rather than triggered by `release: published`, so version, publish
    # and announce stay one ordered run and the announcement can never name a
    # release whose images are missing. This is also where the version tag is
    # written, by the job holding the digest it names.
    name: Publish release images
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
      # build.yml signs the manifest keylessly. A called workflow cannot hold
      # more than its caller grants, and the whole run fails to start if it
      # asks for more, so this has to match what that job declares.
      id-token: write

  helper:
    # Cross-compiles the SNTPings helper and attaches the binaries to the release, so the pinger
    # page can offer them for download. Independent of the images; a failure here does not hold up
    # the announcement.
    name: Attach the SNTPings helper binaries
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/pinger/go.mod

      - name: Cross-compile the helper
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: VERSION="${RELEASE_TAG#v}" bash services/pinger/cmd/ping/build.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" services/pinger/dist/* --clobber

  desktop:
    # Builds the desktop pinger app into one unsigned installer per platform and attaches them to the
    # release, so the SNTPings tab can offer a member the installer for their OS. Each installer is
    # built on its own OS runner: Wails packages a GUI app for the host, not across operating systems.
    # The builds are unsigned by design -- notarization and code signing are out of scope, and the
    # download page documents the first-run open steps the lack of a signature needs. Independent of
    # the images and the helper; a failure here does not hold up the announcement.
    name: Build and attach the desktop pinger installers
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin/universal
            asset: Blueshell-Pinger.dmg
          - runner: ubuntu-22.04
            platform: linux/amd64
            asset: Blueshell-Pinger-x86_64
            # Link against the host's WebKitGTK 4.1 (the current one; 4.0 is end-of-life). Built on the
            # oldest base that ships 4.1, so one glibc covers Ubuntu 22.04+, Debian 12+, Fedora, Arch.
            buildflags: "-tags webkit2_41"
          - runner: windows-latest
            platform: windows/amd64
            asset: Blueshell-Pinger.exe
            # Without WebView2 the app shows an error rather than fetching and running Microsoft's
            # bootstrapper. Windows 10 and 11 ship WebView2, and a download-and-execute path is what
            # antivirus machine learning scores as a dropper.
            buildflags: "-webview2 error"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: services/pinger-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/pinger-app/go.mod
          cache-dependency-path: services/pinger-app/go.sum

      # The Linux build links against GTK and WebKitGTK 4.1; the other runners ship their native WebView.
      - name: Install the Linux WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # The Windows version info and manifest read the version from wails.json.
      - name: Stamp the release version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          jq --arg v "${RELEASE_TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      # Default is unsigned: no signing identity or notarization is passed on any platform. The Linux
      # build also takes the webkit2_41 tag so it links the host's WebKitGTK 4.1.
      - name: Build the app
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} ${{ matrix.buildflags }}

      # Ad-hoc sign the whole bundle so Apple Silicon will launch it at all: arm64 refuses to run a
      # binary with no signature. This is not a Developer ID signature, so Gatekeeper still asks the
      # member to confirm the first open; the download page documents that step.
      - name: Ad-hoc sign the macOS app
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "build/bin/Blueshell Pinger.app"

      # The .app bundle takes wails.json's `name` ("Blueshell Pinger"), not `outputfilename`, so the
      # bundle is "Blueshell Pinger.app" even though the binary inside is blueshell-pinger.
      - name: Package the macOS DMG
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Blueshell Pinger" -srcfolder "build/bin/Blueshell Pinger.app" -ov -format UDZO "${{ matrix.asset }}"

      - name: Name the Windows installer
        if: runner.os == 'Windows'
        run: cp build/bin/blueshell-pinger.exe "${{ matrix.asset }}"

      # A plain native binary: it links the host's WebKitGTK 4.1 and GTK, embeds the frontend, and runs
      # on any desktop that ships webkit2gtk-4.1 (the member marks it executable and launches it). No
      # AppImage -- a bundled webkit fought the host's glib and GPU stack and would not render.
      - name: Name the Linux binary
        if: runner.os == 'Linux'
        run: cp build/bin/blueshell-pinger "${{ matrix.asset }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber

  announce:
    # After `publish`, so the announcement never points at a release whose images
    # are missing or untagged. Skipped along with it if publishing fails.
    name: Announce the release on Discord
    needs: [version, publish]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post the release notes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
          RELEASE_URL: ${{ needs.version.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK is unset; skipping the announcement."
            exit 0
          fi
          python3 .github/scripts/discord_release_announce.py
