name: Rotate Credentials

on:
  schedule:
    - cron: '0 23 * * 0'   # Sunday 23:00 UTC = Monday 00:00 AMS (winter) / 01:00 AMS (summer)
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to rotate (website | website-staging | website-dev)'
        required: true
        default: website
      rotation:
        description: 'What to rotate (db | jwt | listmonk | google-calendar | all)'
        required: true
        default: all

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run rotation via rotator image
        run: |
          STACK="${{ github.event.inputs.stack || 'website' }}"
          ROTATION="${{ github.event.inputs.rotation || 'all' }}"
          ssh -o StrictHostKeyChecking=yes -p "${{ secrets.PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
            "bash -lc '
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v /src/website/services/api:/src/website/services/api \
                -v /src/website/services/listmonk:/src/website/services/listmonk \
                -v /src/website/infra:/src/website/infra:ro \
                -v /src/website/services/deploy.sh:/src/website/services/deploy.sh:ro \
                -v /src/website/services/docker-stack.yml:/src/website/services/docker-stack.yml:ro \
                -v /src/website/.server.env:/src/website/.server.env:ro \
                --network ${STACK}_frontback \
                -e INFISICAL_TOKEN=\${INFISICAL_TOKEN:-} \
                -e INFISICAL_PROJECT_ID=\${INFISICAL_PROJECT_ID:-} \
                -e INFISICAL_BASE_URL=https://vault.${{ vars.BASE_DOMAIN || 'v2.esa-blueshell.nl' }} \
                -e LISTMONK_URL=http://listmonk:9000 \
                -e REPO_ROOT=/src/website \
                ghcr.io/esa-blueshell/rotator:latest \
                rotate ${ROTATION} ${STACK}
            '"
