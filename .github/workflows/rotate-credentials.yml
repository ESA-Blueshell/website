name: Rotate Credentials

on:
  schedule:
    - cron: '0 23 * * 0'   # Sunday 23:00 UTC = Monday 00:00 AMS (winter) / 01:00 AMS (summer)
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to rotate (website | website-staging | website-dev)'
        required: true
        default: website
      rotation:
        description: 'What to rotate (db | jwt | listmonk | all)'
        required: true
        default: all

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 20 -p "${{ secrets.PORT }}" -H "${{ secrets.IP_ADDRESS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run rotation scripts on server
        run: |
          STACK="${{ github.event.inputs.stack || 'website' }}"
          ROTATION="${{ github.event.inputs.rotation || 'all' }}"
          ssh -o StrictHostKeyChecking=yes -p "${{ secrets.PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.IP_ADDRESS }}" \
            "cd /src/website && bash scripts/rotate-${ROTATION}.sh ${STACK}"
