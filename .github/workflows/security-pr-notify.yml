name: Security PR notify

# Discord notices for pull requests that fix a known vulnerability: a Renovate
# vulnerability-alert PR (title ends in [SECURITY]), a Dependabot security update
# (it bumps a package with an open or fixed Dependabot alert), or any PR whose
# body cites a CVE or GHSA id. The rules live in .github/scripts/security_pr_notice.sh.
#
# - opened: only for PRs that do not merge themselves (not Renovate's).
# - Validate failed: the PR will not merge itself.
# - closed: its "CI failed" messages are deleted.
# - merged: a release with the fix is available in the pending release PR.
#   release.yml deletes that message once the release is cut.
#
# The release PR never gets a notice: its changelog may cite the ids it ships.
#
# pull_request_target and workflow_run both run the default branch's files, so
# nothing from the PR is checked out or executed; its text reaches the script
# only through the environment.
#
# Posts through the one Discord webhook every notice uses, the `DISCORD_WEBHOOK`
# organisation secret. A run started by Dependabot sees only Dependabot secrets,
# so the secret is set under both the Actions and the Dependabot secrets.

on:
  pull_request_target:
    types: [opened, reopened, closed]
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: read

# One run per branch at a time: each run rewrites the PR's notice record.
concurrency:
  group: security-pr-notify-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  pull-request:
    name: Notify Discord of a security fix
    if: >-
      github.event_name == 'pull_request_target' &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide and post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event.action == 'closed' && 'closed' || 'opened' }}
          MERGED: ${{ github.event.pull_request.merged }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          URL: ${{ github.event.pull_request.html_url }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/security_pr_notice.sh

  ci-failed:
    name: Notify Discord of a failed security fix
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      !startsWith(github.event.workflow_run.head_branch, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide and post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --state open --head "$HEAD_BRANCH" --json number,author,title,body,labels,url --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request for this run."
            exit 0
          fi
          NUMBER=$(jq -r .number <<<"$pr")
          AUTHOR=$(jq -r '.author.login | if . == "app/renovate" or . == "renovate" then "renovate[bot]" elif . == "app/dependabot" or . == "dependabot" then "dependabot[bot]" else . end' <<<"$pr")
          TITLE=$(jq -r .title <<<"$pr")
          BODY=$(jq -r .body <<<"$pr")
          LABELS=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")
          URL=$(jq -r .url <<<"$pr")
          MODE=ci-failed
          export NUMBER AUTHOR TITLE BODY LABELS URL MODE
          bash .github/scripts/security_pr_notice.sh
