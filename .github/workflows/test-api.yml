name: Test API

on:
  push:
    paths:
      - 'api/**'
  pull_request:
    paths:
      - 'api/**'

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:10.11.10
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "blueshell-test"
          MYSQL_DATABASE: "blueshell-test"
          MYSQL_PORT: 3306
          MYSQL_USER: "blueshell-test"
          MYSQL_PASSWORD: "blueshell-test"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: "blueshell-test"
      MYSQL_PASSWORD: "blueshell-test"
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Install Dependencies
        run: |
          mvn install
        working-directory: api

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Run DB init SQL if present
        run: |
          set -e
          SQL=""
          if [ -f env/init.sql ]; then SQL="env/init.sql"; fi
          if [ -n "$SQL" ]; then
            echo "Applying $SQL..."
            mysql -h 127.0.0.1 -uroot -p"${MYSQL_PASSWORD}" < "$SQL"
          else
            echo "No env/init.sql or env/dump.sql found. Skipping seed."
          fi

      # ---- Build & test the API (host build) ----
      - name: Maven - clean verify (run all tests)
        run: mvn -B -DskipTests=false clean verify
        working-directory: api