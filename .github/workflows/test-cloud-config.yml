name: Test cloud-config

on:
  push:
    paths:
      - 'vps/**'
      - '.github/workflows/test-cloud-config.yml'
  workflow_dispatch:
    inputs:
      full_test:
        description: >
          Boot a Debian VM via LXD and test the full cloud-init provisioning (~10 min).
          Runs in addition to the hash check.
        type: boolean
        default: false

concurrency:
  group: cloud-config-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# ── Job 1: verify password hashes ────────────────────────────────────────────
# Fast (~1 min). Renders the cloud-config, then verifies SHA-512 hashes
# match the plaintext passwords using pytest.
jobs:
  hash-check:
    name: Verify password hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD:        ${{ secrets.TEST_ADMIN_PASSWORD   || 'CItest-Admin-1234!'   }}
      ROOT_PASSWORD:         ${{ secrets.TEST_ROOT_PASSWORD    || 'CItest-Root-1234!'    }}
      WEBSITE_PASSWORD:      ${{ secrets.TEST_WEBSITE_PASSWORD || 'CItest-Website-1234!' }}
      GHCR_USERNAME:         ${{ github.actor }}
      GHCR_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
      # Dummy account name so test_infra_env_contains_transip_credentials can verify
      # that the value flows through to .infra.env. No real key needed for hash checks.
      TRANSIP_ACCOUNT_NAME:  ci-dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: cd vps && uv sync

      - name: Verify password hashes
        run: cd vps && uv run pytest tests/test_hash_verification.py -v

# ── Job 2: schema validation ──────────────────────────────────────────────────
# Fast (~1 min). Renders the cloud-config and validates it against the
# cloud-init JSON schema using the system cloud-init binary.
  schema-check:
    name: Validate cloud-config schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD:        ${{ secrets.TEST_ADMIN_PASSWORD   || 'CItest-Admin-1234!'   }}
      ROOT_PASSWORD:         ${{ secrets.TEST_ROOT_PASSWORD    || 'CItest-Root-1234!'    }}
      WEBSITE_PASSWORD:      ${{ secrets.TEST_WEBSITE_PASSWORD || 'CItest-Website-1234!' }}
      GHCR_USERNAME:         ${{ github.actor }}
      GHCR_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
      TRANSIP_ACCOUNT_NAME:  ci-dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: cd vps && uv sync

      - name: Validate cloud-config schema
        run: cd vps && uv run pytest tests/test_schema.py -v

# ── Job 3: deploy key smoke test ─────────────────────────────────────────────
# Fast (~30s). Verifies SSH_DEPLOY_KEY is valid and can authenticate to GitHub
# over SSH. Catches key format issues or expired/revoked keys before the slow
# VM test spends 10+ minutes only to fail on a git clone.
  deploy-key-check:
    name: Verify deploy key can authenticate to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Install deploy key
        env:
          DEPLOY_KEY_PRIVATE: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${DEPLOY_KEY_PRIVATE}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the key is parseable and extract the public key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          echo "Public key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key.pub

      - name: Test SSH authentication to GitHub
        run: |
          # Add GitHub's host keys so StrictHostKeyChecking doesn't block us
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          # ssh -T exits with code 1 on success ("Hi <user>! You've authenticated...")
          # and code 255 on auth failure — check the message instead
          output=$(ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            git@github.com 2>&1 || true)
          echo "${output}"
          if echo "${output}" | grep -q "successfully authenticated\|Hi "; then
            echo "Deploy key authentication: OK"
          else
            echo "Deploy key authentication: FAILED"
            exit 1
          fi

      - name: Clone repository using deploy key
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            git clone --depth=1 git@github.com:ESA-Blueshell/website.git /tmp/website-clone
          echo "Clone successful. HEAD: $(git -C /tmp/website-clone rev-parse HEAD)"

# ── Job 4: full VM test ───────────────────────────────────────────────────────
# Boots a Debian 13 VM via LXD with the rendered cloud-config, waits for
# cloud-init to finish, then tests SSH, security, and provisioning.
  vm-test:
    name: Full VM test (LXD)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [hash-check, schema-check, deploy-key-check]
#    if: github.event_name == 'workflow_dispatch' && inputs.full_test
    env:
      ADMIN_PASSWORD:   ${{ secrets.TEST_ADMIN_PASSWORD   || 'CItest-Admin-1234!'   }}
      ROOT_PASSWORD:    ${{ secrets.TEST_ROOT_PASSWORD    || 'CItest-Root-1234!'    }}
      WEBSITE_PASSWORD: ${{ secrets.TEST_WEBSITE_PASSWORD || 'CItest-Website-1234!' }}
      GHCR_USERNAME:    ${{ github.actor }}
      GHCR_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
      GIT_BRANCH:       ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up LXD
        run: |
          sudo snap install lxd --channel=latest/stable
          sudo lxd init --auto
          sudo usermod -aG lxd $USER

      - name: Set up apt proxy for LXD containers
        run: |
          # The GitHub Actions runner blocks outbound traffic from the LXD bridge,
          # but the runner host itself has full internet access.
          # apt-cacher-ng listens on the bridge gateway IP so the container can
          # proxy all apt/HTTP/HTTPS traffic through the host.
          sudo apt-get install -y -q apt-cacher-ng
          # Allow HTTPS CONNECT pass-through (used by apt for https:// sources
          # and by curl when https_proxy is set)
          echo 'PassThroughPattern: .*' | sudo tee -a /etc/apt-cacher-ng/acng.conf
          sudo systemctl restart apt-cacher-ng
          # Export the bridge gateway IP so the test helper can merge proxy
          # setup into the instance cloud-init bootcmd before first start.
          BRIDGE_IP=$(ip -4 addr show lxdbr0 | awk '/inet /{print $2}' | cut -d/ -f1)
          echo "LXD_APT_PROXY=http://${BRIDGE_IP}:3142" >> "$GITHUB_ENV"
          # Optional: if the runner provides a host-backed LXD network, export
          # it as LXD_NETWORK and the test helper will attach eth0 to it before
          # first start instead of relying on the default profile network.
          # echo "LXD_NETWORK=<network-name>" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: |
          cd vps && uv sync
          sudo apt-get update -q
          sudo apt-get install -y -q sshpass

      - name: Install GitHub deploy key
        env:
          DEPLOY_KEY_PRIVATE: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY_PRIVATE}" \
            > ~/.ssh/blueshell-website-github-deploy-key
          chmod 600 ~/.ssh/blueshell-website-github-deploy-key
          ssh-keygen -y -f ~/.ssh/blueshell-website-github-deploy-key \
            > ~/.ssh/blueshell-website-github-deploy-key.pub

      - name: Run full container test
        run: cd vps && sg lxd -c 'uv run pytest tests/test_cloud_init.py -v -s --timeout=1800'

      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs
          path: vps/vm-logs/
          if-no-files-found: ignore
