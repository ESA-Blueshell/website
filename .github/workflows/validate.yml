name: Validate

# Runs on every push to a non-main branch. Main itself only triggers
# deploy.yml (image build + push). pull_request isn't a trigger here
# because every PR commit is also a push, so listening to both produces
# duplicate runs.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'services/api/**'
      - 'services/frontend/**'
      - 'services/system-tests/**'
      - 'build-logic/**'
      - 'libs/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.lockfile'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'platform/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'services/*/docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  JAVA_VERSION: '21'
  # Node 22 (not 24) — yarn 4.10 + playwright hit an EBADF fstat
  # regression in Node 24's ESM loader during install steps. Dev image
  # pinned to node:22-bookworm-slim for the same reason.
  NODE_VERSION: '22'
  YARN_VERSION: '4.10.3'

  MYSQL_ROOT_PASSWORD: blueshell
  MYSQL_DATABASE: blueshell-test
  MYSQL_PORT: '3306'
  MYSQL_USER: blueshell
  MYSQL_PASSWORD: ci-blueshell
  MYSQL_HOST: 127.0.0.1

  APP_URL: http://127.0.0.1:8080
  FRONTEND_URL: http://127.0.0.1:3000

  JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh

  STORAGE_LOCATION: ./storage

  BREVO_API_KEY: something
  BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

  GRADLE_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m

permissions:
  contents: read

jobs:
  nix-flake-check:
    name: NixOS flake check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix with flake support
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache /nix/store for faster re-runs
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Validate platform flake
        run: |
          nix flake check ./platform --no-build --show-trace

  flux-kustomize-check:
    name: Flux kustomize build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl + kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Render every flux overlay to catch schema / ordering bugs
        run: |
          set -euo pipefail
          for overlay in \
            platform/cluster/flux/clusters/production \
            platform/cluster/flux/apps/core \
            platform/cluster/flux/apps/edge \
            platform/cluster/flux/apps/utility-system
          do
            echo "::group::kustomize build $overlay"
            kubectl kustomize "$overlay" > /dev/null
            echo "::endgroup::"
          done

  fe-static:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

  api-static:
    name: API compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compile sources and warm Gradle cache for downstream jobs
        # resolveAllDependencies (in kotlin-conventions) eagerly fetches every
        # resolvable config so downstream Test tasks don't race Maven Central.
        run: |
          ./gradlew --no-daemon --build-cache \
            :services:api:compileKotlin \
            :services:api:compileTestFixturesKotlin \
            :services:api:compileTestKotlin \
            :services:api:compileIntegrationTestKotlin \
            :services:system-tests:compileTestKotlin \
            :services:api:resolveAllDependencies \
            :services:system-tests:resolveAllDependencies

  api-tests:
    name: API unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ api-static, fe-static ]

    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < services/api/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run API unit and integration tests
        run: |
          ./gradlew --no-daemon --build-cache \
            :services:api:test \
            :services:api:integrationTest \
            :services:api:jacocoTestReport \
            :services:api:jacocoIntegrationTestReport

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            services/api/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            services/api/build/reports/jacoco/jacocoTestReport/html
            services/api/build/reports/jacoco/jacocoIntegrationTestReport/jacocoIntegrationTestReport.xml
            services/api/build/reports/jacoco/jacocoIntegrationTestReport/html
            services/api/build/reports/tests/test
            services/api/build/reports/tests/integrationTest
          if-no-files-found: warn

  build-images:
    # Build the production Docker images for api + frontend and export
    # them as tar artifacts. Consumed by the system-tests job once it
    # migrates onto the docker-compose stack (mirrors personal-stack-2).
    # For now the artifacts are unused — the job exists so we can
    # validate the build path + warm the gha layer cache.
    name: Build Image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ api-static, fe-static ]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: services/api/Dockerfile
            build-args: ""
          - name: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile
            # Bake the api URL into the SPA bundle so the system-test
            # stack can drive XHRs straight at the api container on
            # :8080 instead of falling back to `${origin}/api` (which
            # would need an nginx reverse-proxy the prod image doesn't
            # ship).
            build-args: "VITE_APP_URL=http://localhost:8080"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        env:
          BUILD_ARGS: ${{ matrix.service.build-args }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ -n "$BUILD_ARGS" ]]; then
            for arg in $BUILD_ARGS; do
              extra_args+=(--build-arg "$arg")
            done
          fi
          docker buildx build \
            --progress=plain \
            --load \
            -f "${{ matrix.service.dockerfile }}" \
            -t "blueshell-website/${{ matrix.service.name }}:ci" \
            --cache-from "type=gha,scope=${{ matrix.service.name }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.service.name }}" \
            "${extra_args[@]}" \
            "${{ matrix.service.context }}"

      - name: Export image to tar
        run: docker save "blueshell-website/${{ matrix.service.name }}:ci" -o "/tmp/${{ matrix.service.name }}.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service.name }}
          path: /tmp/${{ matrix.service.name }}.tar
          retention-days: 1

  system-tests:
    # Shard the system-test class set across N parallel matrix jobs so
    # the wall-clock cost scales sub-linearly with new classes. The Gradle
    # config in services/system-tests/build.gradle.kts reads SHARD_TOTAL
    # and SHARD_INDEX (1-based) from the env, hashes each test class FQCN,
    # and includes only its own slice via JUnit's --tests filter. Stable
    # partition: a class always lands on the same shard, which makes
    # failure triage easy.
    name: System tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ api-static, fe-static, build-images ]
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Load CI-built images
        uses: ./.github/actions/prepare-ci-host

      - name: Start docker compose stack
        run: bash .github/scripts/start-system-test-stack.sh

      - name: Run system tests
        env:
          SHARD_TOTAL: 6
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          ./gradlew --no-daemon :services:system-tests:test \
            -Dsystem.frontend.url=http://localhost:3000 \
            -Dtest.frontend.url=http://localhost:3000 \
            -Dtest.api.url=http://localhost:8080 \
            -Dtest.db.url="jdbc:mariadb://localhost:3307/blueshell" \
            -Dtest.db.user="$MYSQL_USER" \
            -Dtest.db.password=ci-blueshell

      - name: Dump compose diagnostics
        if: failure()
        run: bash .github/scripts/dump-compose-ci-diagnostics.sh

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans || true

      - name: Upload system-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-shard artifact name so parallel jobs don't collide.
          name: system-test-reports-shard-${{ matrix.shard }}
          path: |
            services/system-tests/build/reports/tests/test
          if-no-files-found: warn

  fe-unit:
    name: Frontend unit tests with coverage
    needs: fe-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Run frontend unit tests with coverage
        run: yarn test:unit:coverage

      - name: Upload frontend unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            services/frontend/coverage/unit/coverage-final.json
            services/frontend/coverage/unit/coverage-summary.json
            services/frontend/coverage/unit/lcov.info
            services/frontend/coverage/unit/lcov-report
            services/frontend/coverage/unit/index.html
          if-no-files-found: error

  fe-e2e:
    name: Frontend end-to-end tests
    needs: fe-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Install Playwright browser dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: yarn test:e2e

      - name: Upload frontend e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-coverage
          path: |
            services/frontend/coverage/e2e/coverage-final.json
            services/frontend/coverage/e2e/coverage-summary.json
            services/frontend/coverage/e2e/lcov.info
            services/frontend/coverage/e2e/html
          if-no-files-found: error

  openapi-sync:
    name: Validate OpenAPI client generation
    needs: [ api-static, fe-static ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: mariadb:10.11.10
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for database service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Database is ready!"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time."
          exit 1

      - name: Prepare test database schema
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" < services/api/0_init.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE $MYSQL_DATABASE; SHOW TABLES;"

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}

      - name: Generate Blueshell OpenAPI spec and frontend client
        run: |
          chmod +x ./scripts/generate-openapi-local.sh
          # External specs (Discord, Brevo) drift too frequently upstream
          # to gate every PR on. The scheduled workflow
          # `openapi-external-specs.yml` validates them on a weekly
          # cadence on main and surfaces drift for a human-driven
          # update PR.
          ./scripts/generate-openapi-local.sh --blueshell-only

      - name: Assert Blueshell spec and client are in sync
        run: |
          git diff --exit-code -- \
            services/api/openapi.json \
            services/frontend/src/services/api/blueshell \
            services/frontend/src/services/api/blueshell.runtime.ts \
            services/frontend/src/services/api/index.ts

      - name: Upload OpenAPI generation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-sync-logs
          path: openapi-api.log
          if-no-files-found: ignore
