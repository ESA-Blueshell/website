name: Validate

# Runs the whole suite on every pull request, and on every merge queue entry.
#
# The trigger carries no path filter and the `changes` job does the filtering
# instead, because a filtered trigger produces no check run at all on a pull
# request it does not match — and a check that never reports can never be a
# required one. The filter is the same list, moved from the event to a job.
#
# pull_request rather than push, and the difference is what the filter sees: a
# push filter matches only the files in that push's commits, so a docs-only
# final commit leaves the head with no run — and since check-runs belong to a
# sha while a PR shows only its head's, such a PR reads all-green with no test
# in it (#1032, #1033). A pull_request diff is base to head, so a PR that
# touches code is validated whatever its final commit touches.
#
# synchronize is among the default activity types, so every commit pushed to
# an open PR is validated. A branch with no PR open is not: dispatch a run to
# validate one deliberately.
#
# merge_group is what actually catches a collision between two pull requests
# that are each green on their own base (#1223): the queue builds the combined
# result and runs this suite against it before anything lands.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

# No concurrency group, so a run is never cancelled. Even with
# cancel-in-progress off, a group cancels a queued run once a newer one queues
# behind it, and pr-report then records that cancellation on the default
# branch. A superseded run finishes instead, and pr-report skips a run that is
# no longer its pull request's head, so the newest commit's report stands.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Read by the GitHub Packages repository credentials in settings.gradle.kts.
  # GITHUB_ACTOR is provided by the runner; GITHUB_TOKEN is not on the
  # environment unless it is put there.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  JAVA_VERSION: '25'

  MYSQL_ROOT_PASSWORD: blueshell
  MYSQL_DATABASE: blueshell-test
  MYSQL_PORT: '3306'
  MYSQL_USER: blueshell
  MYSQL_PASSWORD: ci-blueshell
  MYSQL_HOST: 127.0.0.1

  APP_URL: http://127.0.0.1:8080
  FRONTEND_URL: http://127.0.0.1:3000

  JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh

  STORAGE_LOCATION: ./storage

  BREVO_FOLDER_CONTRIBUTION_PERIODS_ID: '1234'

permissions:
  # `packages: read` resolves net.blueshell.clients:{brevo,discord}-client from
  # GitHub Packages, which requires a token even though the packages are public.
  contents: read
  packages: read

jobs:
  changes:
    name: Decide what to validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Every bucket in `.github/buckets.yml`, and `app`, as one JSON object. A
      # job reads one as `fromJSON(needs.changes.outputs.run).<bucket>`.
      run: ${{ steps.decide.outputs.run }}
      system-tests: ${{ steps.decide.outputs.system-tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-diff-buckets.py diffs the base against the head, so the base
          # has to be in the clone.
          fetch-depth: 0

      # `.github/buckets.yml` says which jobs a changed path reaches, and each
      # job below gates on the buckets it belongs to. A path in no bucket runs
      # everything, and this file is in none.
      #
      # The matching is a script rather than a paths-filter step because that
      # action evaluates each pattern on its own, where `!a/**` matches every
      # path outside `a`. One negation made a bucket claim the whole
      # repository (#1453). Here the rules CI runs are the rules --self-test
      # proves.
      - name: Decide which buckets this run validates
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ./scripts/check-diff-buckets.py --self-test

          # A merge queue entry validates whatever it contains: it is the only
          # run that sees two pull requests combined, and it runs once per
          # merge rather than once per push. A dispatched run has no diff.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ./scripts/check-diff-buckets.py --all
            exit 0
          fi

          ./scripts/check-diff-buckets.py --base "$BASE" --head "$HEAD"


      # The pull request number, for the report workflow that runs after this
      # one. `workflow_run.pull_requests` is empty for a fork's pull request,
      # and forks are most of this repository's volume, so it is carried here
      # rather than looked up there.
      - name: Record which pull request this run is for
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-report-meta
          echo "${{ github.event.pull_request.number }}" > pr-report-meta/pr-number

      - name: Upload the pull request number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-report-meta
          path: pr-report-meta/pr-number
          retention-days: 1
          if-no-files-found: error

  nix-flake-check:
    name: NixOS flake check
    needs: changes
    if: fromJSON(needs.changes.outputs.run).platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix with flake support
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache /nix/store for faster re-runs
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Validate platform flake
        run: |
          nix flake check ./platform --no-build --show-trace

  flux-kustomize-check:
    name: Flux manifests
    needs: changes
    if: fromJSON(needs.changes.outputs.run).platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl + kustomize
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.1

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      # Pinned, because this binary decides what the cluster's controllers and
      # RBAC are. The checksum is verified: an unpinned or unverified download
      # here would silently rewrite gotk-components.yaml on the next upgrade.
      - name: Install flux
        run: |
          set -euo pipefail
          FLUX_VERSION=$(./scripts/regenerate-flux-components.sh --print-version)
          base=https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}
          curl -fsSLO "${base}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/flux_${FLUX_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "flux_${FLUX_VERSION}_checksums.txt"
          tar -xzf "flux_${FLUX_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin flux
          rm -f "flux_${FLUX_VERSION}_linux_amd64.tar.gz" "flux_${FLUX_VERSION}_checksums.txt"
          flux --version

      # Before trusting a green validation run, prove each gate can still fail.
      - name: Prove the schema check can fail
        run: ./scripts/check-flux-manifests.sh --self-test

      - name: Prove the generated-file check can fail
        run: ./scripts/regenerate-flux-components.sh --self-test

      # gotk-components.yaml says DO NOT EDIT and cannot enforce it. A
      # formatter rewrote it once, which buried a four-image version bump in
      # 11,000 reindented lines.
      - name: Check the generated Flux components match the pinned CLI
        run: ./scripts/regenerate-flux-components.sh --check

      - name: Build every flux overlay and validate it against real schemas
        run: ./scripts/check-flux-manifests.sh

  workflow-checks:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A caller short of what it calls fails the run at startup, on main,
      # where no pull request is watching.
      - name: Prove the permission check can fail
        run: ./scripts/check-workflow-permissions.py --self-test

      - name: Check every reusable-workflow caller grants what it calls
        run: ./scripts/check-workflow-permissions.py

  imaging:
    # Unit coverage comes from the image's test stage; the container tests count towards none.
    name: Imaging lint, tests and image
    needs: changes
    if: fromJSON(needs.changes.outputs.run).imaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/imaging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/imaging/go.mod
          cache-dependency-path: services/imaging/go.sum

      - name: Install libwebp's headers
        run: sudo apt-get install -y --no-install-recommends libwebp-dev

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: services/imaging

      # Not govulncheck-action: it sets up go.mod's go directive, not the toolchain the image uses.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/imaging/Dockerfile
          config: services/imaging/.hadolint.yaml

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Unit tests, held to every statement, branch, condition and function
        run: |
          docker buildx build --progress=plain --target coverage --output type=local,dest=coverage \
            --cache-from type=gha,scope=imaging-test --cache-to type=gha,mode=max,scope=imaging-test .

      - name: Upload imaging unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imaging-unit-coverage
          path: |
            services/imaging/coverage/coverage.out
            services/imaging/coverage/coverage-totals.json
          if-no-files-found: error

      - name: Build the image
        run: |
          docker buildx build --progress=plain --load -t blueshell-website/imaging:ci \
            --cache-from type=gha,scope=imaging --cache-to type=gha,mode=max,scope=imaging .

      - name: Start the image as the cluster runs it
        run: |
          docker run -d --name imaging --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --cpus 1 -p 8090:8080 blueshell-website/imaging:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8090/healthz && exit 0; sleep 1; done
          docker logs imaging
          exit 1

      - name: Container tests
        run: go test -count=1 -tags integration -v ./integration/
        env:
          IMAGING_URL: http://localhost:8090

      - name: Imaging logs
        if: failure()
        run: docker logs imaging

  fe-static:
    # Also the bundle build: the system tests serve this artifact with
    # `vite preview`, so building it once here spares six shards a build each.
    name: Frontend typecheck, lint and build
    needs: changes
    if: fromJSON(needs.changes.outputs.run).app || fromJSON(needs.changes.outputs.run).imaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Run TypeScript type checks
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint --max-warnings=0

      # The unit suite runs on `frontend` alone, and this pairing reads the api's sources, so an
      # api pull request that registers a job the catalogue does not name went green (#1852).
      - name: Check the job catalogue names every job the api registers
        run: yarn vitest run tests/unit/utils/jobCatalog.test.ts

      - name: Build the production bundle
        # Nothing tells the bundle where the api is: it always calls
        # `${window.location.origin}/api`. Setting VITE_APP_URL here would break
        # every logged-in test.
        run: yarn build

      - name: Upload the bundle for the test jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: services/frontend/dist
          retention-days: 1
          if-no-files-found: error

  api-static:
    # Also the jar build: the system tests run this artifact with `java -jar`,
    # so building it once here spares six shards a build each.
    name: API compile checks and jar
    needs: changes
    if: fromJSON(needs.changes.outputs.run).app || fromJSON(needs.changes.outputs.run).imaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compile sources and warm Gradle cache for downstream jobs
        # resolveAllDependencies (in kotlin-conventions) eagerly fetches every
        # resolvable config so downstream Test tasks don't race Maven Central.
        run: |
          ./gradlew --no-daemon --build-cache \
            :services:api:compileKotlin \
            :services:api:compileTestFixturesKotlin \
            :services:api:compileTestKotlin \
            :services:api:compileIntegrationTestKotlin \
            :tests:system:compileTestKotlin \
            :services:api:resolveAllDependencies \
            :tests:system:resolveAllDependencies \
            :services:api:bootJar

      - name: Upload the jar for the test jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-jar
          # `bootJar` carries the `boot` classifier here; the plain `jar` next
          # to it is the test-fixtures artifact and does not run.
          path: services/api/build/libs/*-boot.jar
          retention-days: 1
          if-no-files-found: error

  changeset-compatibility:
    # Its own check, not a step inside another job: a refusal here is a
    # deliberate decision about a release, and a reviewer should see which
    # check said so.
    name: Schema compatibility
    needs: changes
    if: fromJSON(needs.changes.outputs.run).api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads what this branch adds against its base, so the base
          # has to be in the clone.
          fetch-depth: 0

      - name: Prove the compatibility check can fail
        run: ./scripts/check-changeset-compatibility.py --self-test

      - name: Refuse a changeset the previous release cannot read
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/check-changeset-compatibility.py --base "$BASE" --labels "$LABELS"

  changeset-sql:
    # Renders the statements a changeset will run, for pr-report.yml to post.
    name: Changeset SQL
    needs: changes
    if: fromJSON(needs.changes.outputs.run).api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Render the SQL this branch adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/changeset-sql.sh "${BASE:-HEAD~1}"

      - name: Upload it for the report
        if: hashFiles('changeset-sql/changeset.sql') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changeset-sql
          path: changeset-sql/
          retention-days: 1

  api-lint:
    # ktlint and detekt are source-only: they need the warm Gradle cache
    # api-static leaves behind, but nothing needs them. Off the critical path
    # they cost their own runner rather than 46s in front of every test job.
    name: API formatting and static analysis
    needs: [ changes, api-static ]
    if: fromJSON(needs.changes.outputs.run).api || fromJSON(needs.changes.outputs.run).system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check Kotlin formatting
        # Its own step so a formatting failure reads as one rather than as a
        # broken compile.
        run: ./gradlew --no-daemon --build-cache ktlintCheck

      - name: Run detekt
        # Source-only analysis, so it needs no dependencies and no database.
        # The two source-set tasks are named because the aggregate `detekt`
        # covers main and test alone.
        run: |
          ./gradlew --no-daemon --build-cache \
            detekt \
            detektIntegrationTestSourceSet \
            detektTestFixturesSourceSet

  build-warnings:
    # Its own check so a warning reads as one rather than as a broken compile.
    # No build cache: a task restored from it prints nothing it warned about.
    name: Build has no warnings
    needs: changes
    if: fromJSON(needs.changes.outputs.run).api || fromJSON(needs.changes.outputs.run).system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # --warning-mode=fail refuses a Gradle deprecation, the kotlin.dsl
      # property a warning in a build script, and -PwarningsAsErrors a Kotlin
      # compiler warning in build-logic and in every source set. The Kotlin
      # Gradle plugin logs its own warnings, which no flag turns into a
      # failure, so the log is read for those.
      - name: Build with every warning an error
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --continue --warning-mode=fail \
            -Porg.gradle.kotlin.dsl.allWarningsAsErrors=true \
            -PwarningsAsErrors=true \
            assemble testClasses testFixturesClasses integrationTestClasses 2>&1 | tee gradle.log
          if grep -E '^w: |was loaded multiple times' gradle.log; then
            echo "::error::the build printed the warnings above"
            exit 1
          fi

  api-unit-tests:
    # Unit tests need no database at all, so they no longer queue behind the
    # integration suite in the same job. 1006 tests in about a minute.
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ changes, api-static, fe-static ]
    if: fromJSON(needs.changes.outputs.run).api

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run API unit tests
        run: |
          ./gradlew --no-daemon --build-cache \
            :services:api:test \
            :services:api:jacocoTestReport \
            :services:api:jacocoTestCoverageVerification

      - name: Upload API unit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-unit-test-reports
          path: |
            services/api/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            services/api/build/reports/jacoco/jacocoTestReport/html
            services/api/build/reports/tests/test
          if-no-files-found: warn

  api-integration-tests:
    # The integration suite is 121 classes over about five minutes, run
    # serially in one JVM. Shard it the way :tests:system and the frontend e2e
    # suite are sharded: a stable hash of the class name picks the slice, so a
    # class always lands on the same shard.
    #
    # Each shard gets its own MariaDB service, which is what makes the split
    # safe — the fixtures collide on unique fields, so the suite cannot share
    # one database across parallel writers.
    name: API integration tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ changes, api-static, fe-static ]
    if: fromJSON(needs.changes.outputs.run).api
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6 ]

    services:
      db:
        # Production's version, pinned in platform/cluster/flux/apps/data/mariadb/release.yaml;
        # services/api/docker-compose.yml and scripts/changeset-sql.sh match it.
        image: mariadb:10.11.10@sha256:41d89394db8e777d96058d4cf5cf4daf1ed87f76192154f3d89572676f1e2327
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the imaging service
        uses: ./.github/actions/start-imaging

      - name: Prepare test database schema
        run: |
          # The runner blocks steps until the service reports healthy, and the
          # image ships its own client, so there is nothing to poll and nothing
          # to install. Reaching a package mirror here bought a network
          # dependency whose only effect was to hang the job.
          # Renovate pins the service image to a tag plus a digest, so an
          # exact ancestor filter goes stale on every bump. Match the
          # repository name instead.
          db=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/mariadb/ { print $1; exit }')
          if [ -z "$db" ]; then
            echo "No mariadb service container is running." >&2
            exit 1
          fi
          docker exec -i "$db" mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" < services/api/0_init.sql
          docker exec "$db" mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW DATABASES;"
          docker exec "$db" mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE \`$MYSQL_DATABASE\`; SHOW TABLES;"

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # The floors are not run here: a shard's .exec covers only its own slice,
      # so no floor holds against one alone. api-coverage merges the six and
      # measures the whole picture.
      - name: Run API integration tests
        env:
          SHARD_TOTAL: 6
          SHARD_INDEX: ${{ matrix.shard }}
        run: ./gradlew --no-daemon --build-cache :services:api:integrationTest

      - name: Upload this shard's coverage execution data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-integration-exec-${{ matrix.shard }}
          path: services/api/build/jacoco/integrationTest.exec
          retention-days: 1
          if-no-files-found: error

      - name: Upload API integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-integration-test-reports-shard-${{ matrix.shard }}
          path: services/api/build/reports/tests/integrationTest
          if-no-files-found: warn

  api-coverage:
    # Fan-in for the sharded integration suite. `-PjacocoExecDir` points the
    # report and the floors at every shard's execution data instead of the one
    # local file, and lifts the dependency that would otherwise re-run the
    # suite here. The floors stay exactly as strict as they were unsharded.
    name: API integration coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-integration-tests
    if: always() && needs.api-integration-tests.result != 'skipped'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download every shard's coverage execution data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: services/api/build/jacoco/shards
          pattern: api-integration-exec-*

      - name: Report on the merged coverage and hold it to its floors
        run: |
          ./gradlew --no-daemon --build-cache \
            -PjacocoExecDir=services/api/build/jacoco/shards \
            :services:api:jacocoIntegrationTestReport \
            :services:api:jacocoIntegrationTestCoverageVerification

      - name: Upload API integration coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-integration-coverage
          path: |
            services/api/build/reports/jacoco/jacocoIntegrationTestReport/jacocoIntegrationTestReport.xml
            services/api/build/reports/jacoco/jacocoIntegrationTestReport/html
          if-no-files-found: error

  build-images:
    # Builds the production images so a broken image build is caught on the pull
    # request rather than on main. Nothing downstream waits for it: the tests
    # run against the jar and the bundle, so this job's wall clock no longer
    # sits in front of them.
    #
    # It runs only when the diff can affect an image. A change to application
    # code cannot break a build that a compile and a bundle pass — and main
    # builds both images on every push, so anything that slips through is
    # caught there rather than shipped.
    name: Build Image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ changes, api-static, fe-static ]
    if: fromJSON(needs.changes.outputs.run).app
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
          - name: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile
          - name: stalwart-tools
            context: .
            dockerfile: infra/stalwart/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the api jar
        if: matrix.service.name == 'api'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: api-jar
          path: /tmp/api-jar

      - name: Set up Java + Gradle
        if: matrix.service.name == 'api'
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Find the api jar
        if: matrix.service.name == 'api'
        id: jar
        run: echo "path=$(find /tmp/api-jar -name '*-boot.jar' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build the api image and boot it from its AOT cache
        if: matrix.service.name == 'api'
        uses: ./.github/actions/build-api-image
        with:
          image: blueshell-website/api:ci
          jar: ${{ steps.jar.outputs.path }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        if: matrix.service.name != 'api'

      - name: Build ${{ matrix.service.name }} image
        if: matrix.service.name != 'api'
        run: |
          set -euo pipefail
          docker buildx build \
            --progress=plain \
            --load \
            -f "${{ matrix.service.dockerfile }}" \
            -t "blueshell-website/${{ matrix.service.name }}:ci" \
            --cache-from "type=gha,scope=${{ matrix.service.name }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.service.name }}" \
            "${{ matrix.service.context }}"

      # The system tests serve the bundle with vite preview, so only the image runs the SSI.
      - name: Check link previews
        if: matrix.service.name == 'frontend'
        run: services/frontend/tests/nginx/link-preview.sh blueshell-website/frontend:ci

  system-tests:
    # Each shard runs its own slice of the test classes, picked by a stable
    # hash of the class name, so a class always lands on the same shard. See
    # `shardByTestClass()` in build-logic/src/main/kotlin/TestSharding.kt.
    # An imaging-only change runs just the `imaging`-tagged tests on one shard.
    name: System tests (shard ${{ matrix.shard }}/${{ fromJSON(needs.changes.outputs.system-tests).total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ changes, api-static, fe-static ]
    if: fromJSON(needs.changes.outputs.run).app || fromJSON(needs.changes.outputs.run).imaging
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.system-tests).shards }}

    # MariaDB and Valkey are the only containers left in the loop, and both are
    # pulled rather than built. The api and the frontend run on the runner
    # itself, so the tests start as soon as the jar and the bundle are
    # downloaded instead of after two image builds.
    services:
      db:
        # Production's version, pinned in platform/cluster/flux/apps/data/mariadb/release.yaml;
        # services/api/docker-compose.yml and scripts/changeset-sql.sh match it.
        image: mariadb:10.11.10@sha256:41d89394db8e777d96058d4cf5cf4daf1ed87f76192154f3d89572676f1e2327
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ci-blueshell-root
          MYSQL_DATABASE: blueshell
          MYSQL_USER: blueshell
          MYSQL_PASSWORD: ci-blueshell
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      valkey:
        image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}


      - name: Start the api and the frontend on the runner
        uses: ./.github/actions/start-native-stack

      - name: Run system tests
        env:
          SHARD_TOTAL: ${{ fromJSON(needs.changes.outputs.system-tests).total }}
          SHARD_INDEX: ${{ matrix.shard }}
          SYSTEM_TAGS: ${{ fromJSON(needs.changes.outputs.system-tests).tags }}
        run: |
          ./gradlew --no-daemon :tests:system:test -PsystemTags="$SYSTEM_TAGS" \
            -Dsystem.frontend.url=http://localhost:3000 \
            -Dtest.frontend.url=http://localhost:3000 \
            -Dtest.api.url=http://localhost:8080 \
            -Dtest.db.url="jdbc:mariadb://127.0.0.1:3306/blueshell" \
            -Dtest.db.user=blueshell \
            -Dtest.db.password=ci-blueshell

      - name: Dump stack logs
        if: failure()
        run: |
          for log in /tmp/native-logs/*.log; do
            echo "::group::$log"
            tail -200 "$log"
            echo "::endgroup::"
          done

      - name: Upload system-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Per-shard artifact name so parallel jobs don't collide.
          name: system-test-reports-shard-${{ matrix.shard }}
          path: |
            tests/system/build/reports/tests/test
          if-no-files-found: warn

  acceptance-features:
    # Cucumber acceptance features: business-readable specifications for the
    # account and membership flows, driven against the running stack over HTTP.
    # No browser, so this is a single fast job rather than a sharded matrix.
    #
    # Scenarios for behaviour that is specified but not yet built are tagged
    # `@pending` and skipped by the default filter, so this step stays green
    # while the specification runs ahead of the implementation. Run
    # `-PcucumberTags="@pending"` locally to list what is still outstanding.
    name: Acceptance features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ changes, api-static, fe-static ]
    if: fromJSON(needs.changes.outputs.run).app

    # MariaDB and Valkey are the only containers left in the loop, and both are
    # pulled rather than built. The api and the frontend run on the runner
    # itself, so the tests start as soon as the jar and the bundle are
    # downloaded instead of after two image builds.
    services:
      db:
        # Production's version, pinned in platform/cluster/flux/apps/data/mariadb/release.yaml;
        # services/api/docker-compose.yml and scripts/changeset-sql.sh match it.
        image: mariadb:10.11.10@sha256:41d89394db8e777d96058d4cf5cf4daf1ed87f76192154f3d89572676f1e2327
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: ci-blueshell-root
          MYSQL_DATABASE: blueshell
          MYSQL_USER: blueshell
          MYSQL_PASSWORD: ci-blueshell
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      valkey:
        image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}


      - name: Start the api and the frontend on the runner
        uses: ./.github/actions/start-native-stack

      - name: Run acceptance features
        run: |
          ./gradlew --no-daemon :tests:system:acceptanceTest \
            -Dtest.frontend.url=http://localhost:3000 \
            -Dtest.api.url=http://localhost:8080 \
            -Dtest.db.url="jdbc:mariadb://127.0.0.1:3306/blueshell" \
            -Dtest.db.user=blueshell \
            -Dtest.db.password=ci-blueshell

      - name: Dump stack logs
        if: failure()
        run: |
          for log in /tmp/native-logs/*.log; do
            echo "::group::$log"
            tail -200 "$log"
            echo "::endgroup::"
          done

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-feature-report
          path: |
            tests/system/build/reports/cucumber
            tests/system/build/test-results/acceptanceTest
          if-no-files-found: warn

  fe-unit:
    name: Frontend unit tests with coverage
    needs: [ changes, fe-static ]
    if: fromJSON(needs.changes.outputs.run).frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Run frontend unit tests with coverage
        run: yarn test:unit:coverage

      - name: Upload frontend unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-coverage
          path: |
            services/frontend/coverage/unit/coverage-final.json
            services/frontend/coverage/unit/coverage-summary.json
            services/frontend/coverage/unit/lcov.info
            services/frontend/coverage/unit/lcov-report
            services/frontend/coverage/unit/index.html
          if-no-files-found: error

  patch-coverage:
    # Blocking, at 100%: a changed line the unit suites measure has to run.
    # Only measured lines count, so docs, config and any file outside an
    # `include` are not in the denominator.
    name: Changed lines are covered
    # Gated on the buckets that hold measured sources: api, frontend and imaging.
    # Every unit suite skipping on such a run fails below and says so.
    if: |
      always() && github.event_name == 'pull_request'
      && (fromJSON(needs.changes.outputs.run).api || fromJSON(needs.changes.outputs.run).frontend
          || fromJSON(needs.changes.outputs.run).imaging)
    needs: [ changes, api-unit-tests, fe-unit, imaging ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The api, frontend or imaging bucket is on, so the unit suite it gates had
      # to run. All skipped means a gate in this file drifted from the buckets,
      # which is the one thing selectivity could quietly break.
      #
      # Neither succeeding for any other reason is not that: a failed suite
      # uploads nothing and reports itself, and a cancelled one was stopped by
      # hand. There is no coverage to read either way, so this stops
      # rather than failing a second time for the first job's reason.
      - name: Refuse a measured change no suite measured
        id: measurable
        env:
          API: ${{ needs.api-unit-tests.result }}
          FRONTEND: ${{ needs.fe-unit.result }}
          IMAGING: ${{ needs.imaging.result }}
        run: |
          set -euo pipefail
          if [ "$API" = "success" ] || [ "$FRONTEND" = "success" ] || [ "$IMAGING" = "success" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=false" >> "$GITHUB_OUTPUT"
          if [ "$API" = "skipped" ] && [ "$FRONTEND" = "skipped" ] && [ "$IMAGING" = "skipped" ]; then
            echo "::error::a measured bucket is on but no unit suite ran; a gate in validate.yml does not follow the buckets"
            exit 1
          fi
          echo "no unit suite reported ($API, $FRONTEND, $IMAGING); the jobs that own them say why"

      # One step per suite, each into its own directory: a pattern matching a
      # single artifact extracts it into `path` itself, where the gate never
      # looks. A suite that failed uploads nothing, and its own job reports that.
      - name: Download the api unit coverage
        if: steps.measurable.outputs.ran == 'true' && needs.api-unit-tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: api-unit-test-reports
          path: coverage-artifacts/api-unit-test-reports

      - name: Download the frontend unit coverage
        if: steps.measurable.outputs.ran == 'true' && needs.fe-unit.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-coverage
          path: coverage-artifacts/frontend-unit-coverage

      - name: Download the imaging unit coverage
        if: steps.measurable.outputs.ran == 'true' && needs.imaging.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: imaging-unit-coverage
          path: coverage-artifacts/imaging-unit-coverage

      - name: Refuse an uncovered changed line
        if: steps.measurable.outputs.ran == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_DIR: coverage-artifacts
        run: python3 .github/scripts/pr_report.py gate

  fe-e2e-version:
    # The container below has to carry the browsers the locked @playwright/test
    # expects, so its tag is read from yarn.lock and follows a Renovate bump.
    name: Frontend e2e Playwright version
    needs: changes
    if: fromJSON(needs.changes.outputs.run).frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the locked @playwright/test version
        id: read
        run: |
          set -euo pipefail
          version=$(awk '/^"@playwright\/test@npm:/ { found = 1; next } found && /^  version:/ { print $2; exit }' services/frontend/yarn.lock)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no @playwright/test version in services/frontend/yarn.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  fe-e2e:
    # The official image holds Chromium and every system package it needs.
    # `playwright install --with-deps` ran apt on each job instead, and a slow
    # Ubuntu mirror held a job there for ten minutes.
    #
    # One job per project, `chromium` in `--shard` slices of about a hundred
    # tests. `--shard` partitions by spec file, so a spec always lands on the
    # same slice and a failure is easy to place. `motion` and `smoke` are too
    # small to pay for a job each.
    name: Frontend e2e (${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: [ changes, fe-static, fe-e2e-version ]
    if: fromJSON(needs.changes.outputs.run).frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.fe-e2e-version.outputs.version }}-noble
      options: --ipc=host
    env:
      # Playwright's setting for container jobs: the runner's /github/home is
      # not owned by the image's root user, and Firefox refuses such a HOME.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium, projects: chromium, shard: 1, total: 5 }
          - { name: chromium, projects: chromium, shard: 2, total: 5 }
          - { name: chromium, projects: chromium, shard: 3, total: 5 }
          - { name: chromium, projects: chromium, shard: 4, total: 5 }
          - { name: chromium, projects: chromium, shard: 5, total: 5 }
          - { name: mobile-chrome, projects: mobile-chrome, shard: 1, total: 1 }
          - { name: motion+smoke, projects: motion smoke, shard: 1, total: 1 }
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Run frontend end-to-end tests
        env:
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          # Unique per job, so the merge job's download cannot overwrite one.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.name }}-${{ matrix.shard }}.zip
        run: |
          set -euo pipefail
          args=()
          for project in $PROJECTS; do args+=("--project=$project"); done
          yarn test:e2e "${args[@]}" --shard="$SHARD"

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-e2e-blob-${{ matrix.name }}-${{ matrix.shard }}
          path: services/frontend/blob-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload frontend e2e traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Per-job artifact name so parallel jobs don't collide.
          name: frontend-e2e-traces-${{ matrix.name }}-${{ matrix.shard }}
          path: services/frontend/test-results
          if-no-files-found: ignore

  fe-e2e-report:
    # One HTML report from every e2e job, to read a failure in. Validate
    # complete does not wait on it: the e2e jobs carry the verdict.
    name: Frontend e2e report
    needs: fe-e2e
    if: ${{ !cancelled() && needs.fe-e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Download the blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: services/frontend/all-blob-reports
          pattern: frontend-e2e-blob-*
          merge-multiple: true

      - name: Merge them into one HTML report
        run: yarn playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-e2e-report
          path: services/frontend/playwright-report
          retention-days: 7

  openapi-sync:
    name: Validate OpenAPI client generation
    needs: [ changes, api-static, fe-static ]
    # One generate-and-diff, and the check that catches an API surface change
    # nobody noticed, so it runs on either side.
    if: fromJSON(needs.changes.outputs.run).api || fromJSON(needs.changes.outputs.run).frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Generate Blueshell OpenAPI spec and frontend client
        run: |
          # Only the Blueshell spec is generated here. Brevo and Discord are published client
          # packages, each re-derived from upstream nightly in its own repository.
          ./gradlew --no-daemon --build-cache :services:api:dumpOpenApiSpec
          yarn --cwd services/frontend gen:blueshell
          # The client is committed as eslint --fix leaves it; what it cannot fix is not this job's.
          yarn --cwd services/frontend lint:gen || true

      - name: Assert Blueshell spec and client are in sync
        run: |
          git diff --exit-code -- \
            services/api/openapi.yaml \
            services/frontend/src/services/api/blueshell \
            services/frontend/src/services/api/blueshell.runtime.ts \
            services/frontend/src/services/api/index.ts

      - name: Upload OpenAPI generation logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-sync-logs
          path: |
            services/api/build/openapi.raw.yaml
            services/api/build/*.log
          if-no-files-found: ignore

  # The one check the ruleset requires (#1223).
  #
  # It reports on every pull request, including one this workflow's filter
  # skipped entirely, which is the whole point: a required check that does not
  # report leaves the pull request waiting for a verdict that never comes.
  # Requiring the individual jobs instead would do exactly that on a docs-only
  # change.
  #
  # `always()` because a job that failed leaves its dependents skipped, and a
  # gate that only ran on success would be skipped along with them — and a
  # skipped required check reads as pending, not as a refusal.
  validate-complete:
    name: Validate complete
    if: always()
    needs:
      - changes
      - nix-flake-check
      - flux-kustomize-check
      - workflow-checks
      - imaging
      - changeset-compatibility
      - changeset-sql
      - fe-static
      - api-static
      - api-lint
      - build-warnings
      - api-unit-tests
      - api-integration-tests
      - api-coverage
      - build-images
      - system-tests
      - acceptance-features
      - fe-unit
      - patch-coverage
      - fe-e2e-version
      - fe-e2e
      - openapi-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse anything that neither passed nor skipped
        env:
          # A job skipped because the filter said so is a pass. A job skipped
          # because something it needed failed is one too — that failure is
          # reported by the job that owns it, which this loop already catches.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(printf '%s' "$RESULTS" |
            jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::the suite did not pass: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "Every job passed or was skipped."
