spring:
  application:
    db: blueshell-test

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    org.springframework.security: debug
    org.springframework.expression: debug
    org.springframework.web: debug
    org:
      hibernate:
        orm:
          jdbc:
            bind: TRACE