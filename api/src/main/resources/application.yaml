spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  main:
    web-application-type: servlet

  application:
    name: BlueshellAPI
    db: blueshell

  datasource:
    host: ${MYSQL_HOST}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${spring.datasource.host}:${MYSQL_PORT}/${spring.application.db}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: "SELECT 1"
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      hibernate.enable_lazy_load_no_trans: true
      hibernate.transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
      hibernate.connection.characterEncoding: utf8mb4
      hibernate.connection.useUnicode: true
      hibernate.connection.useSSL: false
      hibernate.connection.serverTimezone: Europe/Amsterdam
      hibernate.connection.allowPublicKeyRetrieval: true
      hibernate.connection.collation: utf8mb4_unicode_ci
      hibernate.default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  mvc:
    dispatch-options-request: true
    problemdetails.enabled: true


  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    url: /api/v3/api-docs
  default-produces-media-type: application/json

app:
  url: ${APP_URL}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  jobs:
    queue-name: ${JOB_QUEUE_NAME:jobs.queue}
    exchange-name: ${JOB_EXCHANGE_NAME:jobs.exchange}
    routing-key: ${JOB_ROUTING_KEY:jobs.routing}

frontend:
  url: ${FRONTEND_URL}

storage:
  location: ${STORAGE_LOCATION}

brevo:
  apiKey: ${BREVO_API_KEY}
  baseUrl: ${BREVO_BASE_URL:https://api.brevo.com/v3}
  folders:
    contributionPeriodsId: ${BREVO_FOLDER_CONTRIBUTION_PERIODS_ID}

google:
  calendar:
    id: ${GOOGLE_CALENDAR_ID}
    clientId: ${GOOGLE_CALENDAR_CLIENT_ID}
    clientEmail: ${GOOGLE_CALENDAR_CLIENT_EMAIL}
    privateKeyPkcs8: ${GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8}
    privateKeyId: ${GOOGLE_CALENDAR_PRIVATE_KEY_ID}

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

logging:
  level:
    org:
      springframework:
        web: INFO
        hibernate: INFO
        security: INFO
        flywaydb: DEBUG
