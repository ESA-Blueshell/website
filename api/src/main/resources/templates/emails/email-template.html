<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style type="text/css">
        /* Reset styles */
        #outlook a {
            padding: 0;
        }

        .ExternalClass {
            width: 100%;
        }

        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {
            line-height: 100%;
        }

        table td {
            border-collapse: collapse;
            mso-line-height-rule: exactly;
        }

        .editable.image {
            font-size: 0 !important;
            line-height: 0 !important;
        }

        body {
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }

        img {
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
        }

        a img {
            border: none;
        }

        table {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        th {
            font-weight: normal;
            text-align: left;
        }

        *[class="gmail-fix"] {
            display: none !important;
        }

        /* Color Variables */
        :root {
            --neon-lime: #A8FF00;
            --shell-blue: #3387FA;
            --cool-grey: #343434;
            --close-black: #1E1E1E;
            --white: #FFFFFF;
        }

        /* Custom styles */
        p, h1, h2, h3, h4, ol, ul, li {
            margin: 0;
        }

        a, a:link {
            color: var(--shell-blue);
            text-decoration: underline;
        }

        /* Font Classes */
        .title-font {
            font-family: 'Fugaz One', Arial, sans-serif;
            font-size: 48pt;
            text-transform: uppercase;
            line-height: 1;
            margin: 0;
        }

        .heading1-font {
            font-family: 'Fugaz One', Arial, sans-serif;
            font-size: 38pt;
            text-transform: uppercase;
            line-height: 1.2;
            margin: 0;
        }

        .main-text-font {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 16pt;
            font-weight: 300;
            line-height: 1.4;
        }

        .heading2-font {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 26pt;
            font-weight: 400;
            line-height: 1.4;
        }

        /* Markdown Heading Styles */
        .email-content h1 {
            font-family: 'Fugaz One', Arial, sans-serif;
            font-size: 38pt;
            text-transform: uppercase;
            line-height: 1.2;
            margin: 20px 0 15px 0;
            color: inherit;
        }

        .email-content h2 {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 26pt;
            font-weight: 600;
            line-height: 1.4;
            margin: 18px 0 12px 0;
            color: inherit;
        }

        .email-content h3 {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 22pt;
            font-weight: 500;
            line-height: 1.4;
            margin: 16px 0 10px 0;
            color: inherit;
        }

        .email-content h4 {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 18pt;
            font-weight: 500;
            line-height: 1.4;
            margin: 14px 0 8px 0;
            color: inherit;
        }

        .email-content h5 {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 16pt;
            font-weight: 500;
            line-height: 1.4;
            margin: 12px 0 6px 0;
            color: inherit;
        }

        .email-content h6 {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            font-size: 14pt;
            font-weight: 500;
            line-height: 1.4;
            margin: 10px 0 5px 0;
            color: inherit;
        }

        /* Markdown content styles */
        .email-content p {
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .email-content ul, .email-content ol {
            margin: 15px 0;
            padding-left: 20px;
        }

        .email-content li {
            margin: 5px 0;
            line-height: 1.4;
        }

        .email-content strong {
            font-weight: 600;
        }

        .email-content em {
            font-style: italic;
        }

        .email-content code {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 14pt;
        }

        .email-content pre {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .email-content pre code {
            background-color: transparent;
            padding: 0;
        }

        .email-content blockquote {
            border-left: 4px solid var(--shell-blue);
            padding-left: 15px;
            margin: 15px 0;
            font-style: italic;
        }

        /* Dark mode adjustments for markdown content */
        body.dark-mode .email-content code {
            background-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .email-content pre {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Light mode adjustments for markdown content */
        body.light-mode .email-content code {
            background-color: rgba(0, 0, 0, 0.05);
        }

        body.light-mode .email-content pre {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Dark Mode Styles (default) */
        body.dark-mode {
            background-color: #0a0a0a;
            color: var(--white);
        }

        body.dark-mode .content-text {
            color: var(--white);
        }

        body.dark-mode a {
            color: var(--shell-blue);
        }

        body.dark-mode .background-container {
            background-color: #0a0a0a;
        }

        body.dark-mode .email-body-background {
            background-color: var(--close-black);
        }

        body.dark-mode .theme-toggle {
            background-color: var(--shell-blue);
            color: var(--white);
            border: 2px solid var(--shell-blue);
        }

        body.dark-mode .theme-toggle:hover {
            background-color: var(--white);
            color: var(--shell-blue);
        }

        /* Social media website icon filter for dark mode */
        body.dark-mode .website-icon {
            filter: invert(1) brightness(1.2);
        }

        /* Dark mode footer styles */
        body.dark-mode .email-footer {
        }

        body.dark-mode .footer-text {
            color: #ccc;
        }

        /* Light Mode Styles */
        body.light-mode {
            background-color: var(--white);
            color: var(--close-black);
        }

        body.light-mode .content-text {
            color: var(--close-black);
        }

        .main-title {
            color: var(--shell-blue);
        }

        body.light-mode a {
            color: var(--shell-blue);
        }

        body.light-mode .background-container {
            background-color: var(--white);
        }

        body.light-mode .theme-toggle {
            background-color: var(--cool-grey);
            color: var(--white);
            border: 2px solid var(--cool-grey);
        }

        body.light-mode .theme-toggle:hover {
            background-color: var(--shell-blue);
            color: var(--white);
        }

        /* Social media website icon filter for light mode */
        body.light-mode .website-icon {
            filter: none;
        }

        /* Main email body background for light mode */
        body.light-mode .email-body-background {
            background-color: var(--white);
        }

        /* Light mode footer styles */
        body.light-mode .email-footer {
            background-color: var(--white);
        }

        body.light-mode .footer-text {
            background-color: var(--white);
        }

        /* Main Content Container - 2/3 width, max 800px */
        .main-content-container {
            width: 66.67%;
            max-width: 800px;
            margin: 0 auto;
        }

        .full-width-container {
            width: 100%;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 15px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none !important;
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
        }

        @media (max-width: 600px) {
            .main-content-container {
                width: 95% !important;
            }

            .content-width {
                width: 100% !important;
            }

            .logo-container {
                width: 100% !important;
            }

            .social-container {
                padding-left: 25px !important;
                padding-right: 25px !important;
            }

            .title-font {
                font-size: 32pt !important;
            }

            .heading1-font {
                font-size: 24pt !important;
            }

            .main-text-font {
                font-size: 14pt !important;
            }

            .heading2-font {
                font-size: 14pt !important;
            }

            .text-content {
                padding-left: 15px !important;
                padding-right: 15px !important;
            }

            .theme-toggle {
                position: relative !important;
                top: auto !important;
                right: auto !important;
                display: block !important;
                margin: 20px auto !important;
                width: fit-content !important;
            }
        }
    </style>

    <script type="text/javascript">
        // Initialize darkMode to true when email loads
        function initializeTheme() {
            window.darkMode = true;
            const body = document.body;
            const toggleBtn = document.getElementById('themeToggle');

            // Ensure dark mode is applied
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            toggleBtn.textContent = '☀️ Light Mode';

            // Set background image for dark mode
            const bgContainer = document.querySelector('.background-container');
            if (bgContainer) {
                const appUrl = bgContainer.getAttribute('data-app-url');
                bgContainer.style.backgroundImage = `url(${appUrl}/api/assets/BackdropBlack.jpg)`;
                bgContainer.style.backgroundColor = '#1E1E1E';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const toggleBtn = document.getElementById('themeToggle');

            if (body.classList.contains('dark-mode')) {
                window.darkMode = false;
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                toggleBtn.textContent = '🌙 Dark Mode';

                // Update background image
                const bgContainer = document.querySelector('.background-container');
                if (bgContainer) {
                    const appUrl = bgContainer.getAttribute('data-app-url');
                    bgContainer.style.backgroundImage = `url(${appUrl}/api/assets/BackdropWhite.jpg)`;
                    bgContainer.style.backgroundColor = '#FFFFFF';
                }
            } else {
                window.darkMode = true;
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                toggleBtn.textContent = '☀️ Light Mode';

                // Update background image
                const bgContainer = document.querySelector('.background-container');
                if (bgContainer) {
                    const appUrl = bgContainer.getAttribute('data-app-url');
                    bgContainer.style.backgroundImage = `url(${appUrl}/api/assets/BackdropBlack.jpg)`;
                    bgContainer.style.backgroundColor = '#1E1E1E';
                }
            }
        }

        // Initialize theme when page loads
        document.addEventListener('DOMContentLoaded', initializeTheme);
    </script>

<body th:class="${darkMode == null || darkMode == true ? 'dark-mode' : 'light-mode'}">

                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </th>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                    </td>

            <!-- Footer section -->
