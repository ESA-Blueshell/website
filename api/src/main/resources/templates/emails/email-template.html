<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hint some clients that we’re dark-mode native -->
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">

    <!-- Google Fonts (clients will fallback if blocked) -->
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style type="text/css">
        /* Resets and email-safe defaults */
        #outlook a {
            padding: 0;
        }

        .ExternalClass {
            width: 100%;
        }

        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {
            line-height: 100%;
        }

        table, td {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            border: 0;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
            display: block;
        }

        p {
            margin: 0;
        }

        a {
            text-decoration: underline;
        }

        /* Minimal safe typography fallbacks; critical colors are inlined */
        .f-title {
            font-family: 'Fugaz One', Arial, sans-serif;
            color: #3387FA;
            font-size: 36px;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .f-body {
            font-family: 'Barlow Semi Condensed', Arial, sans-serif;
            color: #FFFFFF;
        }

        /* Optional client-targeted dark enhancements without relying on them */
        @media (prefers-color-scheme: dark) {
            .code, pre {
                background-color: rgba(255, 255, 255, 0.08) !important;
            }
        }

        /* Small mobile tweak */
        @media screen and (max-width: 600px) {
            .w-600 {
                width: 100% !important;
            }

            .px {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }

            .title {
                font-size: 28px !important;
                line-height: 1.1 !important;
            }

            .h1 {
                font-size: 24px !important;
                line-height: 1.2 !important;
            }

            .body {
                font-size: 14px !important;
                line-height: 1.5 !important;
            }
        }
    </style>

    <!--[if mso]>
    <xml>
        <o:OfficeDocumentSettings>
            <o:AllowPNG/>
            <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->
</head>

<body bgcolor="#121212" style="margin:0; padding:0; width:100% !important; background-color:#121212;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#121212"
       style="background-color:#121212; width:100%;">
    <tr>
        <td align="center" bgcolor="#121212" style="background-color:#121212;">

            <!-- Hero background (bulletproof) with solid color fallback -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#121212"
                   style="background-color:#121212;">
                <tr>
                    <td align="center" bgcolor="#121212" style="background-color:#121212;">
                        <!--[if gte mso 9]>
                        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false"
                                style="width:1000px;height:220px;">
                            <v:fill type="frame" color="#121212" src="cid:bg"/>
                            <v:textbox inset="0,0,0,0">
                        <![endif]-->
                        <div style="background-color:#121212; background-image:url('cid:bg'); background-size:cover; background-position:center;">
                            <!-- Non-Outlook background image (decorative); solid color remains primary -->
                            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                                   class="w-600" bgcolor="#121212" background="cid:bg"
                                   style="width:600px; background-color:#121212; margin:0 auto; background-size:cover; background-position:center;">
                                <tr>
                                    <td bgcolor="#121212" style="background-color:#121212; padding:24px 0 16px 0;"
                                        align="center">
                                        <img th:src="'cid:logo'" src="cid:logo"
                                             width="340" height="300" alt="Blueshell Esports Logo"
                                             style="width:340px; height:300px;">
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" bgcolor="#121212"
                                        style="background-color:#121212; padding:0 24px 24px 24px;">
                                        <h1 class="f-title title"
                                            th:if="${mainTitle != null and !#strings.isEmpty(mainTitle)}"
                                            th:text="${mainTitle}">
                                            MAIN TITLE
                                        </h1>
                                    </td>
                                </tr>
                            </table>
                        </div>
                        <!--[if gte mso 9]>
                        </v:textbox>
                        </v:rect>
                        <![endif]-->
                    </td>
                </tr>
            </table>

            <!-- Main card -->
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" class="w-600"
                   align="center"
                   bgcolor="#1A1A1A" style="width:600px; background-color:#1A1A1A; border-radius:12px; margin:0 auto;">
                <tr>
                    <td bgcolor="#1A1A1A" style="background-color:#1A1A1A; padding:24px;" class="px">
                        <!-- Email content -->
                        <div class="f-body body"
                             style="color:#FAFAFA; font-size:16px; line-height:1.5;">
                            <!-- Injected Markdown HTML -->
                            <div class="email-content"
                                 th:utext="${emailContent ?: 'No content provided.'}">
                                <p style="margin:0 0 16px 0; color:#FAFAFA;">This is the default content area where your
                                    email content will be displayed.</p>
                            </div>
                        </div>

                        <!-- Recommended base styles for common markdown elements (kept minimal, critical colors inline above) -->
                        <div style="display:none; line-height:0; font-size:0;">
                            <style type="text/css">
                                .email-content h1 {
                                    font-family: 'Fugaz One', Arial, sans-serif;
                                    font-size: 32px;
                                    line-height: 1.2;
                                    margin: 20px 0 12px 0;
                                    color: #FAFAFA !important;
                                    text-transform: uppercase;
                                }

                                .email-content h2 {
                                    font-family: 'Barlow Semi Condensed', Arial, sans-serif;
                                    font-size: 24px;
                                    line-height: 1.3;
                                    margin: 18px 0 10px 0;
                                    color: #FAFAFA !important;
                                }

                                .email-content h3 {
                                    font-family: 'Barlow Semi Condensed', Arial, sans-serif;
                                    font-size: 20px;
                                    line-height: 1.3;
                                    margin: 16px 0 8px 0;
                                    color: #FAFAFA !important;
                                }

                                .email-content p {
                                    margin: 0 0 16px 0;
                                    color: #FAFAFA !important;
                                }

                                .email-content li {
                                    margin: 6px 0;
                                    color: #FAFAFA !important;
                                }

                                .email-content a {
                                    color: #3387FA !important;
                                    text-decoration: underline !important;
                                }

                                .email-content code {
                                    background-color: rgba(255, 255, 255, 0.08);
                                    padding: 2px 4px;
                                    border-radius: 3px;
                                    font-family: 'Courier New', monospace;
                                    color: #FAFAFA;
                                }

                                .email-content pre {
                                    background-color: rgba(255, 255, 255, 0.08);
                                    padding: 12px;
                                    border-radius: 6px;
                                    overflow: auto;
                                    color: #FAFAFA;
                                }

                                .email-content blockquote {
                                    border-left: 4px solid #3387FA;
                                    padding-left: 12px;
                                    margin: 16px 0;
                                    color: #E6E6E6;
                                    font-style: italic;
                                }
                            </style>
                        </div>
                    </td>
                </tr>
            </table>

            <!-- Footer -->
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" class="w-600"
                   align="center"
                   bgcolor="#121212" style="width:600px; background-color:#121212; margin:0px auto 32px auto;">
                <tr>
                    <td bgcolor="#121212" style="background-color:#121212; padding:16px 8px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               bgcolor="#121212" style="background-color:#121212;">
                            <tr>
                                <td align="center" bgcolor="#121212" style="background-color:#121212;">
                                    <!-- Social icons -->
                                    <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                                           bgcolor="#121212" style="background-color:#121212;">
                                        <tr>
                                            <td style="padding:6px 4px;">
                                                <a href="https://discord.gg/dFam2yqXu7" target="_blank"
                                                   style="color:#FAFAFA; text-decoration:none;">
                                                    <img src="https://cdn-icons-png.flaticon.com/32/2111/2111370.png"
                                                         width="32" height="32" alt="Discord"
                                                         style="width:32px; height:32px;">
                                                </a>
                                            </td>
                                            <td style="padding:6px 4px;">
                                                <a href="https://www.facebook.com/BlueshellEsports" target="_blank"
                                                   style="color:#FAFAFA; text-decoration:none;">
                                                    <img src="https://cdn-icons-png.flaticon.com/32/733/733547.png"
                                                         width="32" height="32" alt="Facebook"
                                                         style="width:32px; height:32px;">
                                                </a>
                                            </td>
                                            <td style="padding:6px 4px;">
                                                <a href="https://www.instagram.com/esablueshell/" target="_blank"
                                                   style="color:#FAFAFA; text-decoration:none;">
                                                    <img src="https://cdn-icons-png.flaticon.com/32/2111/2111463.png"
                                                         width="32" height="32" alt="Instagram"
                                                         style="width:32px; height:32px;">
                                                </a>
                                            </td>
                                            <td style="padding:6px 4px;">
                                                <a href="https://twitter.com/BlueshellESA" target="_blank"
                                                   style="color:#FAFAFA; text-decoration:none;">
                                                    <img src="https://cdn-icons-png.flaticon.com/32/733/733579.png"
                                                         width="32" height="32" alt="Twitter/X"
                                                         style="width:32px; height:32px;">
                                                </a>
                                            </td>
                                            <td style="padding:6px 4px;">
                                                <a href="https://www.twitch.tv/blueshellesports" target="_blank"
                                                   style="color:#FAFAFA; text-decoration:none;">
                                                    <img src="https://cdn-icons-png.flaticon.com/32/5968/5968819.png"
                                                         width="32" height="32" alt="Twitch"
                                                         style="width:32px; height:32px;">
                                                </a>
                                            </td>
                                            <td style="padding:6px 4px;">
                                                <a href="https://esa-blueshell.nl/" target="_blank"
                                                   style="color:#FAFAFA; text-decoration:none;">
                                                    <img src="https://cdn-icons-png.flaticon.com/32/1006/1006771.png"
                                                         width="32" height="32" alt="Website"
                                                         style="width:32px; height:32px;">
                                                </a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td align="center" bgcolor="#1A1A1A"
                                    style="background-color:#1A1A1A; border-radius:10px; padding:12px 16px; margin:0 16px;">
                                    <p class="f-body" style="font-size:12px; line-height:1.4; color:#CCCCCC; margin:0;">
                                        This email was sent to:
                                        <strong th:text="${sentTo}" style="color:#FFFFFF;">[recipient-email]</strong>
                                    </p>
                                    <p class="f-body"
                                       style="font-size:12px; line-height:1.4; color:#CCCCCC; margin:6px 0 0 0;">
                                        Sent on:
                                        <span th:text="${#dates.format(#dates.createNow(), 'MMMM dd, yyyy ''at'' HH:mm')}"
                                              style="color:#FFFFFF;">Date and Time</span>
                                    </p>
                                </td>
                            </tr>

                            <tr>
                                <td align="center" style="padding-top:12px;">
                                    <p class="f-body" style="font-size:12px; line-height:1.4; color:#AAAAAA; margin:0;">
                                        Need help? Visit
                                        <a href="https://esa-blueshell.nl/"
                                           style="color:#3387FA; text-decoration:underline;">our website</a>.
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
