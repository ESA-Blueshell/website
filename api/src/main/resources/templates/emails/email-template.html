<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="telephone=no" name="format-detection">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <!-- Hint some clients that we’re dark-mode native -->
    <meta content="dark" name="color-scheme">
    <meta content="dark" name="supported-color-schemes">

    <style>
        /* Webfont imports for clients that support them; others will use fallbacks */
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fugaz+One&display=swap');

        /* Global typography defaults and robust fallbacks */
        body, table, td, p, a, span, h1, h2, h3, li, pre, blockquote {
            font-family: "Barlow Semi Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", Helvetica, sans-serif !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        h1 {
            font-family: "Fugaz One", Arial, sans-serif !important;
            font-size: 32px !important;
            line-height: 1.2 !important;
            margin: 20px 0 12px 0 !important;
            color: #3387FA !important;
            text-transform: uppercase !important;
            text-align: center !important;
        }

        h2 {
            font-family: "Barlow Semi Condensed", Arial, sans-serif !important;
            font-size: 24px !important;
            line-height: 1.3 !important;
            margin: 18px 0 10px 0 !important;
            color: #FAFAFA !important;
        }

        h3 {
            font-family: "Barlow Semi Condensed", Arial, sans-serif !important;
            font-size: 20px !important;
            line-height: 1.3 !important;
            margin: 16px 0 8px 0 !important;
            color: #FAFAFA !important;
        }

        p {
            margin: 0 0 16px 0 !important;
            color: #FAFAFA !important;
        }

        li {
            margin: 6px 0 !important;
            color: #FAFAFA !important;
        }

        a {
            color: #3387FA !important;
            text-decoration: underline !important;
        }

        pre {
            background-color: rgba(255, 255, 255, 0.08) !important;
            padding: 12px !important;
            border-radius: 6px !important;
            overflow: auto !important;
            color: #FAFAFA !important;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
        }

        blockquote {
            border-left: 4px solid #3387FA !important;
            padding-left: 12px !important;
            margin: 16px 0 !important;
            color: #E6E6E6 !important;
            font-style: italic !important;
        }

        /* Container max width for email clients */
        .email-container {
            width: 100% !important;
            max-width: 600px !important;
        }

        /* Better default text color in dark background */
        .body {
            color: #FAFAFA !important;
            padding: 0 24px !important;
        }

        hr {
            border: 0 !important;
            border-top: 1px solid #A8FF00 !important; /* Outlook-friendly */
            height: 1px !important;
            background-color: #A8FF00 !important; /* WebKit/others */
            color: #A8FF00 !important;
            margin: 5px 0 !important;
        }
    </style>


    <!--[if mso]>
    <style type="text/css">
        body, table, td, p, a, span, h1, h2, h3, li, pre, blockquote {
            font-family: Arial, Helvetica, sans-serif !important;
        }

        h1 {
            text-transform: uppercase !important;
        }
    </style>
    <![endif]-->

</head>
<body style="margin:0; padding:0;">
<div>
    <!--[if mso]>
    <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:100%;height:100%;">
        <v:fill type="tile" src="cid:bg" color="#121212" />
        <v:textbox inset="0,0,0,0">
    <![endif]-->
    <div style="background-color:#121212; background-image:url('cid:bg'); background-repeat:repeat; background-position:top left;">
        <!-- 600px max-width foreground container, centered -->
        <div style="max-width: 600px; margin: 0 auto; background-color: #1E1E1E;">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
                <tr>
                    <td align="center">
                        <table
                                border="0" cellpadding="0" cellspacing="0" class="email-container" role="presentation"
                                style="margin:0 auto;"
                        >
                            <tr>
                                <td class="body">
                                    <div style="text-align:center;">
                                        <img
                                                alt="Blueshell Esports Logo" src="cid:logo"
                                                style="width:340px; height:300px; display:block; margin:0 auto;"
                                                th:src="'cid:logo'"
                                        >
                                    </div>
                                    <h1
                                            class="f-title title"
                                            th:if="${mainTitle != null and !#strings.isEmpty(mainTitle)}"
                                            th:text="${mainTitle}"
                                    >
                                        MAIN TITLE
                                    </h1>
                                    <hr>
                                    <div
                                            class="email-content"
                                            th:utext="${emailContent ?: 'No content provided.'}"
                                    >
                                        <p style="margin:0 0 16px 0; color:#FAFAFA;">
                                            This is the default content area where your email content will be displayed.
                                        </p>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation">
                            <tr>
                                <td style="padding:6px 4px;">
                                    <a
                                            href="https://discord.gg/dFam2yqXu7" style="color:#FAFAFA; text-decoration:none;"
                                            target="_blank"
                                    >
                                        <img
                                                alt="Discord"
                                                src="https://cdn-icons-png.flaticon.com/32/2111/2111370.png"
                                                style="width:32px; height:32px;"
                                        >
                                    </a>
                                </td>
                                <td style="padding:6px 4px;">
                                    <a
                                            href="https://www.facebook.com/BlueshellEsports" style="color:#FAFAFA; text-decoration:none;"
                                            target="_blank"
                                    >
                                        <img
                                                alt="Facebook"
                                                src="https://cdn-icons-png.flaticon.com/32/733/733547.png"
                                                style="width:32px; height:32px;"
                                        >
                                    </a>
                                </td>
                                <td style="padding:6px 4px;">
                                    <a
                                            href="https://www.instagram.com/esablueshell/" style="color:#FAFAFA; text-decoration:none;"
                                            target="_blank"
                                    >
                                        <img
                                                alt="Instagram"
                                                src="https://cdn-icons-png.flaticon.com/32/2111/2111463.png"
                                                style="width:32px; height:32px;"
                                        >
                                    </a>
                                </td>
                                <td style="padding:6px 4px;">
                                    <a
                                            href="https://twitter.com/BlueshellESA" style="color:#FAFAFA; text-decoration:none;"
                                            target="_blank"
                                    >
                                        <img
                                                alt="Twitter/X"
                                                src="https://cdn-icons-png.flaticon.com/32/733/733579.png"
                                                style="width:32px; height:32px;"
                                        >
                                    </a>
                                </td>
                                <td style="padding:6px 4px;">
                                    <a
                                            href="https://www.twitch.tv/blueshellesports" style="color:#FAFAFA; text-decoration:none;"
                                            target="_blank"
                                    >
                                        <img
                                                alt="Twitch"
                                                src="https://cdn-icons-png.flaticon.com/32/5968/5968819.png"
                                                style="width:32px; height:32px;"
                                        >
                                    </a>
                                </td>
                                <td style="padding:6px 4px;">
                                    <a
                                            href="https://esa-blueshell.nl/" style="text-decoration:none;"
                                            target="_blank"
                                    >
                                        <img
                                                alt="Website"
                                                src="https://cdn-icons-png.flaticon.com/32/1006/1006771.png"
                                                style="width:32px; height:32px; display:block; filter: brightness(0) invert(1); -webkit-filter: brightness(0) invert(1);"
                                        >
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <table>
                            <hr>
                            <tr>
                                <td style="text-align:center;">
                                    <p>
                                        This email was sent to: <strong style="color:#FFFFFF;" th:text="${sentTo}">[recipient-email]</strong>
                                        <br />
                                        Sent on: <span
                                            th:text="${#dates.format(#dates.createNow(), 'MMMM dd, yyyy ''at'' HH:mm')}"
                                    >Date and Time</span>
                                        <br />
                                        Need help? Visit <a href="https://esa-blueshell.nl/"> our website </a>.
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <!--[if mso]>
    </v:textbox>
    </v:rect>
    <![endif]-->
</div>
</body>
</html>
