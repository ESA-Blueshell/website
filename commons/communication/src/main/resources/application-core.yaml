spring:
  mvc:
    dispatch-options-request: true
  cloud:
    stream:
      default-binder: rabbit
      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host:     rabbitmq
                port:     ${RABBITMQ_NODE_PORT}
                username: ${RABBITMQ_DEFAULT_USER}
                password: ${RABBITMQ_DEFAULT_PASS}


      bindings:
        # ┌──────────────────────────────────────────────────────┐
        # │ 1) Email Parser Service                             │
        # └──────────────────────────────────────────────────────┘
        parseEmail-in-0:
          binder: rabbit
          destination: email.raw
          group:      email‑parser
          content-type: application/json

        parseEmail-out-0:
          binder: rabbit
          destination: blog.internal
          content-type: application/json

        # ┌──────────────────────────────────────────────────────┐
        # │ 2) Blog Service                                     │
        # └──────────────────────────────────────────────────────┘
        handleBlog-in-0:
          binder: rabbit
          destination: blog.internal
          group:      blog‑service
          content-type: application/json

        handleBlog-out-0:
          binder: rabbit
          destination: social.post
          content-type: application/json

        # ┌──────────────────────────────────────────────────────┐
        # │ 3) Event Parser Service                             │
        # └──────────────────────────────────────────────────────┘
        parseEvent-in-0:
          binder: rabbit
          destination: event.raw
          group:      event‑parser
          content-type: application/json

        parseEvent-out-0:
          binder: rabbit
          destination: social.post
          content-type: application/json

        # ┌──────────────────────────────────────────────────────┐
        # │ 4) Social Media Service                             │
        # └──────────────────────────────────────────────────────┘
        distributeSocial-in-0:
          binder: rabbit
          destination: social.post
          group:      social‑media‑service
          content-type: application/json

app:
  url: ${APP_URL}

frontend:
  url: ${FRONTEND_URL}


eureka:
  instance:
    prefer-ip-address: true
    hostname: eureka-server
    non-secure-port: 8080
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 60

logging:
  level:
    org:
      springframework:
        security: DEBUG