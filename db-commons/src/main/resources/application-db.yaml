spring:
  datasource:
    host: db
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${spring.datasource.host}:${MYSQL_PORT}/${spring.application.name}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&connectionCollation=utf8mb4_unicode_ci&character_set_server=utf8mb4
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: "SELECT 1"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      hibernate.enable_lazy_load_no_trans: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    dispatch-options-request: true

app:
  url: ${APP_URL}