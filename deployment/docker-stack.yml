# =============================================================================
# docker-stack.yml — Website application stack for Docker Swarm.
#
# Deployed by deployment/deploy.sh via:
#   docker stack deploy --with-registry-auth --prune \
#     -c deployment/docker-stack.yml <stack-name>
#
# Variables exported by deploy.sh before deploy:
#   IMAGE_TAG    — Docker image tag (latest | staging | dev)
#   STACK_NAME   — Swarm stack name (website | website-staging | website-dev)
#   APP_DOMAIN   — Routing hostname (esa-blueshell.nl | staging.esa-blueshell.nl | dev.esa-blueshell.nl)
#   All DB, API, Listmonk credentials (sourced from services/**/.*.env)
#
# Networks:
#   frontback      — internal overlay; frontend ↔ api, api ↔ listmonk-setup
#   database       — internal overlay; api ↔ db, listmonk ↔ listmonk-db
#   traefik-public — external overlay; shared with infra stack for Traefik routing
#   monitoring     — external overlay; shared with infra stack for Prometheus scraping
#
# Swarm notes:
#   - No env_file: — deploy.sh sources env files and exports all vars
#   - No depends_on: — services use deploy.restart_policy with retries
#   - No build: — all images pulled from GHCR
#   - Traefik labels go under deploy.labels: (not top-level labels:)
#   - Bind mounts use absolute paths (/src/website/...)
# =============================================================================

services:

  # ── MariaDB ────────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11.10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - /src/website/services/api/0_init.sql:/docker-entrypoint-initdb.d/0_init.sql
      - /src/website/services/api/1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql
    networks:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M

  # ── Spring Boot API ────────────────────────────────────────────────────────
  api:
    image: ghcr.io/esa-blueshell/api:${IMAGE_TAG:-latest}
    environment:
      TZ:                Europe/Amsterdam
      APP_URL:           https://${APP_DOMAIN}/api
      FRONTEND_URL:      https://${APP_DOMAIN}
      # DB (from .db.env)
      MYSQL_HOST:        db
      MYSQL_PORT:        "3306"
      MYSQL_DATABASE:    ${MYSQL_DATABASE}
      MYSQL_USER:        ${MYSQL_USER}
      MYSQL_PASSWORD:    ${MYSQL_PASSWORD}
      # Application secrets (from .api.env)
      JWT_SECRET:                       ${JWT_SECRET}
      STORAGE_LOCATION:                 /home/storage
      SMTP_HOST:                        ${SMTP_HOST:-}
      SMTP_PORT:                        ${SMTP_PORT:-587}
      SMTP_USERNAME:                    ${SMTP_USERNAME:-}
      SMTP_PASSWORD:                    ${SMTP_PASSWORD:-}
      SMTP_USE_SSL:                     ${SMTP_USE_SSL:-false}
      SMTP_USE_TLS:                     ${SMTP_USE_TLS:-true}
      BREVO_API_KEY:                    ${BREVO_API_KEY:-}
      GOOGLE_CALENDAR_ID:               ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CALENDAR_CLIENT_ID:        ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_EMAIL:     ${GOOGLE_CALENDAR_CLIENT_EMAIL:-}
      GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8: ${GOOGLE_CALENDAR_PRIVATE_KEY_PKCS8:-}
      GOOGLE_CALENDAR_PRIVATE_KEY_ID:   ${GOOGLE_CALENDAR_PRIVATE_KEY_ID:-}
      MOLLIE_API_KEY:                   ${MOLLIE_API_KEY:-}
      FACEBOOK_PAGE_ID:                 ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_ACCESS_TOKEN:            ${FACEBOOK_ACCESS_TOKEN:-}
      X_API_KEY:                        ${X_API_KEY:-}
      X_API_SECRET:                     ${X_API_SECRET:-}
      X_ACCESS_TOKEN:                   ${X_ACCESS_TOKEN:-}
      X_ACCESS_SECRET:                  ${X_ACCESS_SECRET:-}
      # Listmonk (from .listmonk.env)
      LISTMONK_API_USERNAME: ${LISTMONK_ADMIN_USERNAME}
      LISTMONK_API_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
    volumes:
      - /src/website/storage:/home/storage
      - listmonk-secrets:/run/secrets/listmonk:ro
    networks:
      - frontback
      - database
      - traefik-public
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
      resources:
        limits:
          memory: 1G
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${STACK_NAME:-website}-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.${STACK_NAME:-website}-api.entrypoints=websecure"
        - "traefik.http.routers.${STACK_NAME:-website}-api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.${STACK_NAME:-website}-api.middlewares=${STACK_NAME:-website}-api-strip,${STACK_NAME:-website}-api-ratelimit"
        - "traefik.http.middlewares.${STACK_NAME:-website}-api-strip.stripprefix.prefixes=/api"
        - "traefik.http.middlewares.${STACK_NAME:-website}-api-ratelimit.ratelimit.average=100"
        - "traefik.http.middlewares.${STACK_NAME:-website}-api-ratelimit.ratelimit.burst=50"
        - "traefik.http.services.${STACK_NAME:-website}-api.loadbalancer.server.port=8080"

  # ── Vue.js Frontend ────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/esa-blueshell/frontend:${IMAGE_TAG:-latest}
    environment:
      TZ:           Europe/Amsterdam
      VITE_APP_URL: https://${APP_DOMAIN}/api
    networks:
      - frontback
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${STACK_NAME:-website}-frontend.rule=Host(`${APP_DOMAIN}`)"
        - "traefik.http.routers.${STACK_NAME:-website}-frontend.entrypoints=websecure"
        - "traefik.http.routers.${STACK_NAME:-website}-frontend.tls.certresolver=letsencrypt"
        - "traefik.http.services.${STACK_NAME:-website}-frontend.loadbalancer.server.port=3000"

  # ── Listmonk (email marketing) ─────────────────────────────────────────────
  listmonk:
    image: listmonk/listmonk:v4.1.0
    environment:
      LISTMONK_app__address:   "0.0.0.0:9000"
      LISTMONK_db__host:       listmonk-db
      LISTMONK_db__port:       "5432"
      LISTMONK_db__user:       listmonk
      LISTMONK_db__password:   ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database:   listmonk
      LISTMONK_db__ssl_mode:   disable
      LISTMONK_ADMIN_USER:     ${LISTMONK_ADMIN_USERNAME}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
    command: >-
      sh -c "
        ./listmonk --install --idempotent --yes &&
        ./listmonk --upgrade --yes &&
        exec ./listmonk
      "
    networks:
      - frontback
      - database
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${STACK_NAME:-website}-listmonk.rule=Host(`listmonk.${APP_DOMAIN}`)"
        - "traefik.http.routers.${STACK_NAME:-website}-listmonk.entrypoints=websecure"
        - "traefik.http.routers.${STACK_NAME:-website}-listmonk.tls.certresolver=letsencrypt"
        - "traefik.http.services.${STACK_NAME:-website}-listmonk.loadbalancer.server.port=9000"

  # ── Listmonk PostgreSQL ────────────────────────────────────────────────────
  listmonk-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER:     listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB:       listmonk
    volumes:
      - listmonk-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M

  # ── Listmonk one-shot setup ────────────────────────────────────────────────
  # Runs once on first deploy; writes the API token to listmonk-secrets volume.
  # api depends on this token being present; retry policy on api handles the race.
  listmonk-setup:
    image: python:3.12-alpine
    environment:
      LISTMONK_URL:              "http://listmonk:9000"
      LISTMONK_ADMIN_USERNAME:   ${LISTMONK_ADMIN_USERNAME}
      LISTMONK_ADMIN_PASSWORD:   ${LISTMONK_ADMIN_PASSWORD}
      LISTMONK_ADMIN_EMAIL:      ${LISTMONK_ADMIN_EMAIL}
      LISTMONK_ADMIN_API_USER:   ${LISTMONK_ADMIN_API_USER:-api}
      LISTMONK_API_TOKEN_FILE:   /secrets/api-token.env
      LISTMONK_SMTP_HOST:                    ${LISTMONK_SMTP_HOST:-}
      LISTMONK_SMTP_PORT:                    ${LISTMONK_SMTP_PORT:-587}
      LISTMONK_SMTP_AUTH_PROTOCOL:           ${LISTMONK_SMTP_AUTH_PROTOCOL:-plain}
      LISTMONK_SMTP_USERNAME:                ${LISTMONK_SMTP_USERNAME:-}
      LISTMONK_SMTP_PASSWORD:                ${LISTMONK_SMTP_PASSWORD:-}
      LISTMONK_SMTP_HELLO_HOSTNAME:          ${LISTMONK_SMTP_HELLO_HOSTNAME:-}
      LISTMONK_SMTP_TLS_TYPE:                ${LISTMONK_SMTP_TLS_TYPE:-starttls}
      LISTMONK_SMTP_TLS_SKIP_VERIFY:         ${LISTMONK_SMTP_TLS_SKIP_VERIFY:-false}
      LISTMONK_BOUNCE_MAILBOX_ENABLED:       ${LISTMONK_BOUNCE_MAILBOX_ENABLED:-false}
      LISTMONK_BOUNCE_MAILBOX_HOST:          ${LISTMONK_BOUNCE_MAILBOX_HOST:-}
      LISTMONK_BOUNCE_MAILBOX_PORT:          ${LISTMONK_BOUNCE_MAILBOX_PORT:-993}
      LISTMONK_BOUNCE_MAILBOX_USERNAME:      ${LISTMONK_BOUNCE_MAILBOX_USERNAME:-}
      LISTMONK_BOUNCE_MAILBOX_PASSWORD:      ${LISTMONK_BOUNCE_MAILBOX_PASSWORD:-}
      LISTMONK_BOUNCE_MAILBOX_TLS_ENABLED:   ${LISTMONK_BOUNCE_MAILBOX_TLS_ENABLED:-true}
      LISTMONK_BOUNCE_MAILBOX_TLS_SKIP_VERIFY: ${LISTMONK_BOUNCE_MAILBOX_TLS_SKIP_VERIFY:-false}
      LISTMONK_BOUNCE_MAILBOX_FOLDER:        ${LISTMONK_BOUNCE_MAILBOX_FOLDER:-INBOX}
      LISTMONK_BOUNCE_MAILBOX_RETURN_PATH:   ${LISTMONK_BOUNCE_MAILBOX_RETURN_PATH:-}
      LISTMONK_BOUNCE_MAILBOX_SCAN_INTERVAL: ${LISTMONK_BOUNCE_MAILBOX_SCAN_INTERVAL:-10m}
    volumes:
      - /src/website/services/listmonk/setup.py:/setup.py:ro
      - /src/website/services/listmonk/custom/theme.css:/theme.css:ro
      - listmonk-secrets:/secrets
    command: ["python", "/setup.py"]
    networks:
      - frontback
    deploy:
      restart_policy:
        condition: none   # one-shot: run once and stop
      resources:
        limits:
          memory: 128M

networks:
  frontback:
    driver: overlay
  database:
    driver: overlay
  traefik-public:
    external: true
  monitoring:
    external: true

volumes:
  db-data:
  listmonk-data:
  listmonk-secrets:
