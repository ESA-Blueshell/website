services:
  db:
    image: mariadb:10.11.10
    container_name: db
    ports:
      - "3306:3306"
    volumes:
      - "./data:/var/lib/mysql"
      - "./env/dump.sql:/docker-entrypoint-initdb.d/init.sql"
    networks:
      - global_network
    restart: unless-stopped
    env_file:
      - ./env/.db.env
    command: --log-bin-trust-function-creators=1
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - global_network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/ssl:rw
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "service nginx status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    container_name: frontend-dev
    build:
      context: frontend
      dockerfile: Dockerfile-dev
    ports:
      - "3000:3000"
    volumes:
      - "./frontend:/usr/app"
      - /usr/app/node_modules
    networks:
      - global_network
    depends_on:
      - api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    container_name: api-dev
    build:
      context: api
      dockerfile: Dockerfile-dev
    volumes:
      - ./api:/app
      - maven-repo:/root/.m2
      - "./storage:/home/storage"
    ports:
      - "8080:8080"
    command: [
      "sh",
      "-c",
      "mvn install -am -DskipTests && \
       mvn spring-boot:run -Dspring-boot.run.profiles=dev -Dspring-boot.run.fork=false"
    ]
    networks:
      - global_network
    restart: unless-stopped
    env_file:
      - ./env/.db.env
      - ./env/.app.env
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  global_network:
    driver: bridge

volumes:
  maven-repo:
  nginx_certs:
    driver: local
