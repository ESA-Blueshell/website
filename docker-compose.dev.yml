services:
  db:
    image: mariadb:10.11.10
    container_name: db
    ports:
      - "3307:3306"
    volumes:
      - data:/var/lib/mysql
      - "./env/0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./env/1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    networks:
      - global_network
    restart: unless-stopped
    env_file:
      - ./env/.db.env
    environment:
      - TZ=Europe/Amsterdam
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: frontend:dev
    pull_policy: never
    build:
      context: frontend
      dockerfile: Dockerfile-dev
    expose:
      - 3000
    ports:
      - "3000:3000"
    volumes:
      - "./frontend:/usr/app"
      - ./openapi:/usr/openapi
      - /usr/app/.yarn
    networks:
      - global_network
    environment:
      - TZ=Europe/Amsterdam
      - VITE_APP_URL=http://localhost:8080
      - VITE_COVERAGE=true
    depends_on:
      - api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: api:dev
    pull_policy: never
    build:
      context: .
      dockerfile: api/Dockerfile-dev
    volumes:
      - ./:/app
      - ./storage:/home/storage
      - gradle-cache:/root/.gradle
      - playwright-browsers:/ms-playwright
      - playwright-browsers:/root/.cache/ms-playwright
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - global_network
    env_file:
      - ./env/.api.env
    environment:
      - TZ=Europe/Amsterdam
      - SPRING_PROFILES_ACTIVE=dev
      - APP_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - LISTMONK_FROM_ADDRESS=no-reply@localhost
      - LISTMONK_REPLY_TO_ADDRESS=dev@localhost
    depends_on:
      - db
      - listmonk
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

  listmonk:
    image: listmonk/listmonk:v4.1.0
    ports:
      - "9000:9000"
    depends_on:
      listmonk-db:
        condition: service_healthy
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_app__admin_username: listmonk
      LISTMONK_app__admin_password: listmonk
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
    command: sh -c "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"
    networks:
      - global_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  listmonk-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - listmonk-data:/var/lib/postgresql/data
    networks:
      - global_network

networks:
  global_network:
    driver: bridge

volumes:
  data:
  gradle-cache:
  playwright-browsers:
  nginx_certs:
    driver: local
  listmonk-data:
