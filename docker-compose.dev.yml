services:
  db:
    image: mariadb:10.11.10
    container_name: db
    ports:
      - "3307:3306"
    volumes:
      - data:/var/lib/mysql
      - "./env/0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./env/1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    networks:
      - global_network
    restart: unless-stopped
    env_file:
      - ./env/.db.env
    environment:
      - TZ=Europe/Amsterdam
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: frontend:dev
    pull_policy: never
    build:
      context: frontend
      dockerfile: Dockerfile-dev
    expose:
      - 3000
    ports:
      - "3000:3000"
    volumes:
      - "./frontend:/usr/app"
      - ./openapi:/usr/openapi
      - /usr/app/.yarn
    networks:
      - global_network
    environment:
      - TZ=Europe/Amsterdam
      - VITE_APP_URL=http://localhost:8080
      - VITE_COVERAGE=true
    depends_on:
      - api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: api:dev
    pull_policy: never
    build:
      context: .
      dockerfile: api/Dockerfile-dev
    volumes:
      - ./:/app
      - ./storage:/home/storage
      - gradle-cache:/root/.gradle
      - playwright-browsers:/ms-playwright
      - playwright-browsers:/root/.cache/ms-playwright
      - listmonk-secrets:/run/secrets/listmonk:ro
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - global_network
    env_file:
      - ./env/.api.env
    environment:
      - TZ=Europe/Amsterdam
      - SPRING_PROFILES_ACTIVE=dev
      - APP_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - LISTMONK_FROM_ADDRESS=no-reply@localhost
      - LISTMONK_REPLY_TO_ADDRESS=dev@localhost
    depends_on:
      db:
        condition: service_healthy
      listmonk-setup:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

  listmonk:
    image: listmonk/listmonk:v4.1.0
    ports:
      - "9000:9000"
    depends_on:
      listmonk-db:
        condition: service_healthy
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_API_USER: ${LISTMONK_ADMIN_API_USER:-api}
    volumes:
      - listmonk-secrets:/secrets
    # Capture the API token printed to stderr during --install (supported in newer Listmonk versions).
    # The token is written to the shared volume so the api service can read it on startup.
    command: >-
      sh -c "
        ./listmonk --install --idempotent --yes 2>/tmp/install.err;
        cat /tmp/install.err >&2;
        grep 'LISTMONK_ADMIN_API_TOKEN' /tmp/install.err | sed 's/^export //' > /secrets/api-token.env;
        ./listmonk --upgrade --yes &&
        exec ./listmonk
      "
    networks:
      - global_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  listmonk-setup:
    image: curlimages/curl:8.12.1
    restart: "no"
    depends_on:
      listmonk:
        condition: service_healthy
    env_file:
      - path: ./env/.listmonk.env
        required: false
    environment:
      LISTMONK_ADMIN_USERNAME: ${LISTMONK_ADMIN_USERNAME:-listmonk}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-listmonk}
      LISTMONK_ADMIN_EMAIL: ${LISTMONK_ADMIN_EMAIL:-admin@listmonk.local}
    volumes:
      - ./listmonk/setup.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh"]
    networks:
      - global_network

  listmonk-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - listmonk-data:/var/lib/postgresql/data
    networks:
      - global_network

networks:
  global_network:
    driver: bridge

volumes:
  data:
  gradle-cache:
  playwright-browsers:
  nginx_certs:
    driver: local
  listmonk-data:
  listmonk-secrets:
