      "mvn install -pl BlogService -am -DskipTests && \
       cd BlogService && \
       mvn spring-boot:run -Dspring-boot.run.profiles=dev -Dspring-boot.run.fork=false"
    ]
    ports:
      - "8081:8080"
      - "5006:5005"
    networks:
      - global_network
    depends_on:
      - rabbitmq
      - db
    env_file:
      - Docker/env/.db.env
      - Docker/env/.app.env
      - Docker/env/.rabbitmq.env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/" ]
