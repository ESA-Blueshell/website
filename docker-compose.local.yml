services:
  db:
    image: mariadb:10.11.10
    container_name: db
    networks:
      - database
    volumes:
      - db_data:/var/lib/mysql
      - "./env/0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./env/1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    env_file:
      - ./env/.db.env.prod
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./env/.rabbitmq.env
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: api:local
    pull_policy: never
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/.api.env
    environment:
      - TZ=Europe/Amsterdam
      - APP_URL=https://localhost/api
      - FRONTEND_URL=https://localhost
    volumes:
      - "./storage:/home/storage"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - frontback
      - database
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: frontend:local
    pull_policy: never
    build:
      context: frontend
      dockerfile: Dockerfile
    networks:
      - frontback
    environment:
      - TZ=Europe/Amsterdam
      - VITE_APP_URL=https://localhost/api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontback
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/ssl:rw
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    healthcheck:
      test: [ "CMD-SHELL", "service nginx status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command: [ "nginx", "-g", "daemon off;" ]

networks:
  frontback:
  database:

volumes:
  db_data:
  nginx_certs:
    driver: local
