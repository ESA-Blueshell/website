services:
  db:
    image: mariadb:10.11.10
    container_name: db
    networks:
      - database
    volumes:
      - db_data:/var/lib/mysql
      - "./env/0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./env/1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    env_file:
      - ./env/.db.env
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: api:prod
    pull_policy: never
    build:
      context: .
      dockerfile:
        api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/.api.env
    environment:
      - TZ=Europe/Amsterdam
      - APP_URL=https://esa-blueshell.nl/api
      - FRONTEND_URL=https://esa-blueshell.nl
    volumes:
      - "./storage:/home/storage"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontback
      - database
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: frontend:prod
    pull_policy: never
    build:
      context: frontend
      dockerfile: Dockerfile
    networks:
      - frontback
    environment:
      - TZ=Europe/Amsterdam
      - VITE_APP_URL=https://esa-blueshell.nl/api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontback
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf

  certbot:
    image: certbot/certbot
    container_name: certbot
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: >
      certonly --webroot
      -w /var/www/certbot
      --force-renewal
      --non-interactive
      --agree-tos
      --email board@blueshell.utwente.nl
      -d esa-blueshell.nl

  certbot-renew:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: >
      sh -c '
        while true; do
          certbot renew --webroot -w /var/www/certbot --non-interactive || true;
          sleep 30d;
        done
      '

networks:
  frontback:
  database:

volumes:
  letsencrypt:
  certbot-www:
  db_data:

configs:
  nginx_default_conf:
    file: ./nginx/nginx.conf