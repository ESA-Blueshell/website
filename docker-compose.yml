services:
  db:
    image: mariadb:10.11.10
    container_name: db
    networks:
      - database
    volumes:
      - db_data:/var/lib/mysql
      - "./env/0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./env/1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    env_file:
      - ./env/.db.env
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/esa-blueshell/api:latest
    pull_policy: always
    build:
      context: .
      dockerfile:
        api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/.api.env
    environment:
      - TZ=Europe/Amsterdam
      - APP_URL=https://esa-blueshell.nl/api
      - FRONTEND_URL=https://esa-blueshell.nl
    volumes:
      - "./storage:/home/storage"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontback
      - database
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/esa-blueshell/frontend:latest
    pull_policy: always
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontback
    environment:
      - TZ=Europe/Amsterdam
      - VITE_APP_URL=https://esa-blueshell.nl/api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontback
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c '
        DOMAINS="-d esa-blueshell.nl -d www.esa-blueshell.nl";
        EMAIL="board@blueshell.utwente.nl";
        WEBROOT="/var/www/certbot";
      
        # First-time issuance if cert is missing
        if [ ! -f /etc/letsencrypt/live/esa-blueshell.nl/fullchain.pem ]; then
          echo "No certificate found; obtaining initial certificate...";
          certbot certonly --webroot -w "$WEBROOT" $DOMAINS \
            --email "$EMAIL" --agree-tos --non-interactive || true;
          docker kill -s HUP nginx || true;
        fi;
      
        # Renew forever; reload nginx after successful renewals
        while :; do
          certbot renew --webroot -w "$WEBROOT" --quiet \
            --deploy-hook "docker kill -s HUP nginx" || true;
          sleep 12h;
        done
      '

networks:
  frontback:
  database:

volumes:
  letsencrypt:
  certbot-www:
  db_data:

configs:
  nginx_default_conf:
    file: ./nginx/nginx.conf