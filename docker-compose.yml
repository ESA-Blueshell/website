services:
  apigateway:
    build:
      context: .
      dockerfile: ./APIGateway/Dockerfile
      args:
        - SERVICE_NAME=APIGateway
    ports:
      - "8080:8080"
    depends_on:
      - blogservice
      - emailparser
      - eventparser
      - socialmediaservice
      - telemetry
  blogservice:
    build:
      context: .
      dockerfile: ./BlogService/Dockerfile
      args:
        - SERVICE_NAME=BlogService
    ports:
      - "8081:8080"
  emailparser:
    build:
      context: .
      dockerfile: ./EmailParser/Dockerfile
      args:
        - SERVICE_NAME=EmailParser
    ports:
      - "8082:8080"
  eventparser:
    build:
      context: .
      dockerfile: ./EventParser/Dockerfile
      args:
        - SERVICE_NAME=EventParser
    ports:
      - "8083:8080"
  socialmediaservice:
    build:
      context: .
      dockerfile: ./SocialMediaService/Dockerfile
      args:
        - SERVICE_NAME=SocialMediaService
    ports:
      - "8084:8080"
  telemetry:
    build:
      context: .
      dockerfile: ./Telemetry/Dockerfile
      args:
        - SERVICE_NAME=Telemetry
    ports:
      - "8085:8080"