services:
  apigateway:
    build:
      context: .
      dockerfile: ./APIGateway/Dockerfile
      args:
        - PORT=80
    ports:
      - "80:80"
      - "5005:5005"
    depends_on:
      - blogservice
      - emailparser
      - eventparser
      - socialmediaservice
      - telemetry
  blogservice:
    build:
      context: .
      dockerfile: ./BlogService/Dockerfile
      args:
        - PORT=8081
    ports:
      - "8081:8081"
      - "5006:5005"
  emailparser:
    build:
      context: .
      dockerfile: ./EmailParser/Dockerfile
      args:
        - PORT=8082
    ports:
      - "8082:8082"
      - "5007:5005"
  eventparser:
    build:
      context: .
      dockerfile: ./EventParser/Dockerfile
      args:
        - PORT=8083
    ports:
      - "8083:8083"
      - "5008:5005"
  socialmediaservice:
    build:
      context: .
      dockerfile: ./SocialMediaService/Dockerfile
      args:
        - PORT=8084
    ports:
      - "8084:8084"
      - "5009:5005"
  telemetry:
    build:
      context: .
      dockerfile: ./Telemetry/Dockerfile
      args:
        - PORT=8085
    ports:
      - "8085:8085"
      - "5010:5005"