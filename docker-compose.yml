services:
  db:
    image: mariadb:10.11.10
    container_name: db
    networks:
      - database
    volumes:
      - db_data:/var/lib/mysql
      # Optional: seed only on first run if volume is empty. Remove if not needed.
      # - "./env/dump.sql:/docker-entrypoint-initdb.d/init.sql"
    env_file:
      - ./env/.db.env
    command: --log-bin-trust-function-creators=1
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    container_name: api
    build:
      context: api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/.db.env
      - ./env/.app.env
    volumes:
      - "./storage:/home/storage"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontback
      - database
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    container_name: frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    networks:
      - frontback
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontback
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf

  certbot:
    image: certbot/certbot
    container_name: certbot
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # One-shot obtain/force-renew to initialize certs (run once, or when rotating domains)
    command: >
      certonly --webroot
      -w /var/www/certbot
      --force-renewal
      --non-interactive
      --agree-tos
      --email board@blueshell.utwente.nl
      -d esa-blueshell.nl

  certbot-renew:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew monthly; using a simple sleep loop
    command: >
      sh -c '
        while true; do
          certbot renew --webroot -w /var/www/certbot --non-interactive || true;
          sleep 30d;
        done
      '

networks:
  frontback:
  database:

volumes:
  letsencrypt:
  certbot-www:
  db_data:

configs:
  nginx_default_conf:
    file: ./nginx/nginx.conf