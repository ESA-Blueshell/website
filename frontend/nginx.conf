server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /service-worker.js { try_files $uri =404; add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }

  location = /healthz { add_header Content-Type text/plain; return 200 "ok"; }
}
