#cloud-config
# =============================================================================
# Standalone cloud-init for Contabo stock Debian 13.
# No pre-baked Packer image required — provision.sh is embedded (base64) and
# runs on first boot.  Instance-specific items (keys, passwords, GHCR) are
# rendered by render.sh into cloud-config.yaml.
#
# Boot sequence:
#   init   → groups, users, chpasswd  (users + SSH keys created)
#   config → package_update/upgrade, packages, write_files  (provision.sh + env files dropped to disk)
#   final  → runcmd  (provision.sh runs, then GHCR login + git clone + rootless docker + auto-deploy)
#
# First-boot time: ~10–15 minutes (including stack deployment).
# =============================================================================
ssh_pwauth: false
package_update: true
package_upgrade: true

# ── Create groups BEFORE users so admin can join them ───────────────────────
groups:
  - website
  - backup

# ── Pre-install base packages (Docker is installed by provision.sh via its
#    own APT repo — it cannot be in this list since the source isn't added yet)
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - openssh-client
  - openssh-server
  - cron
  - mariadb-client
  - whois
  - rsync
  - dbus-user-session
  - uidmap
  - slirp4netns
  - fuse-overlayfs
  - ufw
  - sudo

# ── Users ────────────────────────────────────────────────────────────────────
users:
  - name: admin
    lock_passwd: false
    shell: /bin/bash
    sudo: ALL=(ALL) ALL
    groups: sudo, docker, website, backup
    ssh_authorized_keys:
      - "__ADMIN_SSH_PUB__"

  - name: website
    lock_passwd: false
    shell: /bin/bash
    sudo: ""
    home: /src/website
    primary_group: website
    groups: website
    ssh_authorized_keys:
      - "__WEBSITE_SSH_PUB__"

# ── Passwords (console / cloud-portal login only; SSH is keys-only) ──────────
# Passwords are SHA-512 crypt hashes (generated by render.sh); cloud-init
# applies them with type 'hash' so the plaintext never appears in user-data.
chpasswd:
  expire: false
  users:
    - { name: admin,     password: '__ADMIN_PASSWORD__',     type: 'hash' }
    - { name: root,      password: '__ROOT_PASSWORD__',      type: 'hash' }
    - { name: website,   password: '__WEBSITE_PASSWORD__',   type: 'hash' }

# ── Drop provision.sh + env files to disk ────────────────────────────────────
write_files:
  - path: /usr/local/bin/provision.sh
    permissions: '0750'
    owner: root:root
    encoding: b64
    content: __PROVISION_SH_B64__

  - path: /src/website/services/api/.db.env
    permissions: '0640'
    owner: website:website
    encoding: b64
    content: __DB_ENV_B64__

  - path: /src/website/services/api/.api.env
    permissions: '0640'
    owner: website:website
    encoding: b64
    content: __API_ENV_B64__

  - path: /src/website/services/listmonk/.listmonk.env
    permissions: '0640'
    owner: website:website
    encoding: b64
    content: __LISTMONK_ENV_B64__

  - path: /src/website/infra/.infra.env
    permissions: '0640'
    owner: website:website
    encoding: b64
    content: __INFRA_ENV_B64__

# ── Runtime commands ─────────────────────────────────────────────────────────
runcmd:
  # 1) System provisioning: installs Docker, hardens SSH, configures UFW,
  #    sets up backup scripts, CLI tool, and cron job.
  - /usr/local/bin/provision.sh

  # 2) Ensure website is NOT in the docker group (uses rootless only)
  - gpasswd -d website docker || true

  # 3) Clone repo (skip if already present — e.g. after a restore)
  - |
    if [ ! -d /src/website/.git ]; then
      git clone https://github.com/ESA-Blueshell/website.git /src/website
    fi
  - chown -R website:website /src/website
  - chmod -R 770 /src/website

  # 4) Install & start rootless Docker engine for the website user
  - su -l website -c "dockerd-rootless-setuptool.sh install || true"
  - loginctl enable-linger website
  - su -l website -c "systemctl --user daemon-reload"
  - su -l website -c "systemctl --user enable --now docker"
  - su -l website -c "systemctl --user restart docker.socket"

  # 4b) Initialise Docker Swarm (single-node manager) and create shared overlay networks
  - su -l website -c "docker swarm init --advertise-addr 127.0.0.1"
  - su -l website -c "docker network create --driver overlay --attachable traefik-public"
  - su -l website -c "docker network create --driver overlay --attachable monitoring"

  # 5) Log in to GHCR so the website user can pull private images
  - su -s /bin/bash - website -c "printf '%s\n' '__GHCR_TOKEN__' | docker login ghcr.io -u '__GHCR_USERNAME__' --password-stdin"

  # 6) Restart services that provision.sh reconfigured
  - systemctl restart cron
  - systemctl restart ssh

  # 7) Deploy infrastructure stack (uses local env files — no Infisical yet)
  - su -l website -c "website infra up"

  # 8) Wait for Infisical to be healthy, then bootstrap it (best-effort)
  - su -l website -c "bash /src/website/scripts/infisical-bootstrap.sh || echo 'Infisical bootstrap skipped — system running on local env files. Run manually later if needed.'"

  # 9) Deploy application stack
  - su -l website -c "website up"

final_message: |
  ========================================
  Cloud-init setup complete — stacks deployed automatically!

  Security:
  - SSH on port 2222, keys-only authentication
  - Website user runs Docker in ROOTLESS mode (no sudo needed)
  - Docker Swarm initialised (single-node manager)
  - Shared overlay networks created: traefik-public, monitoring
  - Backups owned by root:backup (2770 perms); website user cannot read/delete
  - admin requires password for sudo

  Operators:
  - Admin user:   admin      (SSH keys, sudo with password)
  - Website user: website    (no sudo, rootless Docker + Swarm)

  Tooling:
  - Website user logged into ghcr.io
  - Repository cloned to /src/website
  - Full backups (MariaDB + Listmonk PG + env + storage) at 3 AM daily

  VERIFY:
  1) Check stack services:
     su -l website -c "docker stack services infra"
     su -l website -c "docker stack services website"

  2) SSL certificates are obtained automatically by Traefik on first request
     (DNS must point to the server first — see services/README.md)

  3) Configure Uptime Kuma monitors at https://status.esa-blueshell.nl

  4) Verify backup after 03:00 or run now (as root or admin via sudo):
     sudo /usr/local/bin/db-backup && ls -l /src/backups/db

  Full deployment docs: /src/website/services/README.md
  ========================================
