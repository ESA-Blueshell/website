# =============================================================================
# infra/docker-stack.yml — Shared infrastructure stack for Docker Swarm.
#
# Deployed once (per server) by infra/deploy.sh:
#   docker stack deploy -c infra/docker-stack.yml infra
#
# Services:
#   socket-proxy  — read-only Docker API proxy for Traefik and Promtail
#   traefik       — TLS edge proxy, ACME certs, routes to all environments
#   prometheus    — metrics scraper (Spring Boot actuator + Traefik)
#   grafana       — dashboards and alerting (accessible at grafana.<domain>)
#   loki          — log aggregation backend
#   promtail      — log shipper (reads Docker container logs via socket-proxy)
#   uptime-kuma   — external uptime monitoring (accessible at status.<domain>)
#
# Variables exported by infra/deploy.sh:
#   DOCKER_SOCKET                — rootless Docker socket path
#   GRAFANA_ADMIN_PASSWORD       — Grafana admin password
#   GRAFANA_DISCORD_WEBHOOK_URL  — Discord webhook for alert notifications
#   GRAFANA_SMTP_HOST            — SMTP host for email alerts (optional)
#   GRAFANA_SMTP_USER            — SMTP username (optional)
#   GRAFANA_SMTP_PASSWORD        — SMTP password (optional)
#   GRAFANA_SMTP_FROM            — From address for alert emails (optional)
#
# Networks:
#   traefik-public — external overlay; all app stacks attach here for routing
#   monitoring     — external overlay; Prometheus scrapes api + Traefik
#   socket-proxy   — internal overlay; only socket-proxy + traefik + promtail
# =============================================================================

services:

  # ── Docker socket proxy ────────────────────────────────────────────────────
  # Exposes a constrained subset of the Docker API over TCP.
  # Traefik uses it for Swarm service discovery; Promtail uses it to read logs.
  # Nothing else ever touches the raw Docker socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS:   1
      EVENTS:     1
      # Swarm service discovery (required for Traefik swarm provider)
      SERVICES:   1
      TASKS:      1
      # Everything else defaults to 0 (denied):
      # AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EXEC, IMAGES,
      # INFO, NODES, PING, POST, PLUGINS, SECRETS, SESSION, SWARM,
      # SYSTEM, VOLUMES
    networks:
      - socket-proxy
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ── Traefik edge proxy ─────────────────────────────────────────────────────
  # HTTP→HTTPS redirect, ACME TLS certs, routes based on Swarm service labels.
  traefik:
    image: traefik:v3.3
    ports:
      - target:    80
        published: 80
        mode:      host   # bypass ingress mesh on single node
      - target:    443
        published: 443
        mode:      host
      # metrics (:8082) and ping (:8083) are not published — only reachable
      # within the monitoring overlay network by Prometheus and Uptime Kuma.
    volumes:
      - /src/website/infra/traefik.yml:/traefik.yml:ro
      - letsencrypt:/letsencrypt
      # No Docker socket — Traefik talks to socket-proxy over TCP
    networks:
      - traefik-public
      - socket-proxy
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - /src/website/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    networks:
      - monitoring
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD:     ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_SECURITY_ADMIN_USER:         admin
      GF_SERVER_ROOT_URL:             https://grafana.esa-blueshell.nl
      GF_USERS_ALLOW_SIGN_UP:         "false"
      GF_ALERTING_ENABLED:            "false"   # use unified alerting
      GF_UNIFIED_ALERTING_ENABLED:    "true"
      # Discord contact point (alert notifications)
      GF_DISCORD_WEBHOOK_URL:         ${GRAFANA_DISCORD_WEBHOOK_URL:-}
      # Optional SMTP for email alerts (set GRAFANA_SMTP_HOST to enable)
      GF_SMTP_ENABLED:                ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST:                   ${GRAFANA_SMTP_HOST:-localhost:587}
      GF_SMTP_USER:                   ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD:               ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS:           ${GRAFANA_SMTP_FROM:-grafana@esa-blueshell.nl}
      GF_INSTALL_PLUGINS:             ""
    volumes:
      - grafana-data:/var/lib/grafana
      - /src/website/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - /src/website/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - traefik-public
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.infra-grafana.rule=Host(`grafana.esa-blueshell.nl`)"
        - "traefik.http.routers.infra-grafana.entrypoints=websecure"
        - "traefik.http.routers.infra-grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.infra-grafana.loadbalancer.server.port=3000"

  # ── Loki ───────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.5.0
    volumes:
      - /src/website/infra/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

  # ── Promtail ───────────────────────────────────────────────────────────────
  # Ships Docker container logs to Loki via the Docker API (through socket-proxy).
  promtail:
    image: grafana/promtail:3.5.0
    volumes:
      - /src/website/infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
      - socket-proxy
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M

  # ── Uptime Kuma ────────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - traefik-public
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.infra-uptime.rule=Host(`status.esa-blueshell.nl`)"
        - "traefik.http.routers.infra-uptime.entrypoints=websecure"
        - "traefik.http.routers.infra-uptime.tls.certresolver=letsencrypt"
        - "traefik.http.services.infra-uptime.loadbalancer.server.port=3001"

networks:
  traefik-public:
    external: true
  monitoring:
    external: true
  socket-proxy:
    driver: overlay
    internal: true   # no internet access; only infra services communicate here

volumes:
  letsencrypt:
    # Fixed name — survives stack redeploys; shared between Traefik instances
    name: traefik_letsencrypt
  prometheus-data:
  grafana-data:
  loki-data:
  uptime-kuma-data:
