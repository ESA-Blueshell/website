apiVersion: 1

contactPoints:
  - orgId: 1
    name:  Discord
    receivers:
      - uid:  discord-primary
        type: discord
        settings:
          url: "${GF_DISCORD_WEBHOOK_URL}"
          message: |
            {{ range .Alerts }}
            **[{{ .Status | toUpper }}] {{ .Labels.alertname }}**
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}

  - orgId: 1
    name:  Email
    receivers:
      - uid:  email-board
        type: email
        settings:
          addresses: "${GF_ALERT_EMAIL:-sitecie@blueshell.utwente.nl}"
          singleEmail: false

policies:
  - orgId: 1
    receiver: Discord
    group_by: [alertname, service]
    group_wait:      30s
    group_interval:  5m
    repeat_interval: 4h
    routes:
      - receiver: Discord
        match:
          severity: critical
        repeat_interval: 1h
