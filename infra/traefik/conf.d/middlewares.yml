# Traefik dynamic configuration — shared middleware definitions.
# Loaded by the file provider (providers.file.directory: /etc/traefik/conf.d).
# Reference from Swarm labels as: middlewareName@file

http:
  middlewares:

    # ── Compression ────────────────────────────────────────────────────────────
    # Gzip + Brotli compression for API JSON, frontend HTML/JS/CSS.
    # minResponseBodyBytes avoids compressing tiny responses where overhead > gain.
    compress:
      compress:
        minResponseBodyBytes: 1024

    # ── Security response headers ───────────────────────────────────────────────
    # Applied globally to the websecure entryPoint (infra/traefik.yml).
    # HSTS is included here rather than as a separate entryPoint-level header.
    secureHeaders:
      headers:
        frameDeny: true                                    # X-Frame-Options: DENY
        contentTypeNosniff: true                           # X-Content-Type-Options: nosniff
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        stsSeconds: 31536000                               # HSTS: 1 year
        stsIncludeSubdomains: true
        customResponseHeaders:
          X-XSS-Protection: "1; mode=block"
          Content-Security-Policy: >-
            default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob:;
            font-src 'self';
            connect-src 'self';
            frame-ancestors 'none'
