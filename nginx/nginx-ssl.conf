# ----- helpers --------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend    {  server frontend:3000;   }
upstream api         {  server api:8080;        }
upstream listmonk    {  server listmonk:9000;   }

# ----- plain HTTP (must be reachable for ACME) ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name esa-blueshell.nl www.esa-blueshell.nl;
    server_tokens off;

    # Serve ACME HTTP-01 without redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;   # make sure this is shared with certbot
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS (canonicalize to apex)
    location / {
        return 301 https://esa-blueshell.nl$request_uri;
    }
}

# ----- HTTPS / reverse-proxy ------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name esa-blueshell.nl www.esa-blueshell.nl;

    ssl_certificate     /etc/letsencrypt/live/esa-blueshell.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esa-blueshell.nl/privkey.pem;

    # redirect www → apex
    if ($host = www.esa-blueshell.nl) {
        return 301 https://esa-blueshell.nl$request_uri;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass         http://api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ----- Postal admin UI -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name listmonk.esa-blueshell.nl;

    ssl_certificate     /etc/letsencrypt/live/esa-blueshell.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esa-blueshell.nl/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass         http://listmonk;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
