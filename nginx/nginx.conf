# ----- helpers --------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {  server frontend:3000; }
upstream api      {  server api:8080;     }

# ----- plain HTTP (must be reachable for ACME) ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name esa-blueshell.nl www.esa-blueshell.nl;
    server_tokens off;

    # Serve ACME HTTP-01 without redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;   # make sure this is shared with certbot
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS (canonicalize to apex)
    location / {
        return 301 https://esa-blueshell.nl$request_uri;
    }
}

# ----- HTTPS / reverse-proxy ------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esa-blueshell.nl www.esa-blueshell.nl;

    # Use LE certs once issued (temporary self-signed is fine until then)
    ssl_certificate     /etc/letsencrypt/live/esa-blueshell.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esa-blueshell.nl/privkey.pem;

    # redirect www → apex
    if ($host = www.esa-blueshell.nl) {
        return 301 https://esa-blueshell.nl$request_uri;
    }

    # nice-to-have headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    client_max_body_size 50m;

    # (Optional) also serve ACME on HTTPS if someone follows a redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # ---------- API ---------------------------------------------------------
    location /api/ {
        proxy_pass         http://api/;  # keep trailing slash
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # ---------- Front-end (everything else) --------------------------------
    location / {
        proxy_pass         http://frontend;  # path preserved
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
