# allow proper handling of WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server frontend:3000;
}

upstream api-gateway {
    server api-gateway:8080;
}

server {
    listen 80;
    server_name localhost;

    # redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen              443 ssl;      # no longer: "listen 443 ssl http2"
    listen              [::]:443 ssl;
    http2 on;                         # enable HTTP/2 as its own directive :contentReference[oaicite:0]{index=0}

    server_name         localhost;

    # TLS certs (self‑signed)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # security headers (optional)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 50m;

    # API proxy
    location /api/ {
        # strip /api/ from the front
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://api-gateway;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # Frontend proxy (everything else)
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
