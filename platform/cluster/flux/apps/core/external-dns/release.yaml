apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  # The Deployment references secret `cloudflare-api-token` which is
  # materialised by VSO from Vault. During cluster bootstrap that
  # Secret doesn't exist yet (Vault isn't installed until apps-data,
  # and apps-data depends on apps-core). If the initial Helm install
  # runs before an operator pre-seeds the Secret, the Deployment never
  # becomes Ready and Flux's default single-retry stalls the
  # HelmRelease permanently. Infinite retries let it self-heal once
  # the Secret lands, no manual `flux reconcile --force` needed.
  #
  # disableWait so this HelmRelease reports Ready as soon as Helm
  # finishes the chart install — without it, Helm's own
  # `--wait` blocks for the full timeout while the pod is in
  # CreateContainerConfigError, which keeps apps-core stuck Pending
  # and (transitively) every downstream Kustomization. The pod
  # crashloops on its own; once VSO syncs the Secret it recovers.
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1
  values:
    provider:
      name: cloudflare
    sources:
      - service
      - traefik-proxy
    env:
      # Injected by VSO from secret/data/platform/edge (see the VSO
      # secrets PR). Keeping the reference as a plain secretKeyRef means
      # external-dns stays out of the Vault agent injection story.
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
      # Only touch DNS records for ingresses marked for the public
      # Traefik. LAN-only / internal services never get published.
      - --annotation-filter=kubernetes.io/ingress.class=traefik-public
      # Zone-wide. We manage one-label admin hosts directly under
      # `esa-blueshell.nl` (auth, kube, mail-admin, status, vault)
      # rather than two-label hosts under `*.v2.esa-blueshell.nl`,
      # because Cloudflare's free Universal SSL edge cert only covers
      # one label deep (`*.esa-blueshell.nl`). Policy stays upsert-only
      # (external-dns default) so apex records managed outside the
      # cluster — old-VPS apex A/AAAA, MX/SPF/DKIM — are never touched.
      - --domain-filter=esa-blueshell.nl
      - --txt-owner-id=blueshell-website-production
