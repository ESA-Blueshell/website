apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: ingress-system
  values:
    # Force Recreate on upgrade. The chart default is RollingUpdate
    # with maxSurge=1/maxUnavailable=0, which on this single-node
    # cluster guarantees a deadlock: the new pod is scheduled before
    # the old one is killed, but only one pod can hold hostPort 80
    # and 443. The new pod stays Pending with
    # `FailedScheduling: didn't have free ports for the requested pod
    # ports` until the Helm upgrade times out, the HelmRelease goes
    # to `Failed`, and apps-core cascade-blocks every downstream
    # Kustomization. Recreate accepts a brief 80/443 gap on the node
    # in exchange for an upgrade path that actually completes.
    deployment:
      kind: Deployment
      strategy:
        type: Recreate
        rollingUpdate: null
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik-public
    ingressRoute:
      dashboard:
        enabled: true
    # Healthcheck endpoint on the `traefik` entrypoint (exposed as
    # K8s Service port 8080 in chart 39.x — dashboard, API, and ping
    # all share that one port). Gatus probes /ping internally to
    # confirm Traefik is alive without going through the dashboard
    # IngressRoute (which sits behind forward-auth and would only
    # ever 302 an anonymous prober). Chart 39.x removed the top-level
    # `ping:` key — enable via the static-config CLI flag instead.
    additionalArguments:
      - "--ping=true"
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        enabled: true
        ingressClass: traefik-public
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-public
        publishedService:
          enabled: true
    # No MetalLB / LoadBalancer assignment on this single-node cluster.
    # Cloudflare points esa-blueshell.nl and the one-label admin
    # hosts (auth/kube/mail-admin/status.esa-blueshell.nl) straight at
    # the node's public IP via external-dns; Traefik binds hostPort
    # 80/443 directly on the node. Service type stays ClusterIP.
    service:
      type: ClusterIP
      annotations:
        external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
      traefik:
        # ClusterIP-only — exposes the `traefik` entrypoint on the K8s
        # Service (port 8080 in chart 39.x) so Gatus can hit /ping from
        # inside the cluster. The dashboard itself is reachable from
        # outside via the traefik-dashboard IngressRoute (forward-auth
        # gated), not this port.
        expose:
          default: true
