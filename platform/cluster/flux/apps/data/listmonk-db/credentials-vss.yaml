# Bitnami PostgreSQL chart reads listmonk-db-credentials.postgres-password
# and .password at startup. VSO syncs them from secret/listmonk (seeded
# by the operator via scripts/seed-vault-from-env.sh — see
# platform/docs/vault-bootstrap.md).
#
# Lives next to the HelmRelease so apps-data is self-bootstrapping: VSO
# materialises the Secret in-place once Vault is unsealed and the
# bootstrap Job has wired up the vso role, the chart upgrade unblocks
# without a manual k8s Secret pre-seed.
#
# The default-namespace `listmonk-secrets` (admin creds + SMTP password
# the Listmonk pod consumes) stays in apps-vso-secrets — that secret is
# only needed once apps-stateless reconciles, well after apps-data has
# settled.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: listmonk-db-credentials
  namespace: data-system
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: listmonk
  destination:
    name: listmonk-db-credentials
    create: true
    transformation:
      templates:
        postgres-password:
          text: '{{- get .Secrets "db-admin-password" -}}'
        password:
          text: '{{- get .Secrets "db-password" -}}'
  refreshAfter: 1h
