apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: listmonk-db
  namespace: data-system
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "16.x"
      # Bitnami moved postgresql to an OCI-only registry; the legacy
      # HTTP index at charts.bitnami.com advertises an `oci://` URL that
      # the HTTP-typed `bitnami` HelmRepository can't follow. Use the
      # OCI-typed source declared in bitnami-oci-source.yaml.
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: data-system
  # The StatefulSet references existingSecret `listmonk-db-credentials`
  # which is materialised by VSO from Vault (apps/vso-secrets/listmonk-secrets.yaml).
  # During bootstrap that Secret doesn't exist yet and the pod stays in
  # ContainerCreating until it appears. retries: -1 makes Flux retry
  # the Helm install until the Secret shows up, rather than parking
  # Stalled after one failure.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    auth:
      database: listmonk
      username: listmonk
      # Credentials seeded into Vault at secret/listmonk by the operator,
      # then synced here by VSO (see apps/vso-secrets/listmonk-secrets.yaml).
      existingSecret: listmonk-db-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      persistence:
        enabled: true
        size: 5Gi
