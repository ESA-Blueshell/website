# Bitnami MariaDB chart reads mariadb-credentials.mariadb-root-password
# and mariadb-credentials.mariadb-password at startup. VSO syncs them
# from secret/platform/mariadb (seeded by the operator via
# scripts/seed-vault-from-env.sh — see platform/docs/vault-bootstrap.md).
#
# This CR lives next to the HelmRelease, not in apps-vso-secrets, so a
# clean install does not need a manual k8s Secret pre-seed: VSO syncs
# the Secret as soon as Vault is unsealed and the bootstrap Job has
# wired up the kubernetes auth role for VSO. The Bitnami chart upgrade
# then succeeds on its own.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mariadb-credentials
  namespace: data-system
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/mariadb
  destination:
    name: mariadb-credentials
    create: true
    transformation:
      templates:
        mariadb-root-password:
          text: '{{- get .Secrets "root-password" -}}'
        mariadb-password:
          text: '{{- get .Secrets "password" -}}'
  refreshAfter: 1h
