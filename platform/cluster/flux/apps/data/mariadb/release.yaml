apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: data-system
spec:
  interval: 30m
  chart:
    spec:
      chart: mariadb
      version: "18.2.6"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: data-system
  # Bitnami moved all free-tier container images from docker.io/bitnami
  # to docker.io/bitnamilegacy in August 2025 (paid subscription now
  # required for the original namespace). The chart still pins the old
  # `bitnami/mariadb:...` reference, so without overriding image.repository
  # the StatefulSet pod hits ImagePullBackOff. The tag itself still
  # exists under bitnamilegacy.
  #
  # retries: -1 — never park Stalled on a transient install race
  # (first boot sometimes hits a client rate limiter from helm-controller
  # and the default maxRetries=1 gives up too early).
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    image:
      repository: bitnamilegacy/mariadb
      # MariaDB 10.11.10, the version the schema was taken from. Chart
      # 18.x defaults to MariaDB 11.x, whose stricter DDL (a `MODIFY
      # COLUMN` on a column a foreign key references is ERROR 1832) the
      # changesets have never been run against. CI's service blocks in
      # .github/workflows/validate.yml, services/api/docker-compose.yml
      # and scripts/changeset-sql.sh run this same version; renovate.json
      # holds them there. Moving off this frozen image is #1738.
      tag: 10.11.10-debian-12-r4
    auth:
      database: blueshell
      username: blueshell
      # Root password and api user password are seeded into Vault at
      # secret/platform/mariadb by the operator before first apply, then
      # synced here by VSO (see apps/data/mariadb/credentials-vss.yaml).
      existingSecret: mariadb-credentials
    primary:
      persistence:
        enabled: true
        size: 10Gi
    secondary:
      replicaCount: 0
