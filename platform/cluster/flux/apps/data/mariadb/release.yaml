apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: data-system
spec:
  interval: 30m
  chart:
    spec:
      chart: mariadb
      version: "18.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: data-system
  # Bitnami moved all free-tier container images from docker.io/bitnami
  # to docker.io/bitnamilegacy in August 2025 (paid subscription now
  # required for the original namespace). The chart still pins the old
  # `bitnami/mariadb:...` reference, so without overriding image.repository
  # the StatefulSet pod hits ImagePullBackOff. The tag itself still
  # exists under bitnamilegacy.
  #
  # retries: -1 — never park Stalled on a transient install race
  # (first boot sometimes hits a client rate limiter from helm-controller
  # and the default maxRetries=1 gives up too early).
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    image:
      repository: bitnamilegacy/mariadb
      # Pin MariaDB 10.11 LTS to match the old VPS and the rest of the
      # codebase (docker-compose.yml, CI workflows, services/api/docker-
      # compose.dev.yml — all pinned to mariadb:10.11.10). Bitnami chart
      # 18.x defaults to MariaDB 11.x, which tightened a number of DDL
      # rules (e.g. refusing `MODIFY COLUMN` on a column referenced by a
      # foreign key — ERROR 1832) that our Flyway V28 migration
      # `constraints-cleanup-hibernate-realignment` relies on. Without
      # this pin the api crashloops on first boot against a fresh DB.
      tag: 10.11.10-debian-12-r4
    auth:
      database: blueshell
      # Root password and api user password are seeded into Vault at
      # secret/platform/mariadb by the operator before first apply, then
      # synced here by VSO (see apps/vso-secrets/mariadb-credentials.yaml).
      existingSecret: mariadb-credentials
    primary:
      persistence:
        enabled: true
        size: 10Gi
    secondary:
      replicaCount: 0
