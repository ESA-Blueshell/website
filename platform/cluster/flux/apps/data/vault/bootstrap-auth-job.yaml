apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap-auth
  namespace: data-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-bootstrap-auth-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-bootstrap-auth
    namespace: data-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap-auth
  namespace: data-system
  # Job.spec.template is immutable, so when the hashed vault-bootstrap-auth
  # ConfigMap name changes (content hash drift on bootstrap-auth.sh), a
  # plain `kubectl apply` would fail with "field is immutable". This
  # annotation tells the Flux Kustomization controller to delete and
  # recreate the Job when its spec diverges — the whole point of the
  # configMapGenerator hash is that every bootstrap-auth.sh edit forces
  # a fresh Job run.
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-bootstrap-auth
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vault-bootstrap-auth
      # Its only credential is a short token meant for Vault alone, so a copy of it opens nothing
      # else and no other token for this account signs in to Vault.
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: hashicorp/vault
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /bootstrap/bootstrap.sh
          env:
            - name: VAULT_ADDR
              value: http://vault-v2.data-system.svc.cluster.local:8200
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 600
                  path: token
        - name: bootstrap
          configMap:
            name: vault-bootstrap-auth
            defaultMode: 493
