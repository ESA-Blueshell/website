# The Vault that replaces `vault` (#2392): that one was initialised with a single unseal key,
# which is lost, so it can never be unsealed again once its pod restarts. scripts/migrate-vault.sh
# fills this one from it. Until the switch, nothing but the script talks to it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-v2
  namespace: data-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: data-system
  values:
    ui:
      enabled: true
    injector:
      enabled: false
    # Nothing mounts a SecretProviderClass, and a second provider would take the old one's socket.
    csi:
      enabled: false
    server:
      readinessProbe:
        enabled: true
        timeoutSeconds: 10
      dataStorage:
        enabled: true
        size: 5Gi
      auditStorage:
        enabled: true
        size: 5Gi
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = 1
            }

            storage "raft" {
              path = "/vault/data"
            }

            service_registration "kubernetes" {}
