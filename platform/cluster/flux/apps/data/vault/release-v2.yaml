# Blueshell's Vault, 5-of-3 Shamir. It replaced the first release, `vault`, whose single unseal
# key was lost (#2392); the name stays, since every client and the PVCs carry it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-v2
  namespace: data-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: data-system
  values:
    ui:
      enabled: true
    injector:
      enabled: false
    # Nothing mounts a SecretProviderClass.
    csi:
      enabled: false
    server:
      readinessProbe:
        enabled: true
        timeoutSeconds: 10
      dataStorage:
        enabled: true
        size: 5Gi
      auditStorage:
        enabled: true
        size: 5Gi
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = 1
            }

            storage "raft" {
              path = "/vault/data"
            }

            service_registration "kubernetes" {}
