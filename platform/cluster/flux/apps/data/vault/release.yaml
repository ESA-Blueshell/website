apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: data-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: data-system
  values:
    ui:
      enabled: true
    injector:
      enabled: true
      # One replica (the chart default) plus the chart's *required*
      # pod anti-affinity is a rolling update that cannot finish on a
      # single node: the replacement pod may not sit beside the pod it
      # replaces, so it stays Pending with `FailedScheduling: didn't
      # match pod anti-affinity rules` and the release stalls. It had
      # been stalled that way since 2026-08-13. Recreate lets the old
      # pod go first; the injector is a mutating webhook for new pods,
      # so a gap delays pod admission rather than breaking traffic.
      strategy:
        type: Recreate
    csi:
      enabled: true
    server:
      readinessProbe:
        enabled: true
        timeoutSeconds: 10
      dataStorage:
        enabled: true
        size: 5Gi
      auditStorage:
        enabled: true
        size: 5Gi
      # Single-replica HA + Raft is the simplest Vault topology that
      # still produces a Raft cluster; a future node addition is a
      # `peer add` away without data migration. Standalone mode is
      # deliberately avoided because it cannot later be promoted to
      # HA without a fresh init.
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = 1
            }

            storage "raft" {
              path = "/vault/data"
            }

            service_registration "kubernetes" {}
