apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: edge-system
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: edge-system
  annotations:
    # No DNS record of our own — the frontend IngressRoute already
    # publishes `v2.esa-blueshell.nl`. We just piggy-back on that
    # host with path-based rules that win over frontend's catch-all.
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  # Same-origin OIDC. Spring Authorization Server's `issuer` setting
  # advertises every endpoint nested under /api (so jwks_uri etc. are
  # https://v2.esa-blueshell.nl/api/oauth2/jwks), but Spring still
  # serves them at root paths internally — we strip /api before the
  # backend sees the request.
  #
  # Two routes on this host:
  #   - OIDC paths under /api/* with StripPrefix(/api), priority 100
  #   - Plain REST /api/* without strip,                priority 50
  # frontend.yaml's `Host(v2)` catch-all keeps default priority and
  # naturally falls below both.
  routes:
    - kind: Rule
      priority: 100
      # Single line on purpose: Traefik's rule parser rejects embedded
      # newlines, and YAML folded scalars (>-) preserve them when
      # subsequent lines are more-indented than the first.
      match: Host(`v2.esa-blueshell.nl`) && (PathPrefix(`/api/oauth2`) || PathPrefix(`/api/userinfo`) || Path(`/api/.well-known/openid-configuration`) || Path(`/api/.well-known/oauth-authorization-server`))
      middlewares:
        - name: strip-api-prefix
          namespace: edge-system
      services:
        - name: api
          namespace: default
          port: 8080
    - kind: Rule
      priority: 50
      match: Host(`v2.esa-blueshell.nl`) && PathPrefix(`/api`)
      services:
        - name: api
          namespace: default
          port: 8080
  tls: {}
