apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: edge-system
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: edge-system
  annotations:
    # No DNS record of our own — the frontend IngressRoute already
    # publishes `esa-blueshell.nl`. We just piggy-back on that
    # host with path-based rules that win over frontend's catch-all.
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  # Same-origin /api/*. Spring Authorization Server's `issuer` setting
  # advertises every endpoint nested under /api (jwks_uri etc. are
  # https://esa-blueshell.nl/api/oauth2/jwks), but every controller
  # in the api is mapped at root paths — `/health`, `/events`,
  # `/me/services`, `/oauth2/...`. We strip the `/api` prefix uniformly
  # before forwarding so REST paths reach their controllers AND the
  # SecurityFilterChain matchers (which permit `/health`, `/events/**`,
  # `/csrf`, `/contributionPeriods/current`, ...) actually fire.
  #
  # One rule stated three times, on purpose -- change one and change the
  # others: this middleware, the `/api` location in
  # services/frontend/nginx.conf, and the dev-server proxy in
  # services/frontend/vite.config.mjs. These routes win on /api/* here, so
  # nginx's own copy is never consulted in production.
  #
  # Two routes:
  #   - OIDC paths under /api/* — priority 100, kept distinct in case
  #     a future change wants a different middleware on this subset.
  #   - Plain REST /api/*       — priority 50, catch-all under /api.
  # Both apply `strip-api-prefix`. frontend.yaml pins its catch-all
  # to an explicit `priority: 1` so these routes always win on /api/*
  # — Traefik's default priority is the rule string length, which can
  # otherwise exceed 50 once a Host matcher grows.
  routes:
    - kind: Rule
      priority: 100
      # Single line on purpose: Traefik's rule parser rejects embedded
      # newlines, and YAML folded scalars (>-) preserve them when
      # subsequent lines are more-indented than the first.
      match: Host(`esa-blueshell.nl`) && (PathPrefix(`/api/oauth2`) || PathPrefix(`/api/userinfo`) || Path(`/api/.well-known/openid-configuration`) || Path(`/api/.well-known/oauth-authorization-server`))
      middlewares:
        - name: strip-api-prefix
          namespace: edge-system
      services:
        - name: api
          namespace: default
          port: 8080
    - kind: Rule
      priority: 50
      match: Host(`esa-blueshell.nl`) && PathPrefix(`/api`)
      middlewares:
        - name: strip-api-prefix
          namespace: edge-system
      services:
        - name: api
          namespace: default
          port: 8080
  tls: {}
