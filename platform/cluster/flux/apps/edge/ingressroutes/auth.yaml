apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth
  namespace: edge-system
  annotations:
    # One label deep — `*.esa-blueshell.nl` (CF Universal SSL + our
    # Let's Encrypt wildcard) both cover it, so CF proxy stays on.
    external-dns.alpha.kubernetes.io/target: 157.173.115.164,2a02:c207:2316:2642::1
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.esa-blueshell.nl`)
      services:
        - name: api
          namespace: default
          port: 8080
  tls: {}
