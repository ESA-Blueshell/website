apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mta-sts
  namespace: edge-system
  annotations:
    external-dns.alpha.kubernetes.io/target: 157.173.115.164
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    # Sending servers fetch this anonymously, so no forward-auth. Only
    # the policy path is exposed; the rest of port 8080 is the admin UI.
    - kind: Rule
      match: Host(`mta-sts.esa-blueshell.nl`) && Path(`/.well-known/mta-sts.txt`)
      services:
        - name: stalwart
          namespace: mail-system
          port: 8080
  tls: {}
