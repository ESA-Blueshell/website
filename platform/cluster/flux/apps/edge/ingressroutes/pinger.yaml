apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pinger
  namespace: edge-system
  annotations:
    external-dns.alpha.kubernetes.io/target: 157.173.115.164,2a02:c207:2316:2642::1
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    # MEMBER in ForwardAuthController.HOST_ROLE. Saving settings asks the api again for ADMIN.
    - kind: Rule
      match: Host(`pings.esa-blueshell.nl`)
      middlewares:
        - name: forward-auth
          namespace: edge-system
      services:
        - name: pinger
          namespace: default
          port: 8090
  tls: {}
