apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stalwart-admin
  namespace: edge-system
  annotations:
    # One label deep — CF Universal SSL covers it, proxy stays on.
    external-dns.alpha.kubernetes.io/target: 157.173.115.164,2a02:c207:2316:2642::1
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    # Stalwart's HTTP admin/webadmin UI is served at the root of
    # port 8080. The dedicated host removes the path-prefix coupling
    # and lets users land on the default UI without remembering the
    # suffix.
    - kind: Rule
      match: Host(`stalwart.esa-blueshell.nl`)
      middlewares:
        - name: forward-auth
          namespace: edge-system
      services:
        - name: stalwart
          namespace: mail-system
          port: 8080
  tls: {}
