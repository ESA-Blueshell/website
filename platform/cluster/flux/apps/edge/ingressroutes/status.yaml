apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: status
  namespace: edge-system
  annotations:
    # One label deep — CF Universal SSL covers it, proxy stays on.
    external-dns.alpha.kubernetes.io/target: 157.173.115.164,2a02:c207:2316:2642::1
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    # Status page is deliberately public — no forward-auth. The whole
    # point is that an outside observer (including logged-out users)
    # can see whether the stack is up.
    # Read-only from outside: the page and its API only answer GET, and refusing every other
    # method keeps the internet from pushing a backup result whatever spelling the path takes.
    - kind: Rule
      match: Host(`status.esa-blueshell.nl`) && (Method(`GET`) || Method(`HEAD`))
      services:
        - name: gatus
          namespace: utility-system
          port: 80
  tls: {}
