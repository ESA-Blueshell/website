apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-esa-blueshell-nl
  namespace: edge-system
spec:
  secretName: esa-blueshell-nl-tls
  commonName: esa-blueshell.nl
  # One cert covers:
  #   - apex `esa-blueshell.nl`               (main site)
  #   - `*.esa-blueshell.nl`                  (admin hosts: auth, kube,
  #                                            mail-admin, status,
  #                                            vault, traefik; plus the
  #                                            v2.esa-blueshell.nl
  #                                            grace-period fallback —
  #                                            wildcard matches one
  #                                            label deep, so this
  #                                            covers it without
  #                                            adding a SAN)
  #
  # ACME DNS-01 uses the Cloudflare API token stored at
  # secret/data/platform/edge.cloudflare-api-token; the Cloudflare
  # zone token needs Zone:DNS:Edit scoped to esa-blueshell.nl.
  dnsNames:
    - esa-blueshell.nl
    - '*.esa-blueshell.nl'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: edge-system
spec:
  defaultCertificate:
    secretName: esa-blueshell-nl-tls
