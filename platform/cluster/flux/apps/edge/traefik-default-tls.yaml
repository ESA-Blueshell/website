apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-v2-esa-blueshell-nl
  namespace: edge-system
spec:
  secretName: v2-esa-blueshell-nl-tls
  commonName: v2.esa-blueshell.nl
  # Wildcard covers every single-level subdomain under v2. ACME DNS-01
  # uses the Cloudflare API token stored at
  # secret/data/platform/edge.cloudflare-api-token; the Cloudflare zone
  # token needs Zone:DNS:Edit scoped to esa-blueshell.nl.
  dnsNames:
    - v2.esa-blueshell.nl
    - '*.v2.esa-blueshell.nl'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: edge-system
spec:
  defaultCertificate:
    secretName: v2-esa-blueshell-nl-tls
