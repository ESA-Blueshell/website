apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: edge-system
spec:
  forwardAuth:
    # The website api exposes /oauth2/forward-auth as its forward-auth
    # endpoint once the OIDC issuer lands. Until then, IngressRoutes
    # that attach this Middleware will 502 — that is intentional, it
    # prevents accidentally exposing an admin host before auth is wired.
    #
    # The api lives in the `default` namespace; see the stateless apps
    # PR that follows for the Service. If the api moves namespace, the
    # address here and in the k3s OIDC issuer URL must move together.
    address: http://api.default.svc.cluster.local:8080/oauth2/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-User-Id
      - X-User-Groups
