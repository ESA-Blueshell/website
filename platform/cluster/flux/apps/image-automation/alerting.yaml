# Flux posts to Discord only when something fails. A release announces itself
# from CI (release.yml) and a rollout from Flagger, so a success here would be
# the third message about the same deploy.
#
# Same Discord webhook Flagger and Gatus use, from the same Vault path. The
# vault-secrets-operator ServiceAccount in flux-system is declared next to the
# ghcr mirror in vso-secrets/ghcr.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alerting-discord
  namespace: flux-system
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/alerting
  destination:
    name: alerting-discord
    create: true
    transformation:
      excludes:
        - '.*'
      excludeRaw: true
      templates:
        address:
          text: '{{- get .Secrets "discord.webhook_url" -}}'
  refreshAfter: 1h
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  username: Blueshell cluster
  secretRef:
    name: alerting-discord
---
# error, not info: at info every reconcile that waits on a dependency or pushes
# a deploy commit reaches Discord. At error what arrives is a failed apply or
# health check, a push the automation could not make, or a registry scan it
# could not run.
#
# Every Kustomization, since a failure in any one of them blocks the ones
# behind it. HelmReleases are listed per namespace because an Alert matches
# sources in its own namespace unless told otherwise.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: failures
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: ImageRepository
      name: '*'
    - kind: ImageUpdateAutomation
      name: '*'
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: data-system
    - kind: HelmRelease
      name: '*'
      namespace: external-dns
    - kind: HelmRelease
      name: '*'
      namespace: flagger-system
    - kind: HelmRelease
      name: '*'
      namespace: ingress-system
    - kind: HelmRelease
      name: '*'
      namespace: utility-system
    - kind: HelmRelease
      name: '*'
      namespace: vso-system
