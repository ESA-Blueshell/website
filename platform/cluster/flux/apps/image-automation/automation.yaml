# A second GitRepository, identical to flux-system except for its credential.
# image-automation-controller pushes with the key its sourceRef names, so
# pointing it at flux-system would mean giving source-controller write access
# to reconcile with. This one clones with the write key and nothing else uses
# it; no Kustomization reconciles from it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system-write
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: main
  secretRef:
    name: flux-image-automation
  url: ssh://git@github.com/ESA-Blueshell/website
---
# Which version of each image counts as the newest released one.
#
# `sha-` tags are published by every push to main and must never be selected,
# which the filter does by construction: only a tag matching `v<semver>` is
# considered at all, and the `version` capture is what the semver range sees.
#
# digestReflectionPolicy records the digest beside the tag, so the manifest
# names an immutable image rather than a tag a later build could move. That is
# the property the digest pin was introduced to provide.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: api
  digestReflectionPolicy: IfNotPresent
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: frontend
  digestReflectionPolicy: IfNotPresent
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stalwart-tools
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: stalwart-tools
  digestReflectionPolicy: IfNotPresent
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
---
# What deploys a release. A scan finds the version a release published, this
# commits the reference to the overlay, and kustomize-controller rolls it out.
#
# One automation for every overlay, so api and frontend are written in a single
# commit and cannot reach the cluster apart. `update.path` still confines
# writes to the app overlays; nothing under clusters/ is ever rewritten.
#
# [ci skip] in the message, because a push to main triggers four workflows and
# a one-line tag bump under platform/ gives all four nothing to do. Coverage
# survives the skip: the baseline job finds no pull request for the commit and
# leaves the artifact alone, and the reader takes the newest artifact main
# uploaded rather than one keyed to a sha.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system-write
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux
        email: flux@esa-blueshell.nl
      # `.Changed`, not `.Updated`: the latter was removed and the controller
      # refuses the template outright rather than rendering it empty, so the
      # run fails after the file is rewritten and nothing is ever pushed.
      #
      # Only `.Changed.Changes` is used. `.Changed.FileChanges` and
      # `.Changed.Objects` would read well here, but a template this controller
      # rejects fails silently: the automation still reports Ready and simply
      # never pushes. This is the one shape proven against v1.1.4 in production.
      messageTemplate: |
        chore(deploy): roll the cluster onto the newest released images

        Written by image-automation-controller, not by a person. A release
        published new version tags, the ImagePolicies selected them, and the
        setters in the app overlays were rewritten to name them. Merging is
        not what deploys a release; this commit is.

        Each line is one setter, as the reference the overlay named before and
        the one it names now. A reference carries both the version tag and the
        digest that tag resolved to, so the cluster runs an exact image rather
        than whatever the tag points at later.

        {{ range .Changed.Changes -}}
        {{ .OldValue }} -> {{ .NewValue }}
        {{ end }}
        Rolling this back is not a revert: the next scan reselects the highest
        released version and writes it again. Suspend the automation first, see
        "Rolling back under automation" in platform/docs/runbook.md.

        The trailer below stops CI, because there is nothing to build: the
        images already exist, built and tagged by the release that published
        them, and no path in this commit matches a build filter.

        [ci skip]
    push:
      branch: main
  update:
    path: ./platform/cluster/flux/apps
    strategy: Setters
