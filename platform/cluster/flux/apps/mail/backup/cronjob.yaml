# Vault's kubernetes auth binds role `backup-store` to this account (apps/data/vault/bootstrap-auth.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: mail-system
---
# Enough to stop and start Stalwart around the snapshot, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup
  namespace: mail-system
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [stalwart]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup
  namespace: mail-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: mail-system
---
# Every night Stalwart is stopped, its RocksDB store snapshotted straight from its volume and
# Stalwart started again: RocksDB must not be copied while open. Mail is down for a minute or
# two; senders retry, so nothing is lost. Gatus's Stalwart probe has a maintenance window for it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: mail-system
spec:
  schedule: '30 3 * * *'
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The snapshot step starts Stalwart again on the SIGTERM this deadline sends.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
        spec:
          restartPolicy: Never
          serviceAccountName: backup
          # Stalwart's own user, so Kopia can read the store it wrote.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: collect
              image: hashicorp/vault:1.21
              imagePullPolicy: IfNotPresent
              command: [sh, /scripts/collect.sh]
              env:
                - name: VAULT_ROLE
                  value: backup-store
                - name: VAULT_ADDR
                  value: http://vault.data-system.svc.cluster.local:8200
                - name: HOME
                  value: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
            - name: stop
              image: curlimages/curl:8.22.0
              imagePullPolicy: IfNotPresent
              command: [sh, /scripts/stalwart.sh, stop]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: snapshot
              image: kopia/kopia:0.23.1
              imagePullPolicy: IfNotPresent
              command: [bash, /scripts/snapshot.sh]
              env:
                - name: BACKUP_GROUPS
                  value: stalwart=/stalwart
                - name: FINALLY
                  value: sh /scripts/stalwart.sh start
                - name: BACKUP_BUCKET
                  value: esa-blueshell-backups
                - name: BACKUP_ENDPOINT
                  value: s3.nl-ams.scw.cloud
                - name: BACKUP_REGION
                  value: nl-ams
                - name: GATUS_PUSH_BASE
                  value: http://gatus.utility-system.svc.cluster.local/api/v1/endpoints/backups_
                - name: KOPIA_CONFIG_PATH
                  value: /work/kopia/repository.config
                - name: KOPIA_CACHE_DIRECTORY
                  value: /work/kopia/cache
                - name: KOPIA_LOG_DIR
                  value: /work/kopia/logs
                - name: HOME
                  value: /work
                - name: TMPDIR
                  value: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1536Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: stalwart
                  mountPath: /stalwart
                  readOnly: true
          volumes:
            # In memory: the night's credentials never touch the node's disk.
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: stalwart
              persistentVolumeClaim:
                claimName: stalwart-data
                readOnly: true
