apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # mail-system namespace is created by apps-vso-secrets so the
  # stalwart-secrets VaultStaticSecret has a namespace to land in before
  # apps-mail reconciles (apps-mail depends on apps-vso-secrets).
  - stalwart

# Pinned by digest, the same as api and frontend, and hand-edited for the same
# reason until #1438 lands. Nothing polls a moving tag.
images:
  - name: ghcr.io/esa-blueshell/stalwart-tools
    digest: sha256:2decae2f21f45b6e8bfbb8d33c101648b2c443f98ebb94e229c55f063aecda16
