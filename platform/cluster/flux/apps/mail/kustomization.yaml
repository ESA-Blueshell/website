apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # mail-system namespace is created by apps-vso-secrets so the
  # stalwart-secrets VaultStaticSecret has a namespace to land in before
  # apps-mail reconciles (apps-mail depends on apps-vso-secrets).
  - stalwart
# Written by image-automation-controller, the same as api and frontend, and the
# same shape: a readable version tag with the digest it named beside it, so the
# cluster runs an image no later build can move.
#
# This carried a bare digest from a `sha-` build before, naming no release at
# all, which is why the retired pin check reported its version as `-`.
#
# To change it by hand, suspend the automation first or the next scan reverts
# it. See "Rolling back under automation" in the runbook.
images:
  - name: ghcr.io/esa-blueshell/stalwart-tools
    newTag: v1.9.0 # {"$imagepolicy": "flux-system:stalwart-tools:tag"}
    digest: sha256:0fc1cc0ec0f0a7ff8ade418f19307fe8237152e5df633d695a3391317946843b # {"$imagepolicy": "flux-system:stalwart-tools:digest"}
