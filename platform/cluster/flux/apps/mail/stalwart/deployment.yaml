apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart
  namespace: mail-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-data
  namespace: mail-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: mail-system
  # Keel rolls the pod when a new stalwart-tools :latest is published
  # (apply.sh / plan / accounts changes). The main stalwart container is
  # pinned to a version tag so match-tag leaves it alone.
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: 'true'
    keel.sh/trigger: poll
    keel.sh/pollSchedule: '@every 2m'
spec:
  replicas: 1
  # Mail server state lives in the RocksDB PVC; two replicas would race
  # on the same files. Recreate is correct for single-replica stateful
  # pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      serviceAccountName: stalwart
      # Mail protocols are raw TCP and can't traverse Cloudflare's HTTP
      # proxy. stalwart.esa-blueshell.nl is a non-proxied A record
      # pointing at the Frankfurt VPS public IP; each mail port binds on
      # the host via hostPort, which only works if the pod is scheduled
      # on the public-IP node.
      nodeSelector:
        kubernetes.io/hostname: frankfurt-contabo-1
      # The stalwart-tools image is published private under
      # ghcr.io/esa-blueshell/, same as api / frontend. Without this
      # secret the apply sidecar ImagePullBackOffs, and the pod's
      # readiness probe never passes because the sidecar is part of the
      # pod's combined ready state.
      imagePullSecrets:
        - name: ghcr-pull-secret
      # The PVC carries over from the v0.15 deployment, which ran as
      # root and left every file in /var/lib/stalwart owned by uid 0.
      # v0.16 runs as uid 2000 and can't write to those files, so the
      # main container crashes at boot with
      # `Permission denied: /var/lib/stalwart/data/LOG`. Chown the
      # mount once per pod start as uid 0 (the init container is its
      # own securityContext). Cheap on a clean tree, fixes the v0.15
      # carry-over PVC on the very first boot of v0.16.
      initContainers:
        - name: stalwart-data-perms
          image: busybox:1.37-musl
          command:
            - sh
            - -c
            - 'chown -R 2000:2000 /var/lib/stalwart'
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: stalwart-data
              mountPath: /var/lib/stalwart
      containers:
        # Stalwart reads /etc/stalwart/config.json (datastore pointer
        # only) on boot; everything else is reconciled by the apply
        # sidecar. The webui bundle is fetched from github.com on first
        # boot, so the node needs outbound HTTPS.
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.6
          imagePullPolicy: IfNotPresent
          env:
            # Despite the name, this is Stalwart's canonical env var for
            # seeding a fallback administrator credential — the apply
            # sidecar authenticates as this admin to call the management
            # API. Rotating the secret rolls the pod via the VSS
            # rolloutRestartTarget on stalwart-secrets.
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: STALWART_RECOVERY_ADMIN
          ports:
            - containerPort: 25
              hostPort: 25
              name: smtp
            - containerPort: 110
              hostPort: 110
              name: pop3
            - containerPort: 143
              hostPort: 143
              name: imap
            - containerPort: 465
              hostPort: 465
              name: submissions
            - containerPort: 587
              hostPort: 587
              name: submission
            - containerPort: 993
              hostPort: 993
              name: imaptls
            - containerPort: 995
              hostPort: 995
              name: pop3s
            - containerPort: 4190
              hostPort: 4190
              name: sieve
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: stalwart-data
              mountPath: /var/lib/stalwart
            - name: stalwart-config-json
              mountPath: /etc/stalwart/config.json
              subPath: config.json
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        # Reconciles the declarative settings Stalwart stores in its
        # datastore (listeners, domain wiring, ACME/DNS providers,
        # Vault-managed accounts) and refreshes the Cloudflare DNS-01
        # token in the store on every pod start. Idles after a
        # successful pass.
        - name: stalwart-apply
          image: ghcr.io/esa-blueshell/stalwart-tools:latest
          command: ['sh', '/opt/stalwart-tools/apply.sh']
          env:
            - name: STALWART_URL
              value: http://127.0.0.1:8080
            # The hostname Stalwart advertises in auto-published DNS
            # records (SRV / MX / autodiscover / autoconfig / MTA-STS).
            # `mail.esa-blueshell.nl` is non-Cloudflare-proxied per the
            # infra/dns zone — mail protocols are raw TCP and can't
            # traverse Cloudflare's HTTP proxy, so any client (Outlook,
            # Thunderbird, our own api) needs an unproxied target.
            # `stalwart.esa-blueshell.nl` exists for the admin UI and
            # is proxied; pointing autodiscovery at it would break
            # IMAPS/SMTP submission at TLS.
            - name: STALWART_HOSTNAME
              value: mail.esa-blueshell.nl
            - name: STALWART_DOMAIN
              value: esa-blueshell.nl
            # Vault keys follow the `account.<localpart>` convention.
            # `account.admin` is the password for the fallback admin
            # principal seeded by STALWART_RECOVERY_ADMIN on the main
            # container; its username is the literal localPart `admin`.
            - name: STALWART_USER
              value: admin
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: account.admin
            - name: CF_DNS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          # accounts.json names a `vaultKey` per principal (e.g.
          # `account.api`). The whole stalwart-secrets Secret is
          # projected here read-only; apply.sh reads
          # `/etc/stalwart-accounts/<vaultKey>` to get each password.
          # Adding a new managed account is one accounts.json entry
          # plus one new Vault key — no env-block edits.
          volumeMounts:
            - name: stalwart-account-passwords
              mountPath: /etc/stalwart-accounts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: stalwart-data
          persistentVolumeClaim:
            claimName: stalwart-data
        - name: stalwart-config-json
          configMap:
            name: stalwart-config-json
        - name: stalwart-account-passwords
          secret:
            secretName: stalwart-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: mail-system
spec:
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: pop3
      port: 110
      targetPort: pop3
    - name: imap
      port: 143
      targetPort: imap
    - name: submissions
      port: 465
      targetPort: submissions
    - name: submission
      port: 587
      targetPort: submission
    - name: imaptls
      port: 993
      targetPort: imaptls
    - name: pop3s
      port: 995
      targetPort: pop3s
    - name: sieve
      port: 4190
      targetPort: sieve
    - name: http
      port: 8080
      targetPort: http
