apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pure k8s manifests. The reconcile script, plan template and accounts
# manifest live in the stalwart-tools image (source under infra/stalwart),
# not in a ConfigMap — Keel rolls the Deployment when the image updates.
resources:
  - config-json-configmap.yaml
  - deployment.yaml
