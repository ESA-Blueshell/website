apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: api
  namespace: default
spec:
  provider: kubernetes
  # Deleting this Canary scales the Deployment back up, not leaves it at zero.
  revertOnDeletion: true
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  # Flagger owns the api, api-primary and api-canary Services from here. The
  # IngressRoute keeps pointing at `api`, held on the primary pods.
  service:
    port: 8080
    portName: http
    targetPort: http
  # Matches the Deployment: a cold Spring Boot start on a fresh image pull.
  progressDeadlineSeconds: 900
  analysis:
    # Blue/green, not weighted traffic shifting: iterations without stepWeight.
    # Four 30s rounds of acceptance tests against api-canary before promotion.
    interval: 30s
    iterations: 4
    threshold: 3
    metrics:
      - name: error-rate
        templateRef:
          name: error-rate
        thresholdRange:
          max: 5
        interval: 1m
      - name: latency
        templateRef:
          name: latency
        thresholdRange:
          max: 2000
        interval: 1m
    # Promotion, rollback and a held gate all reach Discord at info.
    alerts:
      - name: discord
        severity: info
        providerRef:
          name: discord
          namespace: flagger-system
    webhooks:
      # Runs once the canary pod is Ready, before anything is promoted. A Job
      # left Failed is deleted first, or the gate would refuse this tag forever.
      - name: migrate-the-schema
        type: pre-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 660s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*[:@]//; s/[^a-zA-Z0-9]/-/g' | tr 'A-Z' 'a-z' | cut -c1-20); job=migrate-$tag; prev=$(kubectl -n default get job $job -o jsonpath='{.status.failed}' 2>/dev/null); if [ -n "$prev" ] && [ "$prev" != 0 ]; then echo "$job failed before; deleting it so this release can retry"; kubectl -n default delete job $job --wait=true; fi; kubectl -n default get job $job >/dev/null 2>&1 || kubectl -n default create job $job --from=cronjob/db-migrate || { echo "could not create $job"; exit 1; }; end=$(( $(date +%s) + 540 )); while [ $(date +%s) -lt $end ]; do ok=$(kubectl -n default get job $job -o jsonpath='{.status.succeeded}' 2>/dev/null); [ "$ok" = 1 ] && echo "$job complete" && exit 0; bad=$(kubectl -n default get job $job -o jsonpath='{.status.failed}' 2>/dev/null); [ -n "$bad" ] && [ "$bad" != 0 ] && break; sleep 5; done; echo "$job did not complete; last 40 lines:"; kubectl -n default logs job/$job --tail=40 2>&1; exit 1

      - name: read-only-load
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        # Six paths, so each run has to fit six times over inside the timeout.
        timeout: 60s
        metadata:
          type: bash
          cmd: >-
            for p in /health /boards /esports/games /esports/teams /blogs /contributionPeriods/current; do
            hey -z 3s -q 3 -c 2 -H 'X-Forwarded-Proto: https' "http://api-canary.default:8080${p}";
            done

      - name: canary-answers-http
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            curl -sf -H 'X-Forwarded-Proto: https'
            http://api-canary.default:8080/health | grep -q true

      # The rendezvous: each side holds until the other is out of Progressing
      # and not Failed. A failing gate parks rather than burning the threshold.
      - name: wait-for-frontend
        type: confirm-promotion
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            phase=$(kubectl -n default get canary frontend -o jsonpath='{.status.phase}');
            echo "frontend=$phase";
            [ "$phase" != Progressing ] && [ "$phase" != Failed ]

      # Ready is not changed: a promotion that kept the old pods reads healthy
      # and serves yesterday's build.
      - name: serves-the-version-it-was-promoted-to
        type: post-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy api-primary -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*:\(v[^@]*\).*/\1/; s/^v//'); served=$(curl -sf -H 'X-Forwarded-Proto: https' http://api.default:8080/version | jq -r .version); echo "promoted=$tag served=$served"; [ -n "$served" ] && [ "$tag" = "$served" ]
