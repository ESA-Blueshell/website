apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: api
  namespace: default
spec:
  provider: kubernetes
  # Deleting this Canary scales the Deployment back up, not leaves it at zero.
  revertOnDeletion: true
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  # Flagger owns the api, api-primary and api-canary Services from here. The
  # IngressRoute keeps pointing at `api`, held on the primary pods.
  service:
    port: 8080
    portName: http
    targetPort: http
  # Matches the Deployment: a cold Spring Boot start on a fresh image pull.
  progressDeadlineSeconds: 900
  analysis:
    # Blue/green, not weighted traffic shifting: iterations without stepWeight.
    # Four 30s rounds of acceptance tests against api-canary before promotion.
    interval: 30s
    iterations: 4
    threshold: 3
    metrics:
      - name: error-rate
        templateRef:
          name: error-rate
        thresholdRange:
          max: 5
        interval: 1m
      - name: latency
        templateRef:
          name: latency
        thresholdRange:
          max: 2000
        interval: 1m
    # Promotion, rollback and a held gate all reach Discord at info.
    alerts:
      - name: discord
        severity: info
        providerRef:
          name: discord
          namespace: flagger-system
    webhooks:
      # Runs before Flagger scales the canary up, so a release may read its own
      # schema at startup. Flagger calls it every interval until it exits 0; a
      # Failed Job parks the release in Waiting until someone deletes the Job.
      - name: migrate-the-schema
        type: confirm-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 660s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*[:@]//; s/[^a-zA-Z0-9]/-/g' | tr 'A-Z' 'a-z' | cut -c1-20); job=migrate-$tag; kubectl -n default get job $job >/dev/null 2>&1 || kubectl -n default create job $job --from=cronjob/db-migrate || { echo "could not create $job"; exit 1; }; bad=; end=$(( $(date +%s) + 540 )); while [ $(date +%s) -lt $end ]; do ok=$(kubectl -n default get job $job -o jsonpath='{.status.succeeded}' 2>/dev/null); [ "$ok" = 1 ] && echo "$job complete" && exit 0; bad=$(kubectl -n default get job $job -o jsonpath='{.status.failed}' 2>/dev/null); [ -n "$bad" ] && [ "$bad" != 0 ] && break; sleep 5; done; if [ -n "$bad" ] && [ "$bad" != 0 ]; then echo "$job failed; delete it to retry this tag. Last 40 lines:"; kubectl -n default logs job/$job --tail=40 2>&1; else echo "$job is still running; the next call waits on it"; fi; exit 1

      # The metrics take a rate over a minute of the canary's own requests, scraped every 15s,
      # so without traffic before the first check they answer nothing and the check fails
      # (#1961). This also warms the JVM before the latency check reads it.
      - name: warm-the-canary
        type: pre-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 90s
        metadata:
          type: bash
          cmd: >-
            for p in /health /boards /esports/games /esports/teams /blogs /contributionPeriods/current; do
            hey -z 8s -q 3 -c 2 -H 'X-Forwarded-Proto: https' "http://api-canary.default:8080${p}";
            done

      - name: read-only-load
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        # Six paths, so each run has to fit six times over inside the timeout.
        timeout: 60s
        metadata:
          type: bash
          cmd: >-
            for p in /health /boards /esports/games /esports/teams /blogs /contributionPeriods/current; do
            hey -z 3s -q 3 -c 2 -H 'X-Forwarded-Proto: https' "http://api-canary.default:8080${p}";
            done

      - name: canary-answers-http
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            curl -sf -H 'X-Forwarded-Proto: https'
            http://api-canary.default:8080/health | grep -q true

      # The rendezvous: each side holds until the other is waiting on this gate or
      # past it. An image the other side has not promoted yet also holds: the
      # api's first migrate call runs before Flagger leaves Succeeded. A failing
      # gate parks rather than burning the threshold.
      - name: wait-for-frontend
        type: confirm-promotion
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            phase=$(kubectl -n default get canary frontend -o jsonpath='{.status.phase}');
            want=$(kubectl -n default get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}');
            have=$(kubectl -n default get deploy frontend-primary -o jsonpath='{.spec.template.spec.containers[0].image}');
            echo "frontend=$phase canary=$want primary=$have";
            case "$phase" in
            Waiting|Progressing|Failed) exit 1;;
            WaitingPromotion|Promoting|Finalising) exit 0;;
            *) [ "$want" = "$have" ];;
            esac

      # Ready is not changed: a promotion that kept the old pods reads healthy
      # and serves yesterday's build.
      - name: serves-the-version-it-was-promoted-to
        type: post-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy api-primary -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*:\(v[^@]*\).*/\1/; s/^v//'); served=$(curl -sf -H 'X-Forwarded-Proto: https' http://api.default:8080/version | jq -r .version); echo "promoted=$tag served=$served"; [ -n "$served" ] && [ "$tag" = "$served" ]
