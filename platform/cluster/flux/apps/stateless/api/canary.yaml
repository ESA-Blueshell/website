apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: api
  namespace: default
spec:
  provider: kubernetes
  # Deleting this Canary scales the Deployment back up, not leaves it at zero.
  revertOnDeletion: true
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  # Flagger owns the api, api-primary and api-canary Services from this block.
  # The Traefik IngressRoute keeps pointing at `api`, which Flagger holds on
  # the primary pods except during a promotion.
  service:
    port: 8080
    portName: http
    targetPort: http
  # Matches the Deployment: a cold Spring Boot start on a fresh image pull.
  progressDeadlineSeconds: 900
  analysis:
    # Blue/green, not weighted traffic shifting: iterations without stepWeight.
    # Four 30s rounds of acceptance tests against api-canary before promotion.
    interval: 30s
    iterations: 4
    threshold: 3
    metrics:
      - name: error-rate
        templateRef:
          name: error-rate
        thresholdRange:
          max: 5
        interval: 1m
      - name: latency
        templateRef:
          name: latency
        thresholdRange:
          max: 2000
        interval: 1m
    webhooks:
      # The schema moves once per release, before a canary pod exists. A failure
      # here stops the rollout with nothing having changed.
      - name: migrate-the-schema
        type: pre-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 660s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*[:@]//; s/[^a-zA-Z0-9]/-/g' | tr 'A-Z' 'a-z' | cut -c1-20); job=migrate-$tag; kubectl -n default get job $job >/dev/null 2>&1 || kubectl -n default create job $job --from=cronjob/db-migrate; for i in $(seq 1 120); do s=$(kubectl -n default get job $job -o jsonpath='{.status.conditions[0].type}' 2>/dev/null); [ "$s" = Complete ] && echo "$job complete" && exit 0; [ "$s" = Failed ] && break; sleep 5; done; echo "$job did not complete; last 40 lines:"; kubectl -n default logs job/$job --tail=40 2>&1; exit 1

      - name: read-only-load
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 30s
        metadata:
          type: bash
          cmd: >-
            for p in /health /boards /esports/games /esports/teams /blogs /contributionPeriods/current; do
            hey -z 20s -q 3 -c 2 -H 'X-Forwarded-Proto: https' "http://api-canary.default:8080${p}";
            done

      - name: canary-answers-http
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            curl -sf -H 'X-Forwarded-Proto: https'
            http://api-canary.default:8080/health | grep -q true

      # The rendezvous. Both Canaries hold here until the other one is out of
      # Progressing and not Failed, so the release promotes as a pair or not at
      # all. A gate that keeps failing holds the phase at WaitingPromotion
      # without burning the failure threshold, so a broken frontend parks the
      # api instead of shipping half a release.
      - name: wait-for-frontend
        type: confirm-promotion
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            phase=$(kubectl -n default get canary frontend -o jsonpath='{.status.phase}');
            echo "frontend=$phase";
            [ "$phase" != Progressing ] && [ "$phase" != Failed ]

      # Ready is not the same as changed: a promotion that kept the old pods
      # reports healthy and serves yesterday's build. Both sides come from the
      # cluster, so nothing has to be told what was released.
      - name: serves-the-version-it-was-promoted-to
        type: post-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy api-primary -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://; s/^v//'); served=$(curl -sf -H 'X-Forwarded-Proto: https' http://api.default:8080/version | jq -r .version); echo "promoted=$tag served=$served"; [ -n "$served" ] && [ "$tag" = "$served" ]
