apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  # No `replicas`: Flagger scales this Deployment between 0 and 1 around a
  # canary run, and a value here would make Flux reset it every 2 minutes.
  #
  # Zero-downtime rollout: bring a second pod up first (maxSurge=1) and only
  # tear the old one down once the new pod's readiness probe reports
  # ACCEPTING_TRAFFIC (maxUnavailable=0). A broken image — failed Flyway
  # migration, Vault token miss, anything that keeps /actuator/health/readiness
  # red — never displaces the healthy old pod, so the rollout stalls instead of
  # taking the api offline.
  #
  # progressDeadlineSeconds is generous: a Spring Boot cold start takes minutes.
  # The image exists before the release merges, so it is not waiting on a pull.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      # ghcr.io/esa-blueshell/api is a private package; the pull secret
      # is materialised by VSO from Vault (secret/platform/ghcr) — see
      # platform/cluster/flux/apps/vso-secrets/ghcr.yaml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          # Tag comes from the images block in ../kustomization.yaml.
          image: ghcr.io/esa-blueshell/api
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -XX:+UseZGC
            - -XX:+AlwaysPreTouch
            - -XX:MaxRAMPercentage=75
            - -jar
            - /app/app.jar
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Secrets are not set here: the prod profile reads them from Vault as
            # this pod's ServiceAccount (api ADR-033).
            - name: MYSQL_HOST
              value: mariadb.data-system.svc.cluster.local
            - name: MYSQL_PORT
              value: '3306'
            - name: VALKEY_HOST
              value: valkey.data-system.svc.cluster.local
            - name: VALKEY_PORT
              value: '6379'
            - name: APP_URL
              value: https://esa-blueshell.nl/api
            - name: FRONTEND_URL
              value: https://esa-blueshell.nl
            # Scopes BSH_AUTH (and the SESSION cookie) to every subdomain of
            # esa-blueshell.nl so Traefik forwardAuth on
            # vault/headlamp/stalwart/traefik can authenticate the user.
            # No leading dot: per RFC 6265 `Domain=esa-blueshell.nl` already
            # covers all subdomains, and a leading dot makes Spring Session's
            # cookie serializer throw (Invalid cookie domain) on every request.
            - name: AUTH_COOKIE_DOMAIN
              value: esa-blueshell.nl
            - name: STORAGE_LOCATION
              value: /srv/storage
            # SMTP transport — relay through Stalwart via its public
            # mail hostname. The traffic still terminates on the same
            # Frankfurt VPS (hairpin through the public IP) but the
            # JavaMail client validates the cert SAN against the
            # connect host, and the wildcard ACME cert covers
            # `mail.esa-blueshell.nl` while in-cluster Service DNS is
            # not in the cert. Using the public name keeps strict
            # TLS verification on without bypass flags.
            - name: SMTP_HOST
              value: mail.esa-blueshell.nl
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_STARTTLS
              value: 'true'
            - name: EMAIL_FROM_ADDRESS
              value: no-reply@esa-blueshell.nl
            - name: EMAIL_FROM_NAME
              value: Blueshell
            - name: EMAIL_REPLY_TO_ADDRESS
              value: sitecie@esa-blueshell.nl
            # The bounce mailbox: the api sends and polls as it, with its
            # password from Vault, so undelivered mail comes back here (#1868).
            - name: EMAIL_BOUNCE_IMAP_HOST
              value: mail.esa-blueshell.nl
            - name: EMAIL_BOUNCE_IMAP_PORT
              value: '993'
            - name: EMAIL_BOUNCE_IMAP_TLS
              value: 'true'
            - name: EMAIL_BOUNCE_IMAP_FOLDER
              value: INBOX
            - name: EMAIL_BOUNCE_IMAP_USERNAME
              value: bounce@esa-blueshell.nl
            - name: AUTH_TRANSIT_ENABLED
              value: 'true'
            - name: AUTH_TRANSIT_KEY_NAME
              value: api-jwt
          ports:
            - containerPort: 8080
              name: http
            # Spring Boot actuator runs on a separate management port
            # (management.server.port=8081 in application.yaml). Probes
            # target this port so they bypass the main filter chain's
            # HTTPS redirect entirely; SecurityConfig.actuatorChain
            # additionally permits unauthenticated access to /actuator/**.
            - containerPort: 8081
              name: management
          # Real HTTP health probes against Spring Boot's
          # /actuator/health/{liveness,readiness} group endpoints.
          # Tomcat binding alone (the old tcpSocket probe) said nothing
          # about whether Flyway, Hibernate, Vault and the OAuth2
          # Authorization Server had finished initializing — the api
          # was being marked Ready while in-flight requests still hit
          # half-initialized beans. The actuator probes are wired to
          # Spring's AvailabilityState, which only flips to
          # ACCEPTING_TRAFFIC after the ApplicationStartedEvent fires
          # and all HealthIndicators (db, diskSpace, ping, …) report UP.
          #
          # startupProbe is generous on purpose: cold boot with Flyway
          # migrations, Hibernate metadata scan, and Vault Agent
          # sidecar handshake can take several minutes on first deploy
          # of a new image, and we'd rather Kubernetes wait than
          # crashloop a healthy-but-slow pod. failureThreshold * period
          # = 5s * 180 = 15 minutes before the kubelet gives up.
          # Once startup optimisation work lands, this can be tightened.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 180
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /srv/storage
      # The api image runs as an Alpine `-S` system user with a
      # dynamic uid that changes across image rebuilds, so we can't
      # fsGroup our way onto the hostPath mount. Instead, on every
      # pod start, walk the volume and force directories to 0777 and
      # regular files to 0666 (u+rwX,g+rwX,o+rwX — capital X means
      # +x only on directories and already-executable files). This
      # makes Files.move into subdirectories like event-banners/
      # succeed regardless of which dynamic uid wrote them last, and
      # the setgid bit on directories keeps newly-created subdirs
      # group-consistent. The init container runs as root on every
      # pod restart, so reboots and clean reinstalls converge to a
      # working state without manual intervention. Traversal from
      # outside is still gated by /srv/blueshell (0755 root:root,
      # owned by systemd-tmpfiles on the node).
      initContainers:
        - name: storage-perms
          image: busybox:1.37-musl
          command:
            - sh
            - -c
            - |
              set -e
              chmod -R u+rwX,g+rwX,o+rwX /srv/storage
              find /srv/storage -type d -exec chmod g+s {} +
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: /srv/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: api-storage
