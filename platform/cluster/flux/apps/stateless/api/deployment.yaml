apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
  annotations:
    # Keel polls GHCR every 2 min for the :latest digest and rolls when it
    # changes. match-tag scopes Keel to the tag already on the Deployment
    # rather than scanning every tag in the repo and picking the "highest" —
    # without it Keel would pin to an old :<sha> tag that sorts above latest.
    keel.sh/policy: force
    keel.sh/match-tag: 'true'
    keel.sh/trigger: poll
    keel.sh/pollSchedule: '@every 2m'
spec:
  replicas: 1
  # Zero-downtime rollout: bring a second pod up first (maxSurge=1) and only
  # tear the old one down once the new pod's readiness probe reports
  # ACCEPTING_TRAFFIC (maxUnavailable=0). A broken image — failed Flyway
  # migration, Vault token miss, anything that keeps /actuator/health/readiness
  # red — never displaces the healthy old pod, so the rollout silently
  # ProgressDeadline-stalls instead of taking the api offline.
  #
  # progressDeadlineSeconds is generous because Spring Boot's cold start with
  # Flyway + Hibernate + Vault agent handshake can take several minutes on a
  # fresh image pull.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-inject-token: 'true'
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        vault.hashicorp.com/role: api
        vault.hashicorp.com/agent-inject-secret-api.env: secret/data/api
        # Every value is single-quoted and wrapped in
        # `{{ with (index .Data.data "...") }}{{ . }}{{ end }}` so a
        # missing KV field renders as `KEY=''` instead of the literal
        # `<no value>` consul-template default — `<` / `>` are shell
        # redirection and would crash `. /vault/secrets/api.env` with
        # `syntax error: unexpected newline`. Single quotes also tame
        # any `=`, `{`, `}`, `"`, `\n` etc. that legit values carry
        # (Brevo keys, Google service-account JSON). Google-generated
        # JSON doesn't contain raw single quotes; if a future rotation
        # does, base64-encode that one field in Vault and decode in
        # the start script.
        #
        # `with` over `| default ""` because Vault Agent's bundled
        # consul-template strips the Sprig `default` function for
        # security — `template: function "default" not defined` is the
        # error otherwise. `with` is a built-in Go-template action,
        # always available.
        #
        # MYSQL_USER / MYSQL_PASSWORD live in `secret/api` as
        # `mysql-user` / `mysql-password` (mirrored by
        # scripts/seed-vault-from-env.sh from the same MYSQL_USER /
        # MYSQL_PASSWORD env vars that feed `secret/platform/mariadb`).
        # Future work: re-enable Spring Cloud Vault dynamic creds
        # (`spring.cloud.vault.database.enabled=true`) once that
        # integration is fixed and drop these two fields again.
        vault.hashicorp.com/agent-inject-template-api.env: |
          {{- with secret "secret/data/api" -}}
          JWT_SECRET='{{ with (index .Data.data "jwt-secret") }}{{ . }}{{ end }}'
          BREVO_API_KEY='{{ with (index .Data.data "brevo-api-key") }}{{ . }}{{ end }}'
          BREVO_FOLDER_CONTRIBUTION_PERIODS_ID='{{ with (index .Data.data "brevo-folder-contribution-periods-id") }}{{ . }}{{ end }}'
          MOLLIE_API_KEY='{{ with (index .Data.data "mollie-api-key") }}{{ . }}{{ end }}'
          GOOGLE_CALENDAR_ID='{{ with (index .Data.data "google-calendar-id") }}{{ . }}{{ end }}'
          GOOGLE_CALENDAR_SA_JSON='{{ with (index .Data.data "google-calendar-sa-json") }}{{ . }}{{ end }}'
          FACEBOOK_PAGE_ID='{{ with (index .Data.data "facebook-page-id") }}{{ . }}{{ end }}'
          FACEBOOK_ACCESS_TOKEN='{{ with (index .Data.data "facebook-access-token") }}{{ . }}{{ end }}'
          X_API_KEY='{{ with (index .Data.data "x-api-key") }}{{ . }}{{ end }}'
          X_API_SECRET='{{ with (index .Data.data "x-api-secret") }}{{ . }}{{ end }}'
          X_ACCESS_TOKEN='{{ with (index .Data.data "x-access-token") }}{{ . }}{{ end }}'
          X_ACCESS_SECRET='{{ with (index .Data.data "x-access-secret") }}{{ . }}{{ end }}'
          DISCORD_BOT_TOKEN='{{ with (index .Data.data "discord-bot-token") }}{{ . }}{{ end }}'
          DISCORD_GUILD_ID='{{ with (index .Data.data "discord-guild-id") }}{{ . }}{{ end }}'
          MYSQL_USER='{{ with (index .Data.data "mysql-user") }}{{ . }}{{ end }}'
          MYSQL_PASSWORD='{{ with (index .Data.data "mysql-password") }}{{ . }}{{ end }}'
          {{- end }}
    spec:
      serviceAccountName: api
      # ghcr.io/esa-blueshell/api is a private package; the pull secret
      # is materialised by VSO from Vault (secret/platform/ghcr) — see
      # platform/cluster/flux/apps/vso-secrets/ghcr.yaml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/esa-blueshell/api:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              export SPRING_CLOUD_VAULT_TOKEN="$(cat /vault/secrets/token)"
              set -a
              . /vault/secrets/api.env
              set +a
              exec java \
                -XX:+UseZGC \
                -XX:+AlwaysPreTouch \
                -XX:MaxRAMPercentage=75 \
                -jar /app/app.jar
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_CONFIG_IMPORT
              value: vault://
            - name: VAULT_ENABLED
              value: 'true'
            # VAULT_DB_ENABLED intentionally omitted (defaults to false
            # via application.yaml). Spring Cloud Vault dynamic MariaDB
            # creds (`database/creds/api`) are wired up by
            # bootstrap-auth.sh and the Vault role works end-to-end,
            # but `spring.cloud.vault.database.enabled=true` does not
            # actually rebind `spring.datasource.{username,password}`
            # in the version we ship — the api falls back to the
            # `${MYSQL_USER:root}` placeholder default and connects
            # with no password. Static creds via the Vault Agent
            # template (MYSQL_USER / MYSQL_PASSWORD fields above) are
            # the path used today; flip this back on once the dynamic-
            # creds integration is debugged.
            - name: MYSQL_HOST
              value: mariadb.data-system.svc.cluster.local
            - name: MYSQL_PORT
              value: '3306'
            - name: APP_URL
              value: https://esa-blueshell.nl/api
            - name: FRONTEND_URL
              value: https://esa-blueshell.nl
            # Leading dot scopes BSH_AUTH (and the future logout cookie)
            # to every subdomain of esa-blueshell.nl. Traefik forwardAuth
            # on vault/headlamp/stalwart/traefik subdomains can't
            # authenticate the user without it (host-only cookie set on
            # esa-blueshell.nl wouldn't be sent to the others).
            - name: AUTH_COOKIE_DOMAIN
              value: .esa-blueshell.nl
            - name: STORAGE_LOCATION
              value: /srv/storage
            # SMTP transport — relay through Stalwart in-cluster.
            - name: SMTP_HOST
              value: stalwart.mail-system.svc.cluster.local
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_STARTTLS
              value: 'true'
            - name: EMAIL_FROM_ADDRESS
              value: no-reply@esa-blueshell.nl
            - name: EMAIL_FROM_NAME
              value: Blueshell
            - name: EMAIL_REPLY_TO_ADDRESS
              value: sitecie@esa-blueshell.nl
            # Mail principal credentials follow the
            # `account.<localpart>` convention. The username is the
            # full email derived from the localPart; the password
            # lives at Vault key `account.<localpart>`.
            #
            # SMTP submission auths as api@ (the api's dedicated
            # principal). IMAP bounce-poll auths as bounce@.
            - name: SMTP_USERNAME
              value: api@esa-blueshell.nl
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: account.api
                  optional: true
            # IMAP bounce poller — disabled by default; flip the flag once
            # the bounce mailbox is provisioned.
            - name: EMAIL_BOUNCE_IMAP_ENABLED
              value: 'false'
            - name: EMAIL_BOUNCE_IMAP_HOST
              value: stalwart.mail-system.svc.cluster.local
            - name: EMAIL_BOUNCE_IMAP_PORT
              value: '993'
            - name: EMAIL_BOUNCE_IMAP_TLS
              value: 'true'
            - name: EMAIL_BOUNCE_IMAP_FOLDER
              value: INBOX
            - name: EMAIL_BOUNCE_IMAP_USERNAME
              value: bounce@esa-blueshell.nl
            - name: EMAIL_BOUNCE_IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: account.bounce
                  optional: true
            - name: AUTH_TRANSIT_ENABLED
              value: 'true'
            - name: VAULT_ADDR
              value: http://vault.data-system.svc.cluster.local:8200
            - name: AUTH_TRANSIT_KEY_NAME
              value: api-jwt
            - name: VAULT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: vault-oidc-client-secret
          ports:
            - containerPort: 8080
              name: http
            # Spring Boot actuator runs on a separate management port
            # (management.server.port=8081 in application.yaml). Probes
            # target this port so they bypass the main filter chain's
            # HTTPS redirect entirely; SecurityConfig.actuatorChain
            # additionally permits unauthenticated access to /actuator/**.
            - containerPort: 8081
              name: management
          # Real HTTP health probes against Spring Boot's
          # /actuator/health/{liveness,readiness} group endpoints.
          # Tomcat binding alone (the old tcpSocket probe) said nothing
          # about whether Flyway, Hibernate, Vault and the OAuth2
          # Authorization Server had finished initializing — the api
          # was being marked Ready while in-flight requests still hit
          # half-initialized beans. The actuator probes are wired to
          # Spring's AvailabilityState, which only flips to
          # ACCEPTING_TRAFFIC after the ApplicationStartedEvent fires
          # and all HealthIndicators (db, diskSpace, ping, …) report UP.
          #
          # startupProbe is generous on purpose: cold boot with Flyway
          # migrations, Hibernate metadata scan, and Vault Agent
          # sidecar handshake can take several minutes on first deploy
          # of a new image, and we'd rather Kubernetes wait than
          # crashloop a healthy-but-slow pod. failureThreshold * period
          # = 5s * 180 = 15 minutes before the kubelet gives up.
          # Once startup optimisation work lands, this can be tightened.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 180
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /srv/storage
      # The api image runs as an Alpine `-S` system user with a
      # dynamic uid that changes across image rebuilds, so we can't
      # fsGroup our way onto the hostPath mount. Instead, on every
      # pod start, walk the volume and force directories to 0777 and
      # regular files to 0666 (u+rwX,g+rwX,o+rwX — capital X means
      # +x only on directories and already-executable files). This
      # makes Files.move into subdirectories like event-banners/
      # succeed regardless of which dynamic uid wrote them last, and
      # the setgid bit on directories keeps newly-created subdirs
      # group-consistent. The init container runs as root on every
      # pod restart, so reboots and clean reinstalls converge to a
      # working state without manual intervention. Traversal from
      # outside is still gated by /srv/blueshell (0755 root:root,
      # owned by systemd-tmpfiles on the node).
      initContainers:
        - name: storage-perms
          image: busybox:1.37-musl
          command:
            - sh
            - -c
            - |
              set -e
              chmod -R u+rwX,g+rwX,o+rwX /srv/storage
              find /srv/storage -type d -exec chmod g+s {} +
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: /srv/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: api-storage
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
