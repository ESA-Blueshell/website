# The migration's own identity: Vault's kubernetes auth binds role `migrate` to it,
# which reads the schema owner's login that the api's role cannot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: default
---
# The template the pre-rollout webhook instantiates per release. Suspended, and
# untagged so the images block in ../kustomization.yaml pins it to the release.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-migrate
  namespace: default
spec:
  schedule: '0 0 31 2 *'
  suspend: true
  # The CronJob controller prunes its children, so these are the migrate
  # Jobs a person can still read; the schema's record is DATABASECHANGELOG.
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: migrate
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: migrate
              image: ghcr.io/esa-blueshell/api
              imagePullPolicy: IfNotPresent
              command:
                - java
                - -XX:MaxRAMPercentage=75
                - -jar
                - /app/app.jar
              env:
                - name: SPRING_PROFILES_ACTIVE
                  # prod first: the Job runs the configuration production runs,
                  # and migrate only changes what it does with it.
                  value: prod,migrate
                - name: MYSQL_HOST
                  value: mariadb.data-system.svc.cluster.local
                - name: MYSQL_PORT
                  value: '3306'
              resources:
                requests:
                  cpu: 250m
                  memory: 768Mi
                limits:
                  memory: 1536Mi
