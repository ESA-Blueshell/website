apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: frontend
  namespace: default
spec:
  provider: kubernetes
  # Deleting this Canary scales the Deployment back up, not leaves it at zero.
  revertOnDeletion: true
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  # Flagger owns the frontend, frontend-primary and frontend-canary Services
  # from this block.
  service:
    port: 3000
    portName: http
    targetPort: http
  progressDeadlineSeconds: 900
  analysis:
    interval: 30s
    iterations: 4
    threshold: 3
    # Promotion, rollback and a held gate all reach Discord at info.
    alerts:
      - name: discord
        severity: info
        providerRef:
          name: discord
          namespace: flagger-system
    webhooks:
      - name: read-only-load
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 30s
        metadata:
          type: bash
          cmd: hey -z 20s -q 3 -c 2 http://frontend-canary.default:3000/

      - name: canary-answers-http
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: curl -sf http://frontend-canary.default:3000/healthz

      # Mirror of the api's gate; see the comment there.
      - name: wait-for-api
        type: confirm-promotion
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            phase=$(kubectl -n default get canary api -o jsonpath='{.status.phase}');
            echo "api=$phase";
            [ "$phase" != Progressing ] && [ "$phase" != Failed ]

      # Ready is not the same as changed: a promotion that kept the old pods
      # reports healthy and serves yesterday's build. Both sides come from the
      # cluster, so nothing has to be told what was released.
      - name: serves-the-version-it-was-promoted-to
        type: post-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: >-
            tag=$(kubectl -n default get deploy frontend-primary -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*:\(v[^@]*\).*/\1/; s/^v//'); served=$(curl -sf http://frontend.default:3000/version.json | jq -r .version); echo "promoted=$tag served=$served"; [ -n "$served" ] && [ "$tag" = "$served" ]
