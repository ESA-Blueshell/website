apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: 'true'
    keel.sh/trigger: poll
    keel.sh/pollSchedule: '@every 2m'
    # Appended to Keel's rollout notification as "Release notes: <url>".
    keel.sh/releaseNotes: https://github.com/ESA-Blueshell/website/releases
spec:
  replicas: 1
  # Single replica, but replaced with zero downtime: surge a second pod and
  # only retire the old one once the new pod is Ready (maxUnavailable=0).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      # ghcr.io/esa-blueshell/frontend is a private package; the pull
      # secret is materialised by VSO from Vault (secret/platform/ghcr)
      # — see platform/cluster/flux/apps/vso-secrets/ghcr.yaml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/esa-blueshell/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
