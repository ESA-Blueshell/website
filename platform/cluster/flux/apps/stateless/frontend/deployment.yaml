apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
spec:
  replicas: 1
  # Surge first, retire the old pod only once the new one is Ready, so a broken
  # image stalls the rollout instead of taking the site down. apps-frontend waits
  # up to its timeout for this rollout, so the deadline stays within it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      # ghcr.io/esa-blueshell/frontend is a private package; the pull
      # secret is materialised by VSO from Vault (secret/platform/ghcr)
      # — see platform/cluster/flux/apps/vso-secrets/ghcr.yaml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # Tag comes from the images block in ../kustomization.yaml.
          image: ghcr.io/esa-blueshell/frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          # /healthz is nginx's own `return 200` (nginx.conf) and does not
          # probe the api upstream: an api outage must not empty the frontend's
          # endpoints too.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# The IngressRoute sends everything that is not /api here.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
