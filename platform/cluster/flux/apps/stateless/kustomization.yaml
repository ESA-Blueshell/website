apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api
  - frontend
  - imaging
# Only place the deployed version is written, and it is written once for both,
# so api and frontend cannot diverge. Written by image-automation-controller,
# not by hand: a release publishes its images and the next scan commits the
# reference here, which is what deploys them.
#
# The markers name the ImagePolicy each value comes from. kustomize renders a
# tag and a digest together as `image:v1.9.0@sha256:...`, so the version stays
# readable in Git while the cluster runs an image no later build can move.
#
# To change these by hand, suspend the automation first or the next scan
# reverts it. See "Rolling back under automation" in the runbook.
images:
  - name: ghcr.io/esa-blueshell/api
    newTag: v1.26.1 # {"$imagepolicy": "flux-system:api:tag"}
    digest: sha256:396b944feba03f4b8ce526cce20ef6447fb6d264736019bc99a17320a1404b3d # {"$imagepolicy": "flux-system:api:digest"}
  - name: ghcr.io/esa-blueshell/frontend
    newTag: v1.26.1 # {"$imagepolicy": "flux-system:frontend:tag"}
    digest: sha256:db5a8262b8b2f5854bdc2b38907792492e513addeb80798c96441fb6f2737089 # {"$imagepolicy": "flux-system:frontend:digest"}
  # A placeholder until the first release publishes it; the scan rewrites both lines.
  - name: ghcr.io/esa-blueshell/imaging
    newTag: v1.26.1 # {"$imagepolicy": "flux-system:imaging:tag"}
    digest: sha256:f3feb4fb22895207afb4160bdccad45e9cde0775fedeaae98b7609f488f80b8d # {"$imagepolicy": "flux-system:imaging:digest"}
