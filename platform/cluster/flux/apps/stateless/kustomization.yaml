apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api
  - frontend
  - pinger
# Only place the deployed version is written, and it is written once for both,
# so api and frontend cannot diverge. Written by image-automation-controller,
# not by hand: a release publishes its images and the next scan commits the
# reference here, which is what deploys them.
#
# The markers name the ImagePolicy each value comes from. kustomize renders a
# tag and a digest together as `image:v1.9.0@sha256:...`, so the version stays
# readable in Git while the cluster runs an image no later build can move.
#
# To change these by hand, suspend the automation first or the next scan
# reverts it. See "Rolling back under automation" in the runbook.
images:
  - name: ghcr.io/esa-blueshell/api
    newTag: v1.18.1 # {"$imagepolicy": "flux-system:api:tag"}
    digest: sha256:7ea4f6232b32a639878b516b060b976f5db8cfcc6b73d910f8d29933cb85f3e4 # {"$imagepolicy": "flux-system:api:digest"}
  - name: ghcr.io/esa-blueshell/frontend
    newTag: v1.18.1 # {"$imagepolicy": "flux-system:frontend:tag"}
    digest: sha256:c62247aa529a283ba5cda5f7111d4f610a3b864a7523b1194206f34a4c0f85bc # {"$imagepolicy": "flux-system:frontend:digest"}
  # Released with the rest, but nothing else depends on it. v0.0.0 does not exist: the pod
  # sits in ImagePullBackOff until a release publishes a pinger image and the next scan
  # rewrites this line.
  - name: ghcr.io/esa-blueshell/pinger
    newTag: v1.18.1 # {"$imagepolicy": "flux-system:pinger:tag"}
