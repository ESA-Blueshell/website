apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api
  - frontend

# Only place the deployed version is written, and it is written once for both,
# so api and frontend cannot diverge. CI writes the digests onto the release
# branch, so merging the release pull request is what reaches production.
images:
  - name: ghcr.io/esa-blueshell/api
    newTag: v1.8.0
  - name: ghcr.io/esa-blueshell/frontend
    newTag: v1.8.0
