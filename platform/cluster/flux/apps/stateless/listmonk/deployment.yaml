apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: listmonk-uploads
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listmonk
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: listmonk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listmonk
    spec:
      containers:
        - name: listmonk
          image: listmonk/listmonk:v4.1.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              ./listmonk --install --idempotent --yes &&
              ./listmonk --upgrade --yes &&
              exec ./listmonk
          env:
            - name: LISTMONK_app__address
              value: '0.0.0.0:9000'
            - name: LISTMONK_db__host
              value: listmonk-db.data-system.svc.cluster.local
            - name: LISTMONK_db__port
              value: '5432'
            - name: LISTMONK_db__user
              value: listmonk
            - name: LISTMONK_db__database
              value: listmonk
            - name: LISTMONK_db__ssl_mode
              value: disable
            - name: LISTMONK_db__password
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: db-password
            - name: LISTMONK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: admin-user
            - name: LISTMONK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: admin-password
          ports:
            - containerPort: 9000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /listmonk/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: listmonk-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: listmonk
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: listmonk
  ports:
    - name: http
      port: 9000
      targetPort: http
