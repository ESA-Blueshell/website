apiVersion: v1
kind: ServiceAccount
metadata:
  name: listmonk-setup
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: listmonk-setup
  namespace: default
rules:
  # Scope each rule to the one resource the Job actually touches. Naming
  # the target lets RBAC block anything outside the script's happy path
  # — a future bug or rogue edit can't pivot to deleting arbitrary pods
  # or reading unrelated Secrets.
  #
  # `create` and `resourceNames` are not compatible: Kubernetes RBAC
  # only sees the resource name on requests that put it in the URL
  # (get / update / patch / delete). On `create`, the name is in the
  # request body — the RBAC check happens before the body is parsed,
  # so `resourceNames` matches nothing and the rule denies. Split into
  # an unscoped `create` rule (Secrets in this namespace only — the
  # script only ever creates `listmonk-api-token`) plus the narrow
  # name-scoped `get` / `patch` rule.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["listmonk-api-token"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: listmonk-setup
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: listmonk-setup
subjects:
  - kind: ServiceAccount
    name: listmonk-setup
    namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: listmonk-setup
  namespace: default
  # force-replace so any edit to setup.py (content-hash change on the
  # ConfigMap) triggers a re-run of the idempotent setup script.
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listmonk-setup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: listmonk-setup
      containers:
        - name: setup
          image: python:3.12-alpine
          command:
            - python
            - /scripts/setup.py
          env:
            - name: LISTMONK_URL
              value: http://listmonk.default.svc.cluster.local:9000
            - name: LISTMONK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: admin-user
            - name: LISTMONK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: admin-password
            # admin-email and api-user live in secret/listmonk so they can
            # drift alongside admin-user/password. Both are optional: the
            # script falls back to sensible defaults (admin@listmonk.local,
            # "api") when the keys are missing, which keeps a partially
            # seeded Vault from blocking the Job.
            - name: LISTMONK_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: admin-email
                  optional: true
            - name: LISTMONK_ADMIN_API_USER
              valueFrom:
                secretKeyRef:
                  name: listmonk-secrets
                  key: api-user
                  optional: true
            # The setup job persists the generated type=api password into a
            # normal Kubernetes Secret because VSO owns listmonk-secrets and
            # would overwrite any runtime-written keys on the next refresh.
            - name: LISTMONK_API_TOKEN_SECRET_NAME
              value: listmonk-api-token
            - name: LISTMONK_SMTP_HOST
              value: stalwart.mail-system.svc.cluster.local
            - name: LISTMONK_SMTP_PORT
              value: '587'
            - name: LISTMONK_SMTP_AUTH_PROTOCOL
              value: login
            - name: LISTMONK_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: bounce-mailbox-user
                  optional: true
            - name: LISTMONK_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: bounce-mailbox-password
                  optional: true
            - name: LISTMONK_SMTP_HELLO_HOSTNAME
              value: stalwart.esa-blueshell.nl
            - name: LISTMONK_SMTP_TLS_TYPE
              value: STARTTLS
            - name: LISTMONK_BOUNCE_MAILBOX_ENABLED
              value: 'true'
            - name: LISTMONK_BOUNCE_MAILBOX_HOST
              value: stalwart.mail-system.svc.cluster.local
            - name: LISTMONK_BOUNCE_MAILBOX_PORT
              value: '993'
            - name: LISTMONK_BOUNCE_MAILBOX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: bounce-mailbox-user
                  optional: true
            - name: LISTMONK_BOUNCE_MAILBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: bounce-mailbox-password
                  optional: true
            - name: LISTMONK_BOUNCE_MAILBOX_TLS_ENABLED
              value: 'true'
            - name: LISTMONK_BOUNCE_MAILBOX_FOLDER
              value: INBOX
            - name: LISTMONK_BOUNCE_MAILBOX_RETURN_PATH
              value: bounce@esa-blueshell.nl
          volumeMounts:
            - name: setup-script
              mountPath: /scripts
      volumes:
        - name: setup-script
          configMap:
            name: listmonk-setup-script
