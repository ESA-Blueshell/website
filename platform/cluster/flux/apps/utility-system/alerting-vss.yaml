# One Discord webhook, read by Gatus here and by Flagger in flagger-system.
# Gatus reads the key as an env var name, so DISCORD_WEBHOOK_URL is load-bearing.
apiVersion: v1
kind: ServiceAccount
metadata:
  # VSO looks this SA up in the CR's own namespace.
  name: vault-secrets-operator
  namespace: utility-system
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alerting-discord
  namespace: utility-system
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/alerting
  destination:
    name: alerting-discord
    create: true
    transformation:
      # Keep only the template, not the raw field or _raw.
      excludes:
        - '.*'
      excludeRaw: true
      templates:
        DISCORD_WEBHOOK_URL:
          text: '{{- get .Secrets "discord.webhook_url" -}}'
  refreshAfter: 1h
  rolloutRestartTargets:
    # Gatus reads the URL once, at config load.
    - kind: Deployment
      name: gatus
