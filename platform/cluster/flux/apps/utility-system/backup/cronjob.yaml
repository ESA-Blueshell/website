# Vault's kubernetes auth binds role `backup-gatus` to this account (apps/data/vault/bootstrap-auth.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: utility-system
---
# Every night Gatus's uptime history goes to the Kopia repository, copied with SQLite's online
# backup while Gatus keeps running.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: utility-system
spec:
  schedule: '45 3 * * *'
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
        spec:
          restartPolicy: Never
          serviceAccountName: backup
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: collect
              image: hashicorp/vault:1.21
              imagePullPolicy: IfNotPresent
              command: [sh, /scripts/collect.sh]
              env:
                - name: VAULT_ROLE
                  value: backup-gatus
                - name: VAULT_ADDR
                  value: http://vault.data-system.svc.cluster.local:8200
                - name: HOME
                  value: /work
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
            # Root, as Gatus runs: SQLite takes its locks next to Gatus's root-owned database.
            - name: sqlite
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: [sh, /scripts/gatus.sh]
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                  add: [CHOWN, DAC_OVERRIDE, FOWNER]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: gatus
                  mountPath: /gatus
          containers:
            - name: snapshot
              image: kopia/kopia:0.23.1
              imagePullPolicy: IfNotPresent
              command: [bash, /scripts/snapshot.sh]
              env:
                - name: BACKUP_GROUPS
                  value: gatus=/work/gatus
                - name: BACKUP_BUCKET
                  value: esa-blueshell-backups
                - name: BACKUP_ENDPOINT
                  value: s3.nl-ams.scw.cloud
                - name: BACKUP_REGION
                  value: nl-ams
                - name: GATUS_PUSH_BASE
                  value: http://gatus.utility-system.svc.cluster.local/api/v1/endpoints/backups_
                - name: KOPIA_CONFIG_PATH
                  value: /work/kopia/repository.config
                - name: KOPIA_CACHE_DIRECTORY
                  value: /work/kopia/cache
                - name: KOPIA_LOG_DIR
                  value: /work/kopia/logs
                - name: HOME
                  value: /work
                - name: TMPDIR
                  value: /work
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            # In memory: the copy and the night's credentials never touch the node's disk.
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: gatus
              persistentVolumeClaim:
                claimName: gatus-data
