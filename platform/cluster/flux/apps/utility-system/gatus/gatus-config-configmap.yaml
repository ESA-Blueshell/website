apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: utility-system
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/data.db
    ui:
      title: Blueshell Esports status
      description: Uptime for the esa-blueshell.nl stack.
      header: Blueshell Esports
    alerting:
      discord:
        webhook-url: "${DISCORD_WEBHOOK_URL}"
        title: "Blueshell Esports status"
        # Only applies to endpoints that declare `alerts: - type: discord`;
        # Gatus never adds an alert on its own.
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true
