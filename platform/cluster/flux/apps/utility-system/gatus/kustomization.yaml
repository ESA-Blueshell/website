apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gatus-config-configmap.yaml
  - gatus-endpoints-configmap.yaml
  - deployment.yaml

# Hashed, so an edit to the backup endpoints rolls Gatus, whose init container renders them.
configMapGenerator:
  - name: gatus-backup-endpoints
    namespace: utility-system
    files:
      - backup-endpoints.yaml
