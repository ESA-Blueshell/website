# cert-manager reads cloudflare-api-token.api-token to satisfy DNS-01
# challenges for *.esa-blueshell.nl. external-dns reads the same secret
# shape to manage A/AAAA records. VSO syncs both from the same Vault path
# (`secret/platform/edge:cloudflare.dns_api_token`).
#
# These VSS lived briefly in apps-core (PR #167) so cert-manager /
# external-dns could find their Secret without a manual operator
# pre-seed. That created a hard ordering bug: kustomize-controller
# atomically dry-runs every resource in a Kustomization, and the
# VaultStaticSecret CRD is installed by the VSO HelmRelease in the
# same Kustomization — so the dry-run on this VSS aborts the entire
# apps-core apply before VSO ever installs its CRDs. Keep the VSS in
# apps-vso-secrets (CRDs already established by the time apps-core is
# Ready) and rely on disableWait + retries on the consumers
# (apps/core/external-dns/release.yaml) so apps-core itself doesn't
# block waiting for the cloudflare Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: cert-manager
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/edge
  destination:
    name: cloudflare-api-token
    create: true
    transformation:
      templates:
        api-token:
          text: '{{- get .Secrets "cloudflare.dns_api_token" -}}'
  refreshAfter: 1h
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: external-dns
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/edge
  destination:
    name: cloudflare-api-token
    create: true
    transformation:
      templates:
        api-token:
          text: '{{- get .Secrets "cloudflare.dns_api_token" -}}'
  refreshAfter: 1h
---
# Third mirror: the stalwart-apply sidecar in mail-system uses this
# token to refresh Stalwart's DnsServer secret (Cloudflare DNS-01) on
# every pod boot. The vault-secrets-operator ServiceAccount in
# mail-system is created by stalwart-secrets.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: mail-system
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/edge
  destination:
    name: cloudflare-api-token
    create: true
    transformation:
      templates:
        api-token:
          text: '{{- get .Secrets "cloudflare.dns_api_token" -}}'
  refreshAfter: 1h
