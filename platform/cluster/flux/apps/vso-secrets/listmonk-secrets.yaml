# listmonk-secrets: Listmonk app config (admin credentials, SMTP password)
# consumed by the Listmonk Deployment in apps-stateless.
#
# The Bitnami PostgreSQL chart's listmonk-db-credentials VSS lives at
# apps/data/listmonk-db/ alongside its HelmRelease so apps-data is
# self-bootstrapping (no manual k8s Secret pre-seed needed before VSO
# can sync from Vault).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: listmonk-secrets
  namespace: default
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: listmonk
  destination:
    name: listmonk-secrets
    create: true
  refreshAfter: 1h
