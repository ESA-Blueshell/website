# pinger-report-token: the service token the cluster painter presents to the api so its report
# authenticates as SiteCie. The token lives on its own Vault path, secret/platform/pinger-report,
# which the api reads too (api ADR-033); this mirrors it into a Secret in the default namespace so
# the Go pinger, which cannot speak to Vault directly, reads it from an env. A dedicated path, not
# secret/api, so this shared VSO auth is granted read over only the token rather than every api
# secret.
#
# excludeRaw drops the raw key, so only the templated token reaches this Secret and the pinger pod.
# rolloutRestartTargets restarts the pinger when the token rotates, so a new value is picked up
# without a manual bounce. The vault-secrets-operator ServiceAccount in the default namespace
# already exists (platform/cluster/flux/apps/vso-secrets/ghcr.yaml), and the vso policy is granted
# read on this path by platform/cluster/flux/apps/data/vault/bootstrap-auth.sh.
#
# HUMAN BLOCKER: provision the token value once at secret/platform/pinger-report, key service-token
# (the api and this secret read the same path, so there is one source of truth). The bootstrap-auth
# policies already grant the api and vso roles read on that path and nothing broader. Until the key
# is provisioned the Secret is absent or empty; the env reference is optional, so the pinger still
# boots and the reporter stays idle (an empty token means no SiteCie credential), matching an unset
# token on the api side.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pinger-report-token
  namespace: default
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/pinger-report
  destination:
    name: pinger-report-token
    create: true
    transformation:
      excludeRaw: true
      templates:
        token:
          text: '{{- get .Secrets "service-token" -}}'
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: pinger
