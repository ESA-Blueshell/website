# pinger-report-token: the service token the cluster painter presents to the api so its report
# authenticates as SiteCie. The api reads the same value from Vault itself (secret/api, key
# `pinger.report.service-token`, api ADR-033); this mirrors that one key into a Secret in the
# default namespace so the Go pinger, which cannot speak to Vault directly, reads it from an env.
#
# excludeRaw drops every other key under secret/api, so only the token reaches this Secret and the
# pinger pod. rolloutRestartTargets restarts the pinger when the token rotates, so a new value is
# picked up without a manual bounce. The vault-secrets-operator ServiceAccount in the default
# namespace already exists (platform/cluster/flux/apps/vso-secrets/ghcr.yaml).
#
# HUMAN BLOCKER: this reads secret/api, so the Vault role behind vso-system/default must be granted
# read on that path, and the token value must be provisioned there. Until both are done the Secret
# is absent or empty; the env reference is optional, so the pinger still boots and the reporter
# stays idle (an empty token means no SiteCie credential), matching an unset token on the api side.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pinger-report-token
  namespace: default
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: api
  destination:
    name: pinger-report-token
    create: true
    transformation:
      excludeRaw: true
      templates:
        token:
          text: '{{- get .Secrets "pinger.report.service-token" -}}'
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: pinger
