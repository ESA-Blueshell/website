# stalwart-secrets: k8s Secret mirrored from secret/platform/mail into the
# mail-system namespace for Stalwart itself and into the default namespace
# for the api.
#
# Follow-ups before mail cutover:
# - dkim-private-key is seeded in Vault KV but not yet rendered into the
#   Stalwart config-template; wiring it is pending.
#
# VSO needs the `vault-secrets-operator` ServiceAccount in the same
# namespace as this VaultStaticSecret; apps-mail doesn't create this SA
# itself and without it VSO reports "ServiceAccount vault-secrets-operator
# not found".
# apps-mail (which creates the stalwart Deployment/Service) depends on
# apps-vso-secrets (this Kustomization) — meaning the mail-system
# namespace must exist *before* apps-vso-secrets reconciles, not after.
# Declare it here instead of in apps-mail; apps-mail adopts the existing
# namespace when it reconciles.
apiVersion: v1
kind: Namespace
metadata:
  name: mail-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: mail-system
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: stalwart-secrets
  namespace: mail-system
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/mail
  destination:
    name: stalwart-secrets
    create: true
  refreshAfter: 1h
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: stalwart-secrets
  namespace: default
spec:
  vaultAuthRef: vso-system/default
  type: kv-v2
  mount: secret
  path: platform/mail
  destination:
    name: stalwart-secrets
    create: true
  refreshAfter: 1h
