---
# Layered Kustomizations so Helm-owned CRDs install before any CR that
# depends on them. apps-core installs charts (cert-manager, Traefik,
# external-dns, VSO) and waits for the HelmReleases to report Ready.
# apps-data depends on apps-core (Vault HelmRelease needs the VSO CRDs
# present first) and is self-bootstrapping: the VaultStaticSecret CRs
# the Bitnami MariaDB chart needs at startup lives next to its
# HelmRelease (apps/data/mariadb), so once the
# operator unseals Vault and the bootstrap Job wires up the vso role,
# VSO materialises the Secret in-place and the chart upgrade unblocks
# without a manual k8s Secret pre-seed. apps-vso-secrets handles the
# remaining non-blocking secrets (cloudflare, api,
# stalwart, ghcr) and only depends on apps-core; VSO retries each CR
# on its own backoff until Vault is reachable.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-core
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/core
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-data
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/data
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-vso-secrets
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/vso-secrets
  prune: true
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-edge
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/edge
  prune: true
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-utility-system
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/utility-system
  prune: true
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-mail
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/mail
  prune: true
  dependsOn:
    - name: apps-core
    - name: apps-vso-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# One release, applied in order: the schema, then the api, then the frontend.
# Each waits for the one before it to be Ready at the same Git revision, so a
# migration that fails keeps the previous api, and an api that does not come up
# keeps the previous frontend. Every tag is written in one commit by
# image-automation-controller, so the three paths never name different releases.
#
# wait: a path is Ready only once its Job has completed or its Deployment has
# rolled out. force on the migration: a Job's pod template is immutable, so a
# new tag replaces the Job instead of failing the apply.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-migrate
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/stateless/migrate
  prune: true
  wait: true
  force: true
  timeout: 15m
  retryInterval: 2m0s
  dependsOn:
    - name: apps-data
    - name: apps-vso-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-api
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/stateless/api
  prune: true
  wait: true
  # The Deployment's progressDeadlineSeconds plus room for the apply.
  timeout: 20m
  retryInterval: 2m0s
  dependsOn:
    - name: apps-migrate
    - name: apps-edge
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-frontend
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/stateless/frontend
  prune: true
  wait: true
  timeout: 20m
  retryInterval: 2m0s
  dependsOn:
    - name: apps-api
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# Registry scanning. The image CRDs come from the bootstrap components rather
# than from a chart, so this only waits on the credential: ghcr-pull-secret is
# materialised into flux-system by apps-vso-secrets, which does not wait for
# Vault, so a scan may report 401 until VSO catches up and then recovers on its
# own interval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-image-automation
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/image-automation
  prune: true
  dependsOn:
    - name: apps-core
    - name: apps-vso-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
