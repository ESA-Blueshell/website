---
# Layered Kustomizations so Helm-owned CRDs install before any CR that
# depends on them. apps-core installs charts (cert-manager, Traefik,
# external-dns, VSO) and waits for the HelmReleases to report Ready.
# apps-data depends on apps-core (Vault HelmRelease needs the VSO CRDs
# present first) and is self-bootstrapping: the VaultStaticSecret CRs
# the Bitnami MariaDB and PostgreSQL charts need at startup live next
# to their HelmReleases (apps/data/{mariadb}), so once the
# operator unseals Vault and the bootstrap Job wires up the vso role,
# VSO materialises both Secrets in-place and the chart upgrades unblock
# without a manual k8s Secret pre-seed. apps-vso-secrets handles the
# remaining non-blocking secrets (cloudflare, api,
# stalwart, ghcr) and only depends on apps-core; VSO retries each CR
# on its own backoff until Vault is reachable.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-core
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/core
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-data
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/data
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# Flagger and its loadtester, kept out of apps-core on purpose: everything else
# depends on apps-core, so a failed install there would stop cert-manager,
# Traefik and Vault reconciling. wait, because apps-stateless applies Canary CRs
# that need Flagger's CRDs present.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-delivery
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/delivery
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-vso-secrets
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/vso-secrets
  prune: true
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-edge
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/edge
  prune: true
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-utility-system
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/utility-system
  prune: true
  dependsOn:
    - name: apps-core
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-mail
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/mail
  prune: true
  dependsOn:
    - name: apps-core
    - name: apps-vso-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# api and frontend are one release: one apply carries both pinned tags, and
# Flagger's paired confirm-promotion gates hold each canary until the other is
# ready, so the pair promotes together or neither does.
#
# The health checks name the Flagger-managed -primary Deployments, which are
# what the Services point at; the source Deployments sit at 0 replicas between
# canary runs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-stateless
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./platform/cluster/flux/apps/stateless
  prune: true
  timeout: 20m
  retryInterval: 2m0s
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: api-primary
      namespace: default
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend-primary
      namespace: default
  dependsOn:
    - name: apps-core
    - name: apps-data
    - name: apps-delivery
    - name: apps-vso-secrets
    - name: apps-edge
  sourceRef:
    kind: GitRepository
    name: flux-system
