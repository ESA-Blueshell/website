services:
  db:
    image: mariadb:10.11.10
    container_name: db
    ports:
      - "3307:3306"
    volumes:
      - data:/var/lib/mysql
      - "./0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    networks:
      - global_network
    restart: unless-stopped
    env_file:
      - .db.env
    environment:
      - TZ=Europe/Amsterdam
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: api:dev
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile-dev
    volumes:
      - .:/app
      - ../../storage:/home/storage
      - gradle-cache:/root/.gradle
      - playwright-browsers:/ms-playwright
      - playwright-browsers:/root/.cache/ms-playwright
      - listmonk-secrets:/run/secrets/listmonk:ro
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - global_network
    env_file:
      - .api.env
    environment:
      - TZ=Europe/Amsterdam
      - SPRING_PROFILES_ACTIVE=dev
      - APP_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - LISTMONK_FROM_ADDRESS=no-reply@localhost
      - LISTMONK_REPLY_TO_ADDRESS=dev@localhost
    depends_on:
      db:
        condition: service_healthy
      listmonk-setup:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  global_network:
    driver: bridge

volumes:
  data:
  gradle-cache:
  playwright-browsers:
