services:
  db:
    image: mariadb:10.11.10
    container_name: db
    ports:
      - "3307:3306"
    volumes:
      - data:/var/lib/mysql
      - "./0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    networks:
      - global_network
    restart: unless-stopped
    env_file:
      - .db.env
    environment:
      - TZ=Europe/Amsterdam
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - global_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: api:dev
    pull_policy: never
    build:
      context: ../..
      dockerfile: services/api/Dockerfile-dev
    volumes:
      # Mount the whole repo into /src so hot-reload sees api + build-logic + libs edits.
      - ../..:/src
      - ../../storage:/home/storage
      - gradle-cache:/root/.gradle/caches
      - playwright-browsers:/ms-playwright
      - playwright-browsers:/root/.cache/ms-playwright
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - global_network
    env_file:
      - .api.env
    environment:
      - TZ=Europe/Amsterdam
      - SPRING_PROFILES_ACTIVE=dev
      - APP_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - EMAIL_FROM_ADDRESS=no-reply@localhost
      - EMAIL_REPLY_TO_ADDRESS=dev@localhost
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  global_network:
    driver: bridge

volumes:
  data:
  valkey-data:
  gradle-cache:
  playwright-browsers:
