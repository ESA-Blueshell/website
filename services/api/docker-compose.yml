services:
  db:
    image: mariadb:10.11.10
    networks:
      - database
    volumes:
      - db_data:/var/lib/mysql
      - "./0_init.sql:/docker-entrypoint-initdb.d/0_init.sql"
      - "./1_dump.sql:/docker-entrypoint-initdb.d/1_dump.sql"
    env_file:
      - .db.env
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/esa-blueshell/api:${IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - .api.env
    environment:
      - TZ=Europe/Amsterdam
      - APP_URL=https://${APP_DOMAIN:-esa-blueshell.nl}/api
      - FRONTEND_URL=https://${APP_DOMAIN:-esa-blueshell.nl}
      - LISTMONK_API_USERNAME=${LISTMONK_ADMIN_USERNAME:-listmonk}
      - LISTMONK_API_PASSWORD=${LISTMONK_ADMIN_PASSWORD:-listmonk}
    volumes:
      - "../../storage:/home/storage"
      - "listmonk-secrets:/run/secrets/listmonk:ro"
    depends_on:
      db:
        condition: service_healthy
      listmonk-setup:
        condition: service_completed_successfully
    networks:
      - frontback
      - database
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-website}-api.rule=Host(`${APP_DOMAIN:-esa-blueshell.nl}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-website}-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-website}-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-website}-api.middlewares=${COMPOSE_PROJECT_NAME:-website}-api-strip"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-website}-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-website}-api.loadbalancer.server.port=8080"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  frontback:
  database:
  traefik-public:

volumes:
  db_data:
