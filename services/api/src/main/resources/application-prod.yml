# Secrets come from Vault, read by Spring Cloud Vault as the api's own
# ServiceAccount (api ADR-033).
# An import outranks this file and application.yaml, so a key in Vault wins over
# any development default there. The secrets application.yaml gives a development
# value are blanked below, so a key missing from Vault is refused by the hardening
# guard or the first connection instead of running on that value.
spring:
  config:
    import:
      - vault://secret/api
      # Shared with Stalwart, which names its keys `account.<localpart>`.
      - vault://secret/platform/mail?prefix=mail.
      # The secret backends, of which only the database one is on: a leased
      # login that DatabaseLoginRotation keeps current past the role's max_ttl.
      # Optional, because the migrate profile turns that backend off.
      - optional:vault://
  cloud:
    vault:
      enabled: true
      # A read Vault refuses stops the start, rather than leaving a key empty.
      fail-fast: true
      authentication: KUBERNETES
      kubernetes:
        role: api
      # Only the paths named above; no default contexts under the application name.
      kv:
        enabled: false
      database:
        enabled: true
        role: api
  # Mail leaves as the bounce mailbox, so a report of undelivered mail comes back to
  # the mailbox the poller reads. Stalwart refuses an envelope sender the login does
  # not own, so login and envelope sender are one account; From: stays no-reply@.
  mail:
    username: ${email.bounce.imap.username}
    password: ${email.bounce.imap.password}
    properties:
      mail.smtp.from: ${email.bounce.imap.username}
  datasource:
    username: ""

email:
  bounce:
    imap:
      # No default: it is the api's mail login too, so a Deployment without it
      # fails the start rather than send nothing.
      username: ${EMAIL_BOUNCE_IMAP_USERNAME}
      password: ${mail.account.bounce:}

auth:
  clients:
    vault:
      secret: ""

app:
  security:
    require-https: true
  # How often the api re-reads its Vault KV paths; a rotated key is live within this.
  vault:
    refresh-interval: 5m
  jwt:
    secret: ""

security:
  openapi:
    public:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
