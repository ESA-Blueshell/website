# Secrets come from Vault, read by Spring Cloud Vault as the api's own
# ServiceAccount (api ADR-033).
# An import outranks this file and application.yaml, which holds no secret, so a key
# missing from Vault is blank and refused by the hardening guard or the first
# connection. The database user is blanked below for the same reason: its
# development default is root.
spring:
  config:
    import:
      - vault://secret/api
      # Shared with Stalwart, which names its keys `account.<localpart>`.
      - vault://secret/platform/mail?prefix=mail.
      # The secret backends, of which only the database one is on: a leased
      # login that DatabaseLoginRotation keeps current past the role's max_ttl.
      # Optional, because the migrate profile turns that backend off.
      - optional:vault://
  cloud:
    vault:
      enabled: true
      # A read Vault refuses stops the start, rather than leaving a key empty.
      fail-fast: true
      authentication: KUBERNETES
      kubernetes:
        role: api
      # Only the paths named above; no default contexts under the application name.
      kv:
        enabled: false
      database:
        enabled: true
        role: api
  # Mail leaves as the bounce mailbox, so a report of undelivered mail comes back to
  # the mailbox the poller reads. Stalwart refuses an envelope sender the login does
  # not own, so login and envelope sender are one account; From: stays no-reply@.
  mail:
    username: ${email.bounce.imap.username}
    password: ${email.bounce.imap.password}
    properties:
      mail.smtp.from: ${email.bounce.imap.username}
  datasource:
    username: ""

email:
  bounce:
    imap:
      # No default: it is the api's mail login too, so a Deployment without it
      # fails the start rather than send nothing.
      username: ${EMAIL_BOUNCE_IMAP_USERNAME}
      password: ${mail.account.bounce:}

app:
  security:
    require-https: true
  # How often the api re-reads its Vault KV paths; a rotated key is live within this.
  vault:
    refresh-interval: 5m

security:
  openapi:
    public:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
# The SiteCie report token on its own path, shared with the pinger's VSO secret (api ADR-033). Only
# the running api reads it: this document is gated off under `migrate`, because the migrate boot runs
# `prod,migrate` and its Vault role is not granted the path, so importing it there would 403, which
# `optional:` does not tolerate the way it tolerates a 404. Optional, so an unprovisioned token
# leaves the property empty and SiteCie idle rather than failing the start.
#
# The vault connection settings are repeated here because this import is resolved in the profile
# phase, after the main document's: Spring Cloud Vault binds its settings at the vault:// location it
# resolves, so the location needs them in its own document (as application-migrate.yml does).
spring:
  config:
    activate:
      on-profile: "!migrate"
    import:
      - optional:vault://secret/platform/pinger-report?prefix=pinger.report.
  cloud:
    vault:
      enabled: true
      authentication: KUBERNETES
      kubernetes:
        role: api
