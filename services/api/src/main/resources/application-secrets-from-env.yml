# Where a secret comes from outside production: an environment variable, with the development
# value where there is one. Activated by the dev, test and live-test profiles through the group in
# application.yaml; production reads the same keys from Vault and never activates it (api ADR-033).
spring:
  datasource:
    password: ${MYSQL_PASSWORD:}
  mail:
    password: ${SMTP_PASSWORD:}

email:
  bounce:
    imap:
      password: ${EMAIL_BOUNCE_IMAP_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh}

auth:
  clients:
    vault:
      secret: ${VAULT_OIDC_CLIENT_SECRET:changeme}

brevo:
  apiKey: ${BREVO_API_KEY:}

discord:
  botToken: ${DISCORD_BOT_TOKEN:}

google:
  calendar:
    serviceAccountJson: ${GOOGLE_CALENDAR_SA_JSON:}
