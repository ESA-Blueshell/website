spring:
  application:
    db: blueshell-test

  flyway:
    clean-on-validation-error: true
    clean-disabled: false

  main:
    banner-mode: off
    log-startup-info: false

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  level:
    root: INFO

    net.blueshell: INFO
    net.blueshell.api: DEBUG

    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.boot.autoconfigure: WARN
    org.springframework.jdbc: WARN
    org.springframework.security: WARN

    # Server (Tomcat/Undertow/Jetty)
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN

    # DB / ORM
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.type.descriptor.jdbc: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN

    # If you use Testcontainers
    org.testcontainers: WARN
    com.github.dockerjava: WARN

app:
  security:
    require-https: false
  jobs:
    max-retries: 3
    initial-backoff-millis: 200
    backoff-multiplier: 2.0
    max-backoff-millis: 1000
    retry-check-interval-ms: 100
    auto-dispatch: false

security:
  cors:
    allowed-origins:
      - http://frontend:3000
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
  openapi:
    public:
      enabled: true
  auth-rate-limit:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  error:
    include-message: always
