# The AOT cache's training run, while the image is built: the context refreshes and the JVM
# exits, with no database, Vault or Valkey to reach (architecture ADR-013). The keys below are
# placeholders that satisfy the hardening guard and open nothing.
spring:
  liquibase:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false

