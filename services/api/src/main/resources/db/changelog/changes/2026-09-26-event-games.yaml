# The games an event names: none for every event from before, and any number from now on. Held by
# code, which never changes, and indexed by it for a game page's list of its events. The code
# column states the baseline's collation: a foreign key needs it to match game.code, and a new
# table otherwise takes the server's default.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-09-26-event-games.yaml
      id: event-games
      author: blueshell
      changes:
        - createTable:
            tableName: event_games
            columns:
              - column: {name: event_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: game_code, type: VARCHAR(32) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci, constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: event_games
            columnNames: event_id, game_code
            constraintName: pk_event_games
        - createIndex:
            tableName: event_games
            indexName: idx_event_games_game_code
            columns:
              - column: {name: game_code}
        - addForeignKeyConstraint:
            constraintName: fk_event_games_event_id
            baseTableName: event_games
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_event_games_game_code
            baseTableName: event_games
            baseColumnNames: game_code
            referencedTableName: game
            referencedColumnNames: code
      rollback:
        - dropTable:
            tableName: event_games
