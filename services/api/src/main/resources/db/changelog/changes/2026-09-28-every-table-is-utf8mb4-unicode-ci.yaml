# Every table is utf8mb4 / utf8mb4_unicode_ci, which most of the baseline has and the connection
# asks for.
#
# utf8mb3 cannot hold an emoji, and comparing columns of two collations is an error. The database
# default follows, so a table a later changeset creates takes it rather than the server's, which
# production's Bitnami chart sets to utf8mb3. Left as they are: answers.option_selections and
# questions.choice_labels, JSON that MariaDB holds as utf8mb4_bin, and Liquibase's own two tables,
# which nothing else reads.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-09-28-every-table-is-utf8mb4-unicode-ci.yaml
      id: every-table-is-utf8mb4-unicode-ci
      author: blueshell
      changes:
        - sql:
            sql: |
              ALTER TABLE authorities CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE deleted_users CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE emails CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE incasso_notifications CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE job_executions CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE member_profiles CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE oauth2_authorization CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE oauth2_authorization_consent CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE oauth2_registered_client CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE study_programs CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE user_studies CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE backup_codes CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE committee_games CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE event_games CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE event_pinged_roles CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE game_channels CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE game_esports_channels CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE role_changes CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE security_events CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE seed_applied CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE trusted_browsers CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER TABLE two_factor_secrets CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              ALTER DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      # Baseline tables return to the baseline's collations, study_programs.name's own included. The
      # rest took the server's default and return to it once the database has; committee_games and
      # event_games change only their table default, as a foreign key holds game_code to game.code's.
      rollback:
        - sql:
            sql: |
              ALTER DATABASE CHARACTER SET DEFAULT COLLATE DEFAULT;
              ALTER TABLE backup_codes CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE committee_games CHARACTER SET DEFAULT;
              ALTER TABLE event_games CHARACTER SET DEFAULT;
              ALTER TABLE event_pinged_roles CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE game_channels CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE game_esports_channels CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE role_changes CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE security_events CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE seed_applied CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE trusted_browsers CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE two_factor_secrets CONVERT TO CHARACTER SET DEFAULT;
              ALTER TABLE authorities CONVERT TO CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;
              ALTER TABLE deleted_users CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE emails CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE incasso_notifications CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE job_executions CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE member_profiles CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE oauth2_authorization CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE oauth2_authorization_consent CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE oauth2_registered_client CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE study_programs CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              ALTER TABLE study_programs MODIFY name VARCHAR(255) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL;
              ALTER TABLE user_studies CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
