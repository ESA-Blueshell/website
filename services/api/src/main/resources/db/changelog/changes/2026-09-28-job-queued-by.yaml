# What queued a job. The column is not called trigger, which MariaDB reserves.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-09-28-job-queued-by.yaml
      id: job-queued-by
      author: blueshell
      changes:
        - addColumn:
            tableName: job_executions
            columns:
              - column: {name: queued_by, type: VARCHAR(32)}
      rollback:
        - dropColumn:
            tableName: job_executions
            columns:
              - column: {name: queued_by}
