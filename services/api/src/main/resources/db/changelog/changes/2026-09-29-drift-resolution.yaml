# Every drift resolution the board makes on a target is recorded: which target, the action, the
# person it concerned and who resolved it when. Append-only; the cohort page reads the recent ones.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-09-29-drift-resolution.yaml
      id: drift-resolution
      author: blueshell
      changes:
        - createTable:
            tableName: drift_resolution
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_drift_resolution, nullable: false}
              - column: {name: target_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: action, type: VARCHAR(16), constraints: {nullable: false}}
              - column: {name: user_id, type: BIGINT}
              - column: {name: external_user_id, type: VARCHAR(255)}
              - column: {name: label, type: VARCHAR(255)}
              - column: {name: resolved_by, type: BIGINT}
              - column: {name: resolved_at, type: DATETIME(6), constraints: {nullable: false}}
        - createIndex:
            tableName: drift_resolution
            indexName: idx_drift_resolution_target
            columns:
              - column: {name: target_id}
              - column: {name: resolved_at}
      rollback:
        - dropTable: {tableName: drift_resolution}
