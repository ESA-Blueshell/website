# The bank details and mandate a membership is collected under. The IBAN and account holder are
# sealed by Vault Transit to the member (api ADR-038); only the masked IBAN stays readable.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-09-30-incasso-mandate.yaml
      id: incasso-mandate
      author: blueshell
      changes:
        - addColumn:
            tableName: memberships
            columns:
              - column: {name: mandate_iban, type: VARCHAR(255)}
              - column: {name: mandate_account_holder, type: VARCHAR(512)}
              - column: {name: mandate_iban_masked, type: CHAR(4)}
              - column: {name: mandate_reference, type: VARCHAR(35)}
              - column: {name: mandate_signed_on, type: DATE}
              - column: {name: mandate_recorded_by, type: BIGINT}
              - column: {name: mandate_recorded_at, type: DATETIME(6)}
              - column: {name: mandate_kind, type: VARCHAR(16)}
              - column: {name: mandate_authorised_at, type: DATETIME(6)}
              - column: {name: mandate_wording_version, type: VARCHAR(16)}
              - column: {name: mandate_authorised_by, type: BIGINT}
              - column: {name: mandate_address, type: TEXT}
      rollback:
        - dropColumn:
            tableName: memberships
            columns:
              - column: {name: mandate_iban}
              - column: {name: mandate_account_holder}
              - column: {name: mandate_iban_masked}
              - column: {name: mandate_reference}
              - column: {name: mandate_signed_on}
              - column: {name: mandate_recorded_by}
              - column: {name: mandate_recorded_at}
              - column: {name: mandate_kind}
              - column: {name: mandate_authorised_at}
              - column: {name: mandate_wording_version}
              - column: {name: mandate_authorised_by}
              - column: {name: mandate_address}
