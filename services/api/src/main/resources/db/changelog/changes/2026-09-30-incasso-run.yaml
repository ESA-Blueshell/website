# One incasso run collects a period's contributions from the members on incasso: its collection
# date and statement text, and when the board put it in ING. Each notification it sent names the
# run and keeps the mandate it was collected under, so the ING file matches what members were told.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-09-30-incasso-run.yaml
      id: incasso-run
      author: blueshell
      changes:
        - createTable:
            tableName: incasso_runs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_incasso_runs, nullable: false}
              - column: {name: contribution_period_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: collection_date, type: DATE, constraints: {nullable: false}}
              - column: {name: statement_text, type: VARCHAR(140), constraints: {nullable: false}}
              - column: {name: created_by, type: BIGINT}
              - column: {name: created_at, type: DATETIME(6), constraints: {nullable: false}}
              - column: {name: submitted_by, type: BIGINT}
              - column: {name: submitted_at, type: DATETIME(6)}
        - createIndex:
            tableName: incasso_runs
            indexName: idx_incasso_runs_period
            columns:
              - column: {name: contribution_period_id}
        - addColumn:
            tableName: incasso_notifications
            columns:
              - column: {name: incasso_run_id, type: BIGINT}
              - column: {name: mandate_reference, type: VARCHAR(35)}
              - column: {name: mandate_signed_on, type: DATE}
              - column: {name: iban_masked, type: CHAR(4)}
        - createIndex:
            tableName: incasso_notifications
            indexName: idx_incasso_notifications_run
            columns:
              - column: {name: incasso_run_id}
      rollback:
        - dropIndex: {tableName: incasso_notifications, indexName: idx_incasso_notifications_run}
        - dropColumn: {tableName: incasso_notifications, columnName: iban_masked}
        - dropColumn: {tableName: incasso_notifications, columnName: mandate_signed_on}
        - dropColumn: {tableName: incasso_notifications, columnName: mandate_reference}
        - dropColumn: {tableName: incasso_notifications, columnName: incasso_run_id}
        - dropTable: {tableName: incasso_runs}
