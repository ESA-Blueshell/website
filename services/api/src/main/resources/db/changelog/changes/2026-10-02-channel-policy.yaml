# The access a games or esports channel was set to on the site, so a change made on Discord shows as
# a difference rather than being undone.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-10-02-channel-policy.yaml
      id: channel-policy
      author: blueshell
      changes:
        - createTable:
            tableName: channel_policy
            columns:
              - column: {name: channel_id, type: VARCHAR(32), constraints: {primaryKey: true, primaryKeyName: pk_channel_policy, nullable: false}}
              - column: {name: everyone, type: VARCHAR(16), constraints: {nullable: false}}
              - column: {name: members, type: VARCHAR(16), constraints: {nullable: false}}
      rollback:
        - dropTable: {tableName: channel_policy}
