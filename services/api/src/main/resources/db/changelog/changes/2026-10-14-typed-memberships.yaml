# A membership is one unbroken spell and the kind of member someone is lives inside it as a dated
# membership type (api ADR-040). Memberships that run end to start become one, with a type from
# each old start, and NONE becomes REGULAR. Each rewritten membership is kept as it was in
# membership_rewrites, and a rollback writes those back before it drops the tables. Its name sorts it after
# payment-details, which reads the incasso flag of a person's newest membership before any merge.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-10-14-typed-memberships.yaml
      id: typed-memberships
      author: blueshell
      changes:
        - createTable:
            tableName: membership_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_membership_types, nullable: false}
              - column:
                  name: membership_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_membership_types_membership, references: memberships(id)}
              - column: {name: type, type: VARCHAR(16), constraints: {nullable: false}}
              - column: {name: since, type: DATE, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: membership_types
            columnNames: membership_id, since
            constraintName: uk_membership_types_day
        - createTable:
            tableName: membership_rewrites
            columns:
              - column: {name: membership_id, type: BIGINT, constraints: {primaryKey: true, primaryKeyName: pk_membership_rewrites, nullable: false}}
              - column: {name: end_date, type: DATE}
              - column: {name: type, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: activated_on, type: DATE}
              - column: {name: deleted_at, type: DATETIME, constraints: {nullable: false}}
        - customChange:
            class: net.blueshell.api.platform.migration.BackToBackMembershipsMerge
