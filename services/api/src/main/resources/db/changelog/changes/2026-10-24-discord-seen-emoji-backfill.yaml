# The seen emoji backfill's place in each channel, thread and forum post it reads, oldest first back
# from the newest message, so a run that stops resumes where it was. before_message_id is the oldest
# message read so far, null before the first page; done is set once the channel's first message is
# read, or once the bot may no longer read it.
databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/changes/2026-10-24-discord-seen-emoji-backfill.yaml
      id: discord-seen-emoji-backfill
      author: blueshell
      changes:
        - createTable:
            tableName: discord_seen_emoji_backfill
            columns:
              - column: {name: channel_id, type: VARCHAR(20), constraints: {primaryKey: true, nullable: false}}
              - column: {name: before_message_id, type: VARCHAR(20)}
              - column: {name: done, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
      rollback:
        - dropTable:
            tableName: discord_seen_emoji_backfill
