users:
  defaultPassword: "Password123!"
  members: 24
  committeeMembers: 8
  guestUsers: 12
  boardMembers: 4
  admins: 1
  # Named apart from the dev fixtures' own accounts, which a dev database already holds: a
  # second `admin` is refused by the unique index rather than merged.
  namedUsers:
    - username: "seed-admin"
      role: "ADMIN"
      includeMemberData: true
      includeAddress: true
    - username: "seed-member"
      role: "MEMBER"
      includeMemberData: true
      includeAddress: true
    - username: "seed-guest"
      role: "GUEST"

organization:
  committees: 4
  boardName: "Seed Board"
  boardCandidate: "Seed Candidate"

events:
  # The association's own events, as scripts/scrape-public-events.py last read them off the
  # site. Set this to anything else for the generated mix of approved, members-only and past.
  source: public
  durationHours: 3
  pastApprovedPublic: 2
  pastApprovedMembersOnly: 2
  pastUnapprovedPublic: 2
  pastUnapprovedMembersOnly: 2
  futureApprovedPublic: 2
  futureApprovedMembersOnly: 2
  futureUnapprovedPublic: 2
  futureUnapprovedMembersOnly: 2
  signUpFormRatio: 0.45
  bannerRatio: 0.35

contributions:
  activeMemberRatio: 0.50
  pastMemberRatio: 0.30
  previousYearPaidRatio: 0.40
  currentYearPaidRatio: 0.35

randomSeed: 42
