enableGlobalCache: false

# node-modules rather than pnp: Tailwind's compiler calls require() with
# resolution conditions, which Plug'n'Play does not implement, so the island
# cannot build under it. Vite also documents PnP as discouraged and warned on
# every run here.
nodeLinker: node-modules

packageExtensions:
  "@vee-validate/rules@*":
    dependencies:
      vue: "^3.2.0"

  "eslint-plugin-vuetify@*":
    dependencies:
      vue-eslint-parser: "^10.0.0"

# The generated Discord client is published to GitHub Packages, which requires a
# token even though the package is public — only GitHub's container registry
# serves anonymous pulls. NODE_AUTH_TOKEN is set by CI; locally, export it or
# put an npmAuthToken in ~/.yarnrc.yml.
npmScopes:
  esa-blueshell:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"
