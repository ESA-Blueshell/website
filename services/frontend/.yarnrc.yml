enableGlobalCache: false

# node-modules rather than pnp: Tailwind's compiler calls require() with
# resolution conditions, which Plug'n'Play does not implement, so the island
# cannot build under it. Vite also documents PnP as discouraged and warned on
# every run here.
nodeLinker: node-modules

packageExtensions:
  "@vee-validate/rules@*":
    dependencies:
      vue: "^3.2.0"

  "eslint-plugin-vuetify@*":
    dependencies:
      vue-eslint-parser: "^10.0.0"