services:
  frontend:
    image: frontend:dev
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile-dev
    expose:
      - 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/app
      - ../api/openapi.json:/usr/api/openapi.json:ro
      - ../../libs/openapi-specs:/libs/openapi-specs:ro
      - /usr/app/.yarn
      - /usr/app/node_modules
    networks:
      - global_network
    environment:
      - TZ=Europe/Amsterdam
      - VITE_APP_URL=http://localhost:8080
      - VITE_COVERAGE=true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  global_network:
    driver: bridge
