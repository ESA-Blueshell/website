server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|txt|json|map)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri /index.html;
  }
}