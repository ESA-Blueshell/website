server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  # Vite-built, content-hashed bundle output. Filename changes when bytes change,
  # so we can hand out a one-year immutable cache. ^~ ensures this prefix wins
  # over any regex location.
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The api answers at the page's own origin under /api, so the image behaves the
  # same wherever it runs. Every controller is mapped at root, so the prefix comes
  # off here.
  #
  # One rule stated three times -- change one and change the others: the
  # `strip-api-prefix` middleware in
  # platform/cluster/flux/apps/edge/ingressroutes/api.yaml, the dev-server proxy in
  # services/frontend/vite.config.mjs, and this location. In production the Traefik
  # routes win on /api/* (priority 50 against the frontend's 1), so this location
  # is never consulted there; the system-test compose stack is what uses it.
  #
  # ${API_UPSTREAM} is substituted at container start -- the file ships as
  # /etc/nginx/templates/default.conf.template -- because the api is a compose
  # service here and a cluster Service there.
  location ^~ /api/ {
    # A literal proxy_pass host is resolved when the config loads, so an api that is
    # not up yet would stop nginx from starting. A variable defers the lookup.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s;
    set $api_upstream ${API_UPSTREAM};
    # The prefix strip. `break` keeps the rewritten path, which a variable
    # proxy_pass hands on unchanged.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # $http_host keeps the port; $host drops it, and the api reads Host to decide
    # whether the request is same-origin -- so writes come back "Invalid CORS request".
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  # SPA entry document and unhashed root statics (favicon.png, banner.webp, ...).
  # These have stable URLs but mutable content, so we force revalidation on every
  # request. ETag/Last-Modified make 304s cheap.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
