services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    # mail.dev.local → DMS accepts mail for the dev.local domain
    hostname: mail
    env_file:
      - mailserver.env
      - mailserver.dev.env
    ports:
      - "2525:25"  # SMTP relay (unauthenticated, allowed by PERMIT_DOCKER)
      - "587:587"  # SMTP submission (STARTTLS)
      - "143:143"  # IMAP (STARTTLS)
      - "993:993"  # IMAPS (implicit TLS) — used by Listmonk bounce poller
    volumes:
      - mailserver-data:/var/mail/
      - mailserver-state:/var/mail-state/
      - mailserver-logs:/var/log/mail/
      # Pre-seeded accounts (postfix-accounts.cf) + DMS runtime config
      - ./config.dev/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    stop_grace_period: 1m
    healthcheck:
      test: "ss --listening --ipv4 --tcp | grep --silent ':smtp' || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - global_network

volumes:
  mailserver-data:
  mailserver-state:
  mailserver-logs:
