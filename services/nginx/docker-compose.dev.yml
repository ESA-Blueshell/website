services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "80:80"
      - "443:443"
    networks:
      - global_network
    depends_on:
      - api
      - frontend
    volumes:
      - dev-ssl:/etc/nginx/ssl
    profiles:
      - ssl

networks:
  global_network:
    external: true

volumes:
  dev-ssl:
