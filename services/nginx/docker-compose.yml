services:
  nginx:
    image: ghcr.io/esa-blueshell/nginx:${IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontback
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

networks:
  frontback:

volumes:
  letsencrypt:
  certbot-www:
