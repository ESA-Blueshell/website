# ----- helpers --------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {  server frontend:3000; }
upstream api      {  server api:8080;     }

# ----- HTTP-only mode (for initial cert acquisition) ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name esa-blueshell.nl www.esa-blueshell.nl;
    server_tokens off;

    # Serve ACME HTTP-01 challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # Proxy all other traffic to frontend/api (no HTTPS redirect during cert acquisition)
    location /api/ {
        proxy_pass         http://api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
