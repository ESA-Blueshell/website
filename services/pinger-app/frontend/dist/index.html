<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blueshell Pinger</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #0f1419;
        color: #e6edf3;
      }
      main {
        width: 20rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 1rem;
      }
      .state {
        font-size: 2rem;
        font-weight: 600;
        margin: 0.5rem 0;
      }
      .counts {
        opacity: 0.8;
        font-variant-numeric: tabular-nums;
      }
      .message {
        margin: 0.75rem 0 1rem;
        min-height: 1.2em;
        opacity: 0.7;
      }
      .control {
        text-align: left;
        margin: 1rem 0;
      }
      .control label {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        opacity: 0.85;
        margin-bottom: 0.35rem;
      }
      .rate-value {
        font-variant-numeric: tabular-nums;
        opacity: 1;
      }
      input[type="range"] {
        width: 100%;
      }
      .estimate {
        font-size: 0.8rem;
        opacity: 0.7;
        margin-top: 0.35rem;
        font-variant-numeric: tabular-nums;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        opacity: 0.85;
      }
      button {
        padding: 0.5rem 1rem;
        border: 1px solid #30363d;
        border-radius: 0.4rem;
        background: #1f6feb;
        color: #fff;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blueshell Pinger</h1>
      <div class="state" id="state">...</div>
      <div class="counts" id="counts"></div>
      <div class="message" id="message"></div>

      <div class="control">
        <label for="rate">
          <span>Send rate</span>
          <span class="rate-value" id="rate-value"></span>
        </label>
        <input type="range" id="rate" min="1" max="200000" step="1" />
        <div class="estimate" id="estimate"></div>
      </div>

      <div class="control toggle">
        <span>Show me on the leaderboard</span>
        <input type="checkbox" id="optin" />
      </div>

      <button id="signin">Sign in again</button>
    </main>
    <script>
      const app = () => window.go?.main?.App;

      const stateEl = document.getElementById("state");
      const countsEl = document.getElementById("counts");
      const messageEl = document.getElementById("message");
      const rateEl = document.getElementById("rate");
      const rateValueEl = document.getElementById("rate-value");
      const estimateEl = document.getElementById("estimate");
      const optinEl = document.getElementById("optin");

      let bytesPerPacket = 57;

      // Turn a send rate into an approximate uplink Mbps the same way the Go estimator does, from
      // the bytes-per-packet the app reports. It is an estimate: it ignores link-layer framing.
      function estimateMbps(pps) {
        return (pps * bytesPerPacket * 8) / 1_000_000;
      }

      function renderRate(pps) {
        rateValueEl.textContent = `${pps} pps`;
        estimateEl.textContent = `≈ ${estimateMbps(pps).toFixed(2)} Mbps uplink (estimate)`;
      }

      async function initControls() {
        const a = app();
        if (!a) return;
        try {
          const c = await a.Controls();
          bytesPerPacket = c.bytesPerPacket;
          rateEl.min = c.minRate;
          rateEl.max = c.maxRate;
          rateEl.value = c.rate;
          renderRate(c.rate);
        } catch (e) {
          messageEl.textContent = String(e);
        }
        try {
          optinEl.checked = await a.OptInState();
        } catch (e) {
          // Opt-in needs a signed-in member; leave the toggle off until sign-in succeeds.
          optinEl.checked = false;
        }
      }

      rateEl.addEventListener("input", () => renderRate(Number(rateEl.value)));
      rateEl.addEventListener("change", async () => {
        const a = app();
        if (!a) return;
        const applied = await a.SetRate(Number(rateEl.value));
        rateEl.value = applied;
        renderRate(applied);
      });

      optinEl.addEventListener("change", async () => {
        const a = app();
        if (!a) return;
        try {
          optinEl.checked = await a.OptIn(optinEl.checked);
        } catch (e) {
          messageEl.textContent = String(e);
          optinEl.checked = !optinEl.checked;
        }
      });

      document.getElementById("signin").addEventListener("click", () => {
        app()?.SignInAgain();
      });

      async function refresh() {
        const a = app();
        if (!a) return;
        try {
          const s = await a.Status();
          stateEl.textContent = s.signedIn ? s.state || "idle" : "signed out";
          countsEl.textContent = `${s.pps} pps · sent ${s.sent} · errors ${s.errors}`;
          messageEl.textContent = s.message || "";
        } catch (e) {
          messageEl.textContent = String(e);
        }
      }

      initControls();
      setInterval(refresh, 1000);
      refresh();
    </script>
  </body>
</html>
