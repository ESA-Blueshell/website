[project]
name = "rotator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10",
    "click>=8.1",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.8",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rotator*"]
