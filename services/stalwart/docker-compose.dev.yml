services:
  stalwart:
    image: stalwartlabs/mail-server:v0.11.5
    hostname: mail.dev.local
    environment:
      STALWART_FALLBACK_ADMIN_USER: ${STALWART_ADMIN_USER:-admin}
      STALWART_FALLBACK_ADMIN_SECRET: ${STALWART_ADMIN_SECRET:-admin}
    ports:
      # Submission + admin UI. IMAP/POP/SMTP(25) stay on the internal network
      # so dev laptops don't collide with a host-level MTA.
      - "1025:25"
      - "1143:143"
      - "1465:465"
      - "1587:587"
      - "1993:993"
      - "8085:8080"
    volumes:
      - stalwart-data:/opt/stalwart
      - ./config.dev.toml:/opt/stalwart/etc/config.toml:ro
      - ./bootstrap.dev.sh:/docker-entrypoint-init.d/10-bootstrap.sh:ro
    networks:
      - global_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  global_network:
    driver: bridge

volumes:
  stalwart-data:
