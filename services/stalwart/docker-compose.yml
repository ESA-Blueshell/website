services:
  stalwart:
    image: stalwart:dev
    pull_policy: never
    build: .
    hostname: mail.dev.local
    environment:
      # Seeds the administrator the entrypoint and the admin UI sign in as.
      STALWART_RECOVERY_ADMIN: ${STALWART_ADMIN_USER:-admin}:${STALWART_ADMIN_SECRET:-admin}
    ports:
      # Submission + admin UI. IMAP/POP/SMTP(25) stay on the internal network
      # so dev laptops don't collide with a host-level MTA.
      - "1025:25"
      - "1143:143"
      - "1465:465"
      - "1587:587"
      - "1993:993"
      - "8085:8080"
    volumes:
      - stalwart-datastore:/var/lib/stalwart
    networks:
      - global_network
    healthcheck:
      # Stalwart image has no curl/wget. The marker is written once the first
      # start has seeded the datastore; the TCP probe on :25 means it listens.
      test: ["CMD", "bash", "-c", "test -e /var/lib/stalwart/seeded && exec 3<>/dev/tcp/127.0.0.1/25"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  global_network:
    driver: bridge

volumes:
  stalwart-datastore:
