  # Docker apt source — deb822 format (recommended for Debian 13+)
  - path: /etc/apt/sources.list.d/docker.sources
    permissions: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc

  # SSH hardening — keys-only, port 2222
  - path: /etc/ssh/sshd_config.d/10-keys-only.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PermitRootLogin prohibit-password

  - path: /etc/ssh/sshd_config.d/port-2222.conf
    permissions: '0644'
    content: |
      Port 2222

  # Cron: daily backup at 3 AM
  - path: /etc/cron.d/db-backup
    permissions: '0644'
    content: |
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Full backup (DB + env + storage mirror) daily at 3 AM
      0 3 * * * root /usr/local/bin/db-backup >> /var/log/db-backup.log 2>&1

  # Logrotate: db-backup log
  - path: /etc/logrotate.d/db-backup
    permissions: '0644'
    content: |
      /var/log/db-backup.log {
          weekly
          rotate 8
          compress
          missingok
          notifempty
          create 664 root backup
      }

  # Auto-deploy on boot (safety net for Swarm stacks after reboot)
  - path: /etc/systemd/system/website-deploy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Ensure website Swarm stacks are deployed
      After=network-online.target docker.service
      Wants=network-online.target docker.service

      [Service]
      Type=oneshot
      User=website
      ExecStartPre=/bin/bash -lc 'until docker info >/dev/null 2>&1; do sleep 2; done'
      ExecStart=/bin/bash -lc 'cd /src/website && website infra up'
      RemainAfterExit=yes
      Environment=HOME=/src/website

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Install Docker packages after the repo has already been configured by write_files.
  - apt-get update -q
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -q docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # System provisioning — installs Infisical CLI, configures UFW,
  # enables Docker, creates directories, enables systemd services.
  - /usr/local/bin/provision.sh

  # Add users to docker group (created by Docker package install above).
  - usermod -aG docker admin
  - usermod -aG docker website

  # Distribute GitHub deploy key to both users for git access.
  - |
    set -eu
    for user in website admin; do
      home="$(getent passwd "${user}" | cut -d: -f6)"
      install -d -m 0700 -o "${user}" -g "${user}" "${home}/.ssh"
      cp /etc/deploy-keys/github-deploy-key "${home}/.ssh/github-deploy-key"
      cat > "${home}/.ssh/config" <<SSHEOF
    Host github.com
      HostName ssh.github.com
      Port 443
      User git
      IdentityFile ${home}/.ssh/github-deploy-key
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new
    SSHEOF
      chown -R "${user}:${user}" "${home}/.ssh"
      chmod 700 "${home}/.ssh"
      find "${home}/.ssh" -type f -exec chmod 600 {} +
    done

  # Fix env file ownership (written as root by write_files).
  - chown website:website /src/website/services/api/.db.env
  - chown website:website /src/website/services/api/.api.env
  - chown website:website /src/website/services/listmonk/.listmonk.env
  - chown website:website /src/website/infra/.infra.env

  # Docker Swarm.
  - docker swarm init --advertise-addr 127.0.0.1
  - docker network create --driver overlay --attachable traefik-public || true
  - docker network create --driver overlay --attachable monitoring || true

  # Bootstrap the repo over HTTPS when needed, then restore the SSH remote so
  # ongoing git operations keep using the deploy key.
  - |
    set -eu
    if [ ! -d /src/website/.git ]; then
      clone_target=/tmp/website-repo
      origin_ssh='git@github.com:ESA-Blueshell/website.git'
      origin_https='https://x-access-token:__GHCR_TOKEN__@github.com/ESA-Blueshell/website.git'
      git_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
      rm -rf "${clone_target}"
      if [ -n "${git_proxy}" ]; then
        if ! su -m -s /bin/bash website -c "HOME=/src/website GIT_TERMINAL_PROMPT=0 git -c http.proxy='${git_proxy}' -c https.proxy='${git_proxy}' clone --branch '__GIT_BRANCH__' '${origin_https}' '${clone_target}'"; then
          su -m -s /bin/bash website -c "HOME=/src/website GIT_SSH_COMMAND='ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new' git clone --branch '__GIT_BRANCH__' '${origin_ssh}' '${clone_target}'"
        fi
      elif ! su -m -s /bin/bash website -c "HOME=/src/website GIT_TERMINAL_PROMPT=0 git clone --branch '__GIT_BRANCH__' '${origin_https}' '${clone_target}'"; then
        su -m -s /bin/bash website -c "HOME=/src/website GIT_SSH_COMMAND='ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new' git clone --branch '__GIT_BRANCH__' '${origin_ssh}' '${clone_target}'"
      fi
      su -m -s /bin/bash website -c "HOME=/src/website git -C '${clone_target}' remote set-url origin '${origin_ssh}'"
      cp -a "${clone_target}/." /src/website/
      rm -rf "${clone_target}"
    fi
  - chown -R website:website /src/website
  - chmod 750 /src/website
  - find /src/website -name '*.env' -exec chmod 640 {} +
  - install -d -m 0700 -o website -g website /src/website/.ssh
  - test ! -f /src/website/.ssh/authorized_keys || chmod 600 /src/website/.ssh/authorized_keys
  - test ! -f /src/website/.ssh/config || chmod 600 /src/website/.ssh/config
  - test ! -f /src/website/.ssh/github-deploy-key || chmod 600 /src/website/.ssh/github-deploy-key

  # GHCR login for pulling private images.
  - su -m -s /bin/bash website -c "export HOME=/src/website; printf '__GHCR_TOKEN__' | docker login ghcr.io -u '__GHCR_USERNAME__' --password-stdin"

  # Restart services reconfigured by write_files / provision.sh.
  - systemctl restart cron
  - systemctl restart ssh

  # Deploy stacks.
  - su -m -s /bin/bash website -c "HOME=/src/website website infra up"
  - su -m -s /bin/bash website -c "HOME=/src/website bash /src/website/scripts/infisical-bootstrap.sh || echo 'Infisical bootstrap skipped — run manually later if needed.'"

final_message: "Cloud-init complete. SSH on port 2222 (keys-only). Infra deployed."
