#cloud-config

# ── Groups (processed before users) ──────────────────────────────────────────
groups:
  - website
  - docker

# ── Users ────────────────────────────────────────────────────────────────────
# Cloud-init handles user creation, SSH keys, and non-Docker group memberships.
# Docker group membership is added in runcmd (Docker package creates the group
# during package_install, which runs after user creation).
users:
  - default
  - name: admin
    shell: /bin/bash
    sudo: ALL=(ALL) ALL
    groups: sudo, website, backup, docker
    ssh_authorized_keys:
      - "__ADMIN_SSH_PUB__"
  - name: website
    shell: /bin/bash
    homedir: /src/website
    primary_group: website
    groups: website, docker
    ssh_authorized_keys:
      - "__WEBSITE_SSH_PUB__"

# Console passwords (SSH is keys-only via sshd config below).
# type: hash signals that the password field contains a pre-hashed SHA-512 value.
chpasswd:
  expire: false
  users:
    - name: admin
      type: hash
      password: __ADMIN_PASSWORD__
    - name: root
      type: hash
      password: __ROOT_PASSWORD__
    - name: website
      type: hash
      password: __WEBSITE_PASSWORD__

# ── Network/Apt bootstrap ────────────────────────────────────────────────────
# LXD/cloud CI runners can expose IPv4 connectivity before IPv6 is usable, and
# some runners block plain HTTP mirror access. Normalize Debian APT sources to
# HTTPS and make APT prefer IPv4 with retries before package_update runs.
bootcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - |
    cat >/etc/apt/apt.conf.d/99-cloud-init-networking <<'EOF'
    Acquire::ForceIPv4 "true";
    Acquire::Retries "5";
    Acquire::http::Timeout "30";
    Acquire::https::Timeout "30";
    EOF
  - |
    set -eu
    for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
      [ -e "${source}" ] || continue
      sed -i \
        -e 's|http://deb.debian.org|https://deb.debian.org|g' \
        -e 's|http://security.debian.org|https://security.debian.org|g' \
        "${source}"
    done

package_update: true
package_upgrade: true

# ── Packages ─────────────────────────────────────────────────────────────────
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - cron
  - mariadb-client
  - rsync
  - ufw
  - sudo
  - openssh-client
  - openssh-server

# ── Files ────────────────────────────────────────────────────────────────────
# Scripts and config files are placed on disk before runcmd executes.
write_files:
  # System provisioning script (imperative: UFW, Infisical, directories, Docker enable)
  - path: /usr/local/bin/provision.sh
    permissions: '0750'
    encoding: b64
    content: __PROVISION_SH_B64__

  # Backup script
  - path: /usr/local/bin/db-backup
    permissions: '0750'
    owner: root:backup
    encoding: b64
    content: __DB_BACKUP_SH_B64__

  # Website management CLI
  - path: /usr/local/bin/website
    permissions: '0755'
    encoding: b64
    content: __WEBSITE_CLI_SH_B64__

  # GitHub deploy key
  - path: /etc/deploy-keys/github-deploy-key
    permissions: '0600'
    encoding: b64
    content: __GITHUB_DEPLOY_KEY_B64__

  # TransIP API private key for Traefik DNS-01 ACME challenge
  - path: /etc/traefik/transip_key.pem
    permissions: '0600'
    owner: root:root
    encoding: b64
    content: __TRANSIP_KEY_B64__

  # Application env files
  - path: /src/website/services/api/.db.env
    permissions: '0640'
    encoding: b64
    content: __DB_ENV_B64__
  - path: /src/website/services/api/.api.env
    permissions: '0640'
    encoding: b64
    content: __API_ENV_B64__
  - path: /src/website/services/listmonk/.listmonk.env
    permissions: '0640'
    encoding: b64
    content: __LISTMONK_ENV_B64__
  - path: /src/website/infra/.infra.env
    permissions: '0640'
    encoding: b64
    content: __INFRA_ENV_B64__

